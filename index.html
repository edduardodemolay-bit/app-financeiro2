        const original = editandoId !== null ? transacoes.find(t => t.id === editandoId) : null;
        const movFixo = original && (original.metaMov === 'aporte' || original.metaMov === 'retirada');
        if (movFixo) {
          // Aporte continua gasto e retirada continua receita, senão o dinheiro seria contado duas vezes
          dados.type = original.type;
          dados.category = original.category;
        } else {
          const metaDestino = tipo === 'receita' && destinoReceita !== 'conta' ? metas.find(m => String(m.id) === String(destinoReceita)) : null;
          dados.metaId = metaDestino ? metaDestino.id : undefined;
          dados.metaMov = metaDestino ? 'entrada' : undefined;
        }
        let novasTransacoes;
        let novosRecorrentes = recorrentes;
        let novasMetas = metas;
        let afetadas = [];

        const usarDias = editandoId === null && repetirDias && !repetirMensal;
        const cadaDias = Math.floor(Number(aCadaDias));
        const vezes = Math.floor(Number(vezesRepetir));
        if (usarDias && (!(cadaDias >= 1) || cadaDias > 365)) { setErroTransacao('Repita a cada 1 a 365 dias.'); return; }
        if (usarDias && (!(vezes >= 2) || vezes > 60)) { setErroTransacao('Escolha de 2 a 60 vezes no total.'); return; }
        const qtdParcelas = usarDias ? 1 : Math.floor(Number(parcelas) || 1);
        if (editandoId === null && tipo !== 'receita' && !repetirMensal && (qtdParcelas < 1 || qtdParcelas > 48)) { setErroTransacao('Parcele em 1 a 48 vezes.'); return; }
        if (editandoId !== null) {
          // Convidado da gestão compartilhada só edita o que ele mesmo lançou
          if (!podeGerenciar && !(original && meuUid && original.autorUid === meuUid)) { setErroTransacao('Nesta gestão compartilhada, você só pode editar os lançamentos que você fez.'); return; }
          dados.editadoPor = nomeAutor;
        } else {
          dados.autor = nomeAutor;
          if (meuUid) dados.autorUid = meuUid;
        }

        if (editandoId !== null) {
          // Continua "a confirmar" enquanto não foi confirmado; mudar para uma data futura volta a esperar
          const ligadoAMeta = dados.metaMov || (original && original.metaMov);
          const espera = !ligadoAMeta && (dataTransacao > hoje || (original && original.aConfirmar === true));
          if (espera) dados.aConfirmar = true;
          else if (original && original.aConfirmar !== undefined) dados.aConfirmar = false;
          novasTransacoes = ordenarPorData(transacoes.map(t => (t.id === editandoId ? { ...t, ...dados } : t)));
          afetadas = novasTransacoes.filter(t => t.id === editandoId);
        } else if (usarDias) {
          // Repete a cada N dias: cria todos de uma vez; os de data futura ficam como agendados
          const grupo = Date.now();
          afetadas = datasRepeticao(dataTransacao, cadaDias, vezes).map((data, i) => ({ ...dados, id: grupo + i, date: data, repeticaoGrupo: grupo, repeticao: 'a cada ' + cadaDias + ' dias' }));
          novasTransacoes = ordenarPorData([...afetadas, ...transacoes]);
        } else if (!repetirMensal && tipo !== 'receita' && qtdParcelas > 1) {
          // Compra parcelada: uma parcela por mês; a última ajusta os centavos
          const grupo = Date.now();
          const centavos = Math.round(dados.amount * 100);
          const parcela = Math.floor(centavos / qtdParcelas);
          const [a, m, d] = dataTransacao.split('-').map(Number);
          afetadas = Array.from({ length: qtdParcelas }, (_, i) => {
            const mes = somarMeses(a + '-' + String(m).padStart(2, '0'), i);
            const dia = String(Math.min(d, ultimoDia(mes))).padStart(2, '0');
            const valorParcela = (i === qtdParcelas - 1 ? centavos - parcela * (qtdParcelas - 1) : parcela) / 100;
            return { ...dados, id: grupo + i, amount: valorParcela, date: mes + '-' + dia, description: dados.description + ' (' + (i + 1) + '/' + qtdParcelas + ')', parcelaGrupo: grupo };
          });
          novasTransacoes = ordenarPorData([...afetadas, ...transacoes]);
        } else if (repetirMensal) {
          // Conta fixa: lança este mês agora e os próximos automaticamente
          const rec = { id: Date.now(), ...dados, dia: Number(dataTransacao.slice(8, 10)), inicio: mesDe(dataTransacao), gerados: [mesDe(dataTransacao)], ativo: true };
          const nova = { id: Date.now() + 1, ...dados, recorrenteId: rec.id };
          novosRecorrentes = [...recorrentes, rec];
          novasTransacoes = ordenarPorData([nova, ...transacoes]);
          afetadas = [nova];
          const gerado = gerarLancamentosFixos(novosRecorrentes, novasTransacoes, mesDe(hojeISO()));
          if (gerado) { novasTransacoes = gerado.transacoes; novosRecorrentes = gerado.recorrentes; afetadas = [nova, ...gerado.novas]; }
          setRecorrentes(novosRecorrentes);
        } else {
          const nova = { id: Date.now(), ...dados };
          novasTransacoes = ordenarPorData([nova, ...transacoes]);
          afetadas = [nova];
        }
        if (editandoId === null) {
          // Os novos com data futura ficam esperando o "Recebi" / "Paguei"
          const ids = new Set(afetadas.map(t => t.id));
          novasTransacoes = novasTransacoes.map(t => (ids.has(t.id) ? marcarAConfirmar(t, hoje) : t));
          afetadas = novasTransacoes.filter(t => ids.has(t.id));
        }
        // Ao editar, primeiro tira da meta antiga o valor que o lançamento tinha
        const base = original ? sincronizarMeta(metas, original, true) : metas;
        novasMetas = afetadas.reduce((acc, t) => sincronizarMeta(acc, t), base);
        const negativa = metaFicaNegativa(novasMetas);
        if (negativa) { setErroTransacao(avisoMetaNegativa(negativa)); return; }

        const parcelado = editandoId === null && !repetirMensal && !usarDias && tipo !== 'receita' && qtdParcelas > 1;
        const hist = anotar(
          editandoId !== null ? 'Editou lançamento' : usarDias ? 'Lançou com repetição' : parcelado ? 'Lançou compra parcelada' : repetirMensal ? 'Criou conta fixa' : 'Lançou ' + (tipo === 'receita' ? 'receita' : tipo === 'despesa' ? 'despesa' : 'gasto'),
          dados.description + ' · ' + formatarMoeda(dados.amount) + (parcelado ? ' em ' + qtdParcelas + 'x' : '') + (usarDias ? ' · a cada ' + cadaDias + ' dias, ' + vezes + ' vezes' : '') + ' · ' + dados.category
        );

        setTransacoes(novasTransacoes);
        setMetas(novasMetas);
        fecharModalTransacao();
        salvarTudoNoDisco({ transacoes: novasTransacoes, recorrentes: novosRecorrentes, metas: novasMetas, historico: hist });
        const metaMsg = dados.metaMov === 'entrada' ? ' e somada à meta' : '';
        exibirNotificacao((editandoId !== null ? 'Lançamento atualizado' : usarDias ? vezes + ' lançamentos criados, a cada ' + cadaDias + ' dias' : parcelado ? 'Compra lançada em ' + qtdParcelas + ' parcelas' : repetirMensal ? 'Conta fixa criada: repete todo mês' : 'Lançamento guardado') + metaMsg);
      }

      // Salva direto o que o lançamento rápido entendeu
      function salvarLancamentoRapido() {
        if (!previaRapida) return;
        const nova = marcarAConfirmar({ id: Date.now(), ...previaRapida, autor: nomeAutor, viaRapido: true, ...(meuUid ? { autorUid: meuUid } : {}) }, hojeISO());
        const novasTransacoes = ordenarPorData([nova, ...transacoes]);
        const hist = anotar('Lançou pelo lançamento rápido', nova.description + ' · ' + formatarMoeda(nova.amount) + ' · ' + nova.category);
        setTransacoes(novasTransacoes);
        setPreviaRapida(null);
        setTextoRapido('');
        salvarTudoNoDisco({ transacoes: novasTransacoes, historico: hist });
        exibirNotificacao('Guardado: ' + formatarMoeda(nova.amount) + ' em ' + nova.category);
      }

      function interpretarRapido(texto) {
        const r = interpretarTexto(texto, catEntrada, catSaida, hojeISO());
        setPreviaRapida(r);
        if (!r) exibirNotificacao('Não achei o valor. Tente algo como "gastei 46 na padaria"');
      }

      // Abre o formulário completo já preenchido com o que foi entendido
      function corrigirRapido() {
        if (!previaRapida) return;
        abrirModalComData(previaRapida.date);
        setDescricao(previaRapida.description);
        setValor(valorParaCampo(previaRapida.amount));
        setTipo(previaRapida.type);
        setCategoria(previaRapida.category);
        setPreviaRapida(null);
        setTextoRapido('');
      }

      // ===== VOZ (sem pedir permissão) =====
      // O 🎤 do app abre o teclado no campo de lançamento rápido; a pessoa fala pelo 🎤 do próprio
      // teclado (Gboard, ditado do iPhone), que já tem permissão no celular. Assim o site nunca
      // pede acesso ao microfone. Quando ela para de falar, o app entende sozinho.
      // Transcrição: quando o navegador oferece reconhecimento de voz (Chrome, Android, iPhone),
      // o próprio app ouve, escreve no campo enquanto a pessoa fala e entende o lançamento no fim.
      // Onde não houver, abre o teclado para usar o 🎤 do próprio teclado (como antes).
      const reconhecedorRef = useRef(null);
      function usarTecladoParaVoz() {
        const campo = document.getElementById && document.getElementById('texto-rapido');
        if (campo && campo.focus) campo.focus();
        setOuvindo('teclado');
      }
      function ouvirVoz() {
        // Tocar de novo enquanto grava = parar
        if (reconhecedorRef.current) { try { reconhecedorRef.current.stop(); } catch (e) {} return; }
        setAvisoVoz('');
        setPreviaRapida(null);
        clearTimeout(timerRapido.current);
        const Reconhecimento = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!Reconhecimento) { usarTecladoParaVoz(); return; }
        let rec;
        try { rec = new Reconhecimento(); } catch (e) { usarTecladoParaVoz(); return; }
        rec.lang = 'pt-BR';
        rec.interimResults = true;
        // Contínuo: não corta a frase na primeira pausa. O app para sozinho depois de ~2 s de silêncio.
        rec.continuous = true;
        rec.maxAlternatives = 1;
        let textoOuvido = '';
        let timerSilencio = null;
        const parar = () => { try { rec.stop(); } catch (e) {} };
        const esperarSilencio = (ms) => { clearTimeout(timerSilencio); timerSilencio = setTimeout(parar, ms); };
        const limite = setTimeout(parar, 20000); // no máximo 20 s gravando
        rec.onresult = (ev) => {
          textoOuvido = juntarTranscricao(ev.results);
          setTextoRapido(textoOuvido);
          esperarSilencio(1800);
        };
        rec.onstart = () => esperarSilencio(7000); // ninguém falou: desliga
        rec.onerror = (ev) => {
          const mensagens = {
            'not-allowed': 'O app não tem permissão para usar o microfone. Libere o microfone para este site nas configurações do navegador, ou use o 🎤 do teclado.',
            'service-not-allowed': 'Este aparelho não deixou o app usar o reconhecimento de voz. Use o 🎤 do teclado: toque no campo e depois no microfone do teclado.',
            'no-speech': 'Não ouvi nada. Toque no microfone e fale de novo.',
            'audio-capture': 'Nenhum microfone encontrado neste aparelho.',
            'network': 'Sem internet para transcrever a voz. Tente de novo ou use o 🎤 do teclado.'
          };
          if (ev.error !== 'aborted') setAvisoVoz(mensagens[ev.error] || 'Não consegui ouvir. Tente de novo ou use o 🎤 do teclado.');
        };
        rec.onend = () => {
          clearTimeout(timerSilencio); clearTimeout(limite);
          reconhecedorRef.current = null;
          setOuvindo(false);
          // Usa o último texto ouvido, mesmo que o celular não tenha marcado como "final"
          const texto = textoOuvido;
          if (!texto) return;
          setTextoRapido(texto);
          const r = interpretarTexto(texto, catEntrada, catSaida, hojeISO());
          if (r) setPreviaRapida(r);
          else setAvisoVoz('Entendi "' + texto + '", mas não achei o valor. Fale algo como "gastei 30 no mercado".');
        };
        reconhecedorRef.current = rec;
        setOuvindo('gravando');
        try { rec.start(); } catch (e) { reconhecedorRef.current = null; usarTecladoParaVoz(); }
      }
      // Para de ouvir se a pessoa sair da tela
      useEffect(() => () => { if (reconhecedorRef.current) { try { reconhecedorRef.current.abort(); } catch (e) {} } }, []);

      // Entende sozinho ~1 s depois que a pessoa para de falar ou digitar
      const timerRapido = useRef(null);
      function mudarTextoRapido(texto) {
        setTextoRapido(texto);
        setPreviaRapida(null);
        clearTimeout(timerRapido.current);
        if (!/\d/.test(numerosPorExtenso(texto))) return;
        timerRapido.current = setTimeout(() => {
          const r = interpretarTexto(texto, catEntrada, catSaida, hojeISO());
          if (r) { setPreviaRapida(r); setOuvindo(false); }
        }, 1100);
      }

      function fecharModalTransacao() {
        setModalTransacaoAberto(false);
        setEditandoId(null);
        setRepetirMensal(false);
        setRepetirDias(false);
        setDoCalendario(false);
        setDestinoReceita('conta');
        setParcelas('1');
        setDescricao(''); setValor(''); setErroTransacao('');
      }

      function trocarTipo(novoTipo) {
        setTipo(novoTipo);
        if (!categoriasDoTipo(novoTipo).includes(categoria)) setCategoria(CATEGORIA_PADRAO[novoTipo]);
      }

      function abrirEdicao(t) {
        setEditandoId(t.id);
        setRepetirMensal(false);
        setDescricao(t.description);
        setValor(valorParaCampo(t.amount));
        setTipo(t.type);
        setCategoria(t.category);
        setDataTransacao(t.date);
        setDestinoReceita(t.metaMov === 'entrada' && t.metaId ? String(t.metaId) : 'conta');
        setErroTransacao('');
        setModalTransacaoAberto(true);
      }

      function pararRecorrente(id) { if (!podeGerenciar) { avisoSoDono(); return; }
        if (!confirm('Parar de lançar esta conta todo mês? Os lançamentos que já existem continuam no extrato.')) return;
        const novos = recorrentes.map(r => (r.id === id ? { ...r, ativo: false } : r));
        setRecorrentes(novos);
        salvarTudoNoDisco({ recorrentes: novos });
        exibirNotificacao('Conta fixa encerrada');
      }

      function excluirTransacao(id) { if (!podeGerenciar) { avisoSoDono(); return; }
        const alvo = transacoes.find(t => t.id === id);
        const novasMetas = alvo ? sincronizarMeta(metas, alvo, true) : metas;
        const negativa = metaFicaNegativa(novasMetas);
        if (negativa) { exibirNotificacao(avisoMetaNegativa(negativa)); return; }
        const aviso = alvo && alvo.metaId ? 'Deseja excluir este lançamento? O valor também sai da meta.' : 'Deseja excluir este lançamento?';
        if (confirm(aviso)) {
          const novasTransacoes = transacoes.filter(t => t.id !== id);
          const hist = alvo ? anotar('Excluiu lançamento', alvo.description + ' · ' + formatarMoeda(alvo.amount) + ' · ' + alvo.category) : historico;
          setTransacoes(novasTransacoes);
          setMetas(novasMetas);
          salvarTudoNoDisco({ transacoes: novasTransacoes, metas: novasMetas, historico: hist });
        }
      }

      // ===== CONFIRMAR "RECEBI" / "PAGUEI" =====
      const podeMexer = (t) => podeGerenciar || (meuUid && t.autorUid === meuUid);
      // O lançamento a confirmar passa a contar no saldo. Confirmado antes da data, fica com a data de hoje.
      function confirmarLancamento(t) {
        if (!podeMexer(t)) { exibirNotificacao('Nesta gestão compartilhada, você só pode confirmar o que você mesmo lançou.'); return; }
        const entrada = t.type === 'receita';
        const pergunta = entrada
          ? 'Deu certo? Confirmar que você RECEBEU ' + formatarMoeda(t.amount) + (t.devedor ? ' de ' + t.devedor : '') + ' (' + t.description + ')?\n\nO valor entra no seu saldo.'
          : 'Deu certo? Confirmar que você PAGOU ' + formatarMoeda(t.amount) + ' (' + t.description + ')?\n\nO valor sai do seu saldo.';
        if (!confirm(pergunta)) return;
        const dia = hojeISO();
        // Confirmado antes do dia: fica com a data de hoje, e a data combinada é guardada para o "desfazer"
        const novasTransacoes = ordenarPorData(transacoes.map(x => (x.id === t.id ? { ...x, aConfirmar: false, date: x.date > dia ? dia : x.date, ...(x.date > dia ? { dataPrevista: x.date } : {}), confirmadoEm: dia, confirmadoPor: nomeAutor } : x)));
        const hist = anotar(entrada ? 'Confirmou que recebeu' : 'Confirmou que pagou', (t.devedor ? t.devedor + ' · ' : '') + t.description + ' · ' + formatarMoeda(t.amount));
        setTransacoes(novasTransacoes);
        salvarTudoNoDisco({ transacoes: novasTransacoes, historico: hist });
        exibirNotificacao((entrada ? 'Recebido: ' : 'Pago: ') + formatarMoeda(t.amount) + (entrada ? ' entrou no saldo' : ' saiu do saldo'));
      }
      const botaoConfirmar = (t) => podeMexer(t) && (
        <button onClick={() => confirmarLancamento(t)} title={t.type === 'receita' ? 'Confirmar que recebeu' : 'Confirmar que pagou'} style={{ display: 'inline-flex', alignItems: 'center', gap: '4px', backgroundColor: t.type === 'receita' ? 'var(--accent)' : 'var(--danger-text)', color: '#ffffff', border: 'none', borderRadius: '8px', padding: '6px 10px', fontWeight: '700', fontSize: '12px', cursor: 'pointer', whiteSpace: 'nowrap' }}>
          <Check size={14} /> {t.type === 'receita' ? 'Recebi' : 'Paguei'}
        </button>
      );
      // Confirmou errado: volta a esperar o "Recebi" / "Paguei" (e volta para a data combinada)
      function desfazerConfirmacao(t) {
        if (!podeMexer(t)) { exibirNotificacao('Nesta gestão compartilhada, você só pode mexer no que você mesmo lançou.'); return; }
        if (!confirm('Desfazer a confirmação de "' + t.description + '" (' + formatarMoeda(t.amount) + ')? Ele sai do saldo e volta a esperar o ' + (t.type === 'receita' ? 'Recebi.' : 'Paguei.'))) return;
        const novasTransacoes = ordenarPorData(transacoes.map(x => (x.id === t.id ? { ...x, aConfirmar: true, date: x.dataPrevista || x.date, dataPrevista: undefined, confirmadoEm: undefined, confirmadoPor: undefined } : x)));
        const hist = anotar('Desfez confirmação', (t.devedor ? t.devedor + ' · ' : '') + t.description + ' · ' + formatarMoeda(t.amount));
        setTransacoes(novasTransacoes);
        salvarTudoNoDisco({ transacoes: novasTransacoes, historico: hist });
        exibirNotificacao('Confirmação desfeita: ' + t.description + ' voltou a esperar');
      }
      // Selo do lançamento que ainda não conta no saldo, ou que já foi confirmado
      const seloPendente = (t) => {
        if (t.aConfirmar === false && t.confirmadoEm) return (
          <span title={'Confirmado por ' + (t.confirmadoPor || 'você')} style={{ display: 'inline-flex', alignItems: 'center', gap: '6px', fontSize: '10px', padding: '2px 8px', borderRadius: '6px', backgroundColor: 'rgba(var(--accent-rgb), 0.15)', color: 'var(--accent-text)', fontWeight: '700' }}>
            ✓ {t.type === 'receita' ? 'Recebido' : 'Pago'} em {formatarDataBR(t.confirmadoEm).slice(0, 5)}
            {podeMexer(t) && <button onClick={() => desfazerConfirmacao(t)} style={{ background: 'none', border: 'none', padding: 0, color: 'var(--text-muted)', fontSize: '10px', fontWeight: '600', textDecoration: 'underline', cursor: 'pointer' }}>desfazer</button>}
          </span>
        );
        if (t.date > hoje) return <span style={{ fontSize: '10px', padding: '2px 8px', borderRadius: '6px', border: '1px dashed var(--border-strong)', color: 'var(--text-muted)', fontWeight: '700', textTransform: 'uppercase' }}>Agendado</span>;
        if (t.aConfirmar === true) return <span style={{ fontSize: '10px', padding: '2px 8px', borderRadius: '6px', border: '1px dashed var(--c-amber)', color: 'var(--c-amber)', fontWeight: '700', textTransform: 'uppercase' }}>A confirmar</span>;
        return null;
      };

      // ===== QUEM ME DEVE =====
      // "Emprestei" já vem marcado: o valor sai do saldo hoje e volta quando a pessoa pagar.
      // Venda fiado (nenhum dinheiro saiu) é só desmarcar.
      const FORM_DIVIDA_VAZIO = { nome: '', valor: '', descricao: '', data: '', telefone: '', categoria: 'Outros', emprestei: true };
      const [formDivida, setFormDivida] = useState(FORM_DIVIDA_VAZIO);
      const [erroDivida, setErroDivida] = useState('');
      const [parteAberta, setParteAberta] = useState(null);
      const [valorParte, setValorParte] = useState('');
      const mudarDivida = (campo, valorCampo) => setFormDivida(f => ({ ...f, [campo]: valorCampo }));

      function anotarDivida(e) {
        e.preventDefault();
        setErroDivida('');
        const nome = formDivida.nome.trim().replace(/\s+/g, ' ');
        const v = Math.round(lerValor(formDivida.valor) * 100) / 100;
        if (!nome) { setErroDivida('Escreva o nome de quem está devendo.'); return; }
        if (!(v > 0)) { setErroDivida('Digite o valor, por exemplo 150 ou 49,90.'); return; }
        const dia = hojeISO();
        const motivo = formDivida.descricao.trim();
        const telefone = formDivida.telefone.replace(/\D/g, '');
        const autoria = { autor: nomeAutor, ...(meuUid ? { autorUid: meuUid } : {}) };
        const id = Date.now();
        // Mesmo nome escrito de outro jeito ("joão" / "João") vira a mesma pessoa
        const nomeIgual = nomesDevedores.find(n => semAcento(n).trim() === semAcento(nome)) || nome;
        const divida = { id, description: motivo || (formDivida.emprestei ? 'Empréstimo' : 'Dívida'), amount: v, category: formDivida.categoria, type: 'receita', date: formDivida.data || dia, aConfirmar: true, devedor: nomeIgual, ...(telefone ? { telefone } : {}), ...autoria };
        const novos = [divida];
        // Emprestou em dinheiro: o valor sai da conta agora e volta quando a pessoa pagar
        if (formDivida.emprestei) novos.push({ id: id + 1, description: 'Emprestei para ' + nomeIgual + (motivo ? ' (' + motivo + ')' : ''), amount: v, category: 'Outros', type: 'gasto', date: dia, emprestimoPara: nomeIgual, ...autoria });
        const novasTransacoes = ordenarPorData([...novos, ...transacoes]);
        const hist = anotar('Anotou dívida', nomeIgual + ' · ' + divida.description + ' · ' + formatarMoeda(v));
        setTransacoes(novasTransacoes);
        salvarTudoNoDisco({ transacoes: novasTransacoes, historico: hist });
        setFormDivida(FORM_DIVIDA_VAZIO);
        exibirNotificacao('Anotado: ' + nomeIgual + ' te deve ' + formatarMoeda(v));
      }

      // Recebeu só uma parte: a parte vira receita no saldo e a dívida fica com o que falta
      function receberParte(t) {
        const v = Math.round(lerValor(valorParte) * 100) / 100;
        if (!(v > 0)) { exibirNotificacao('Digite quanto recebeu, por exemplo 50'); return; }
        if (!podeMexer(t)) { exibirNotificacao('Nesta gestão compartilhada, você só pode confirmar o que você mesmo lançou.'); return; }
        setParteAberta(null); setValorParte('');
        if (v >= Number(t.amount) - 0.005) { confirmarLancamento(t); return; }
        const dia = hojeISO();
        const falta = Math.round((Number(t.amount) - v) * 100) / 100;
        const recebido = { ...t, id: Date.now(), amount: v, date: dia, aConfirmar: false, confirmadoEm: dia, confirmadoPor: nomeAutor, description: t.description + ' (parte)', autor: nomeAutor, ...(meuUid ? { autorUid: meuUid } : {}) };
        const novasTransacoes = ordenarPorData([recebido, ...transacoes.map(x => (x.id === t.id ? { ...x, amount: falta } : x))]);
        const hist = anotar('Recebeu parte da dívida', t.devedor + ' · ' + t.description + ' · ' + formatarMoeda(v) + ' (falta ' + formatarMoeda(falta) + ')');
        setTransacoes(novasTransacoes);
        salvarTudoNoDisco({ transacoes: novasTransacoes, historico: hist });
        exibirNotificacao('Recebido ' + formatarMoeda(v) + ' de ' + t.devedor + '. Falta ' + formatarMoeda(falta));
      }

      // Abre o WhatsApp com uma mensagem educada de lembrete (sem número, a pessoa escolhe o contato)
      const linkCobranca = (p) => {
        const itens = p.itens.map(t => t.description + ' (' + formatarMoeda(t.amount) + ')').join(', ');
        const texto = 'Oi, ' + p.nome.split(' ')[0] + '! Tudo bem? Passando para lembrar do valor de ' + formatarMoeda(p.total) + ': ' + itens + '. Obrigado!';
        const tel = String(p.telefone || '').replace(/\D/g, '');
        const numero = tel.length === 10 || tel.length === 11 ? '55' + tel : tel;
        return 'https://wa.me/' + numero + '?text=' + encodeURIComponent(texto);
      };

      const transacoesFiltradas = transacoes.filter(t => {
        if (filtroTipo !== 'todas' && t.type !== filtroTipo) return false;
        if (filtroCategoria !== 'todas' && t.category !== filtroCategoria) return false;
        if (termoPesquisa && !t.description.toLowerCase().includes(termoPesquisa.toLowerCase())) return false;
        return true;
      });

      const [erroMeta, setErroMeta] = useState('');

      function adicionarMeta(e) {
        e.preventDefault(); if (!podeGerenciar) { avisoSoDono(); return; }
        setErroMeta('');
        const objetivo = lerValor(objetivoMeta);
        const guardado = economizadoMeta === '' ? 0 : lerValor(economizadoMeta);
        if (!nomeMeta.trim()) { setErroMeta('Dê um nome para a meta.'); return; }
        if (isNaN(objetivo) || objetivo <= 0) { setErroMeta('Digite o valor desejado, por exemplo 5000 ou 5.000,00.'); return; }
        if (isNaN(guardado) || guardado < 0) { setErroMeta('O valor já guardado não pode ser negativo.'); return; }

        const novasMetas = editandoMetaId !== null
          ? metas.map(m => (m.id === editandoMetaId ? { ...m, nome: nomeMeta.trim(), objetivo, inicial: guardado } : m))
          : [...metas, { id: Date.now(), nome: nomeMeta.trim(), objetivo, inicial: guardado, aportes: [] }];
        const negativa = metaFicaNegativa(novasMetas);
        if (negativa) { setErroMeta('O valor inicial não pode ser tão baixo: já foram retirados ' + formatarMoeda(guardado - guardadoDaMeta(negativa)) + ' desta meta.'); return; }

        const hist = anotar(editandoMetaId !== null ? 'Editou meta' : 'Criou meta', nomeMeta.trim() + ' · objetivo ' + formatarMoeda(objetivo));
        setMetas(novasMetas);
        fecharModalMeta();
        salvarTudoNoDisco({ metas: novasMetas, historico: hist });
      }

      function fecharModalMeta() {
        setModalMetaAberto(false);
        setEditandoMetaId(null);
        setNomeMeta(''); setObjetivoMeta(''); setEconomizadoMeta(''); setErroMeta('');
      }

      function abrirEdicaoMeta(meta) { if (!podeGerenciar) { avisoSoDono(); return; }
        setEditandoMetaId(meta.id);
        setNomeMeta(meta.nome);
        setObjetivoMeta(valorParaCampo(meta.objetivo));
        setEconomizadoMeta(valorParaCampo(meta.inicial || 0));
        setErroMeta('');
        setModalMetaAberto(true);
      }

      function alterarValorMeta(id, operacao) {
        const lido = lerValor(valoresAporte[id]);
        if (isNaN(lido) || lido <= 0) { exibirNotificacao('Digite um valor, por exemplo 50,00'); return; }
        const quantia = Math.round(lido * 100) / 100;

        const metaAlvo = metas.find(m => m.id === id);
        if (!metaAlvo) return;
        const nomeDaMeta = metaAlvo.nome;
        // Só retira o que a meta tem; só guarda o que a conta tem
        const guardadoAtual = Math.round(guardadoDaMeta(metaAlvo) * 100) / 100;
        if (operacao !== 'somar' && quantia > guardadoAtual) {
          exibirNotificacao(guardadoAtual <= 0 ? 'Esta meta está zerada: não há o que retirar' : 'A meta só tem ' + formatarMoeda(guardadoAtual) + ' para retirar');
          return;
        }
        const saldoAtual = Math.round(saldoContaHoje * 100) / 100;
        if (operacao === 'somar' && quantia > saldoAtual) {
          exibirNotificacao(saldoAtual <= 0 ? 'A conta está sem saldo. Lance a receita primeiro ou mande a receita direto para a meta' : 'A conta só tem ' + formatarMoeda(saldoAtual) + ' para guardar');
          return;
        }

        const novaTransacao = {
          id: Date.now(),
          description: operacao === 'somar' ? `Aporte: ${nomeDaMeta}` : `Retirada: ${nomeDaMeta}`,
          amount: quantia,
          category: 'Metas',
          type: operacao === 'somar' ? 'gasto' : 'receita',
          date: hojeISO(),
          metaId: id,
          metaMov: operacao === 'somar' ? 'aporte' : 'retirada',
          autor: nomeAutor,
          ...(meuUid ? { autorUid: meuUid } : {})
        };

        const novasMetas = sincronizarMeta(metas, novaTransacao);
        const novasTransacoes = [novaTransacao, ...transacoes].sort((a, b) => new Date(b.date) - new Date(a.date));

        setMetas(novasMetas);
        setTransacoes(novasTransacoes);
        setValoresAporte(prev => ({ ...prev, [id]: '' }));
        const hist = anotar(operacao === 'somar' ? 'Guardou na meta' : 'Retirou da meta', nomeDaMeta + ' · ' + formatarMoeda(quantia));

        salvarTudoNoDisco({ metas: novasMetas, transacoes: novasTransacoes, historico: hist });
      }

      function excluirMeta(id) { if (!podeGerenciar) { avisoSoDono(); return; }
        const meta = metas.find(m => m.id === id);
        if (!meta) return;
        // Dinheiro que saiu da conta para a meta (aportes − retiradas) volta para a conta; o valor inicial não veio da conta
        const devolver = Math.round((meta.aportes || []).filter(a => a.tipo !== 'entrada').reduce((s, a) => s + Number(a.valor), 0) * 100) / 100;
        const aviso = devolver > 0
          ? 'Deseja excluir esta meta? Os ' + formatarMoeda(devolver) + ' que você guardou nela voltam para a conta, assim como as receitas que entraram direto nela.'
          : 'Deseja excluir esta meta? As receitas que entraram direto nela passam a contar na conta.';
        if (confirm(aviso)) {
          const novasMetas = metas.filter(m => m.id !== id);
          // Receitas que iam direto para esta meta voltam a ser da conta; aportes e retiradas ficam no extrato como histórico
          let novasTransacoes = transacoes.map(t => (t.metaId === id ? { ...t, metaId: undefined, metaMov: t.metaMov === 'entrada' ? undefined : t.metaMov } : t));
          if (devolver > 0) novasTransacoes = ordenarPorData([{ id: Date.now(), description: 'Devolução da meta excluída: ' + meta.nome, amount: devolver, category: 'Metas', type: 'receita', date: hojeISO() }, ...novasTransacoes]);
          const novosRecorrentes = recorrentes.map(r => (r.metaId === id ? { ...r, metaId: undefined, metaMov: undefined } : r));
          setMetas(novasMetas);
          setTransacoes(novasTransacoes);
          setRecorrentes(novosRecorrentes);
          const hist = anotar('Excluiu meta', meta.nome + (devolver > 0 ? ' · ' + formatarMoeda(devolver) + ' voltaram para a conta' : ''));
          salvarTudoNoDisco({ metas: novasMetas, transacoes: novasTransacoes, recorrentes: novosRecorrentes, historico: hist });
        }
      }

      // Exclui uma movimentação da meta (e o lançamento ligado a ela, se existir)
      function excluirMovimentoMeta(meta, mov) { if (!podeGerenciar) { avisoSoDono(); return; }
        const novasMetas = metas.map(m => (m.id === meta.id ? { ...m, aportes: (m.aportes || []).filter(a => a.id !== mov.id) } : m));
        const negativa = metaFicaNegativa(novasMetas);
        if (negativa) { exibirNotificacao(avisoMetaNegativa(negativa)); return; }
        if (!confirm('Excluir esta movimentação de ' + formatarMoeda(Math.abs(mov.valor)) + ' da meta "' + meta.nome + '"? O lançamento ligado a ela também sai do extrato.')) return;
        const novasTransacoes = mov.transacaoId ? transacoes.filter(t => t.id !== mov.transacaoId) : transacoes;
        const hist = anotar('Excluiu movimentação da meta', meta.nome + ' · ' + formatarMoeda(Math.abs(mov.valor)));
        setMetas(novasMetas);
        setTransacoes(novasTransacoes);
        salvarTudoNoDisco({ metas: novasMetas, transacoes: novasTransacoes, historico: hist });
        exibirNotificacao('Movimentação excluída');
      }

      // ===== DADOS DE EXEMPLO =====
      // Ajudam a entender o app. Ficam marcados como "Exemplo" e saem todos de uma vez.
      function carregarExemplos() { if (!podeGerenciar) { avisoSoDono(); return; }
        const mes = mesDe(hojeISO());
        const diaHoje = Number(hojeISO().slice(8, 10));
        const d = (dia) => mes + '-' + String(Math.min(dia, diaHoje)).padStart(2, '0');
        let id = Date.now();
        const metaReserva = { id: id++, nome: 'Reserva de emergência (exemplo)', objetivo: 10000, inicial: 1500, aportes: [], exemplo: true };
        const metaViagem = { id: id++, nome: 'Viagem de férias (exemplo)', objetivo: 4000, inicial: 0, aportes: [], exemplo: true };
        const ex = (description, amount, category, type, dia, extra = {}) => ({ id: id++, description, amount, category, type, date: d(dia), exemplo: true, ...extra });
        const lista = [
          ex('Salário', 3500, 'Salário', 'receita', 5),
          ex('Venda de produto', 450, 'Vendas', 'receita', 12),
          ex('Venda online', 300, 'Vendas', 'receita', 15, { metaId: metaViagem.id, metaMov: 'entrada' }),
          ex('Aluguel', 1100, 'Moradia', 'despesa', 10),
          ex('Conta de luz', 180, 'Moradia', 'despesa', 10),
          ex('Internet', 100, 'Moradia', 'despesa', 10),
          ex('Escola / curso', 250, 'Educação', 'despesa', 8),
          ex('Mercado do mês', 620, 'Alimentação', 'gasto', 6),
          ex('Lanche', 45, 'Alimentação', 'gasto', 14),
          ex('Uber / ônibus', 130, 'Transporte', 'gasto', 9),
          ex('Farmácia', 85, 'Saúde', 'gasto', 11),
          ex('Cinema', 60, 'Lazer', 'gasto', 13),
          ex('Aporte: Reserva de emergência (exemplo)', 200, 'Metas', 'gasto', 6, { metaId: metaReserva.id, metaMov: 'aporte' })
        ];
        const novasMetas = lista.reduce((acc, t) => sincronizarMeta(acc, t), [...metas, metaReserva, metaViagem]);
        const novasTransacoes = ordenarPorData([...lista, ...transacoes]);
        // Previsão de ganhos de exemplo, só onde ainda não há valor definido
        const novosLimites = { ...limitesCategorias };
        if (!Number(novosLimites['prev:Salário'])) novosLimites['prev:Salário'] = 3500;
        if (!Number(novosLimites['prev:Vendas'])) novosLimites['prev:Vendas'] = 800;
        setMetas(novasMetas);
        setTransacoes(novasTransacoes);
        setLimitesCategorias(novosLimites);
        setMesSelecionado(mes);
        salvarTudoNoDisco({ metas: novasMetas, transacoes: novasTransacoes, limitesCategorias: novosLimites });
        exibirNotificacao('Dados de exemplo carregados');
      }

      function removerExemplos() { if (!podeGerenciar) { avisoSoDono(); return; }
        if (!confirm('Remover todos os dados de exemplo? Seus lançamentos e metas reais continuam.')) return;
        const removidas = transacoes.filter(t => t.exemplo);
        let novasMetas = removidas.reduce((acc, t) => sincronizarMeta(acc, t, true), metas.filter(m => !m.exemplo));
        const idsMetasExemplo = metas.filter(m => m.exemplo).map(m => m.id);
        const novasTransacoes = transacoes.filter(t => !t.exemplo).map(t => (idsMetasExemplo.includes(t.metaId) ? { ...t, metaId: undefined, metaMov: undefined } : t));
        setMetas(novasMetas);
        setTransacoes(novasTransacoes);
        salvarTudoNoDisco({ metas: novasMetas, transacoes: novasTransacoes });
        exibirNotificacao('Dados de exemplo removidos');
      }

      // ===== CATEGORIAS DO PLANEJAMENTO (criar, renomear, ajustar valor, excluir) =====
      function abrirCategoria(grupo, cat) { if (!podeGerenciar) { avisoSoDono(); return; }
        setGrupoEditando(grupo);
        setCriandoCategoria(!cat);
        setCategoriaEditando(cat || '');
        setNomeCategoriaEdit(cat || '');
        setNovoLimiteCategoria(cat ? valorParaCampo(Number(limitesCategorias[chaveLimite(grupo, cat)] || 0)) : '');
        setErroCategoria('');
        setModalOrcamentoAberto(true);
      }

      function fecharCategoria() {
        setModalOrcamentoAberto(false);
        setNovoLimiteCategoria('');
        setErroCategoria('');
      }

      // Troca o nome da categoria em todos os lançamentos e contas fixas do mesmo grupo
      const trocarCategoriaNosLancamentos = (grupo, de, para) => {
        const doGrupo = (t) => (grupo === 'entrada' ? t.type === 'receita' : t.type !== 'receita');
        return {
          transacoes: transacoes.map(t => (t.category === de && doGrupo(t) ? { ...t, category: para } : t)),
          recorrentes: recorrentes.map(r => (r.category === de && doGrupo(r) ? { ...r, category: para } : r))
        };
      };

      function handleSalvarLimiteCategoria(e) {
        e.preventDefault(); if (!podeGerenciar) { avisoSoDono(); return; }
        setErroCategoria('');
        const val = novoLimiteCategoria === '' ? 0 : lerValor(novoLimiteCategoria);
        if (isNaN(val) || val < 0) { setErroCategoria('Digite um valor válido, por exemplo 800,00'); return; }

        const grupo = grupoEditando;
        const podeRenomear = criandoCategoria || ehCategoriaCriada(grupo, categoriaEditando);
        const nome = podeRenomear ? nomeCategoriaEdit.trim().replace(/\s+/g, ' ') : categoriaEditando;
        if (!nome) { setErroCategoria('Dê um nome para a categoria, por exemplo "Pets" ou "Freelance".'); return; }
        if (nome.length > 30) { setErroCategoria('Use um nome com até 30 letras.'); return; }
        // Recriar uma categoria que tinha ficado "só naquele mês" volta a usá-la
        const parada = criandoCategoria && (categoriasExtras[grupo] || []).find(c => c.toLowerCase() === nome.toLowerCase() && (categoriasExtras.info[chaveInfo(grupo, c)] || {}).ate);
        if (parada) {
          const novasExtras2 = { ...categoriasExtras, info: { ...categoriasExtras.info, [chaveInfo(grupo, parada)]: { ...categoriasExtras.info[chaveInfo(grupo, parada)], confirmada: true, ate: null } } };
          const novosLimites2 = { ...limitesCategorias, [chaveLimite(grupo, parada)]: val };
          setCategoriasExtras(novasExtras2);
          setLimitesCategorias(novosLimites2);
          fecharCategoria();
          const hist2 = anotar('Voltou a usar categoria', parada + ' · ' + formatarMoeda(val));
          salvarTudoNoDisco({ categoriasExtras: novasExtras2, limitesCategorias: novosLimites2, historico: hist2 });
          exibirNotificacao('"' + parada + '" voltou a valer a partir de agora');
          return;
        }
        const todas = [...catEntrada, ...catSaida, 'Metas'].filter(c => c !== categoriaEditando);
        if (nome !== categoriaEditando && todas.some(c => c.toLowerCase() === nome.toLowerCase())) { setErroCategoria('Já existe uma categoria chamada "' + nome + '".'); return; }

        let novosLimites = { ...limitesCategorias };
        let novasExtras = categoriasExtras;
        let novos = { transacoes, recorrentes };
        if (criandoCategoria) {
          // Guarda o mês em que nasceu: no mês seguinte o app pergunta se ela continua
          novasExtras = { ...categoriasExtras, [grupo]: [...(categoriasExtras[grupo] || []), nome], info: { ...categoriasExtras.info, [chaveInfo(grupo, nome)]: { criadaEm: mesSelecionado, confirmada: false } } };
        } else if (nome !== categoriaEditando) {
          const info = { ...categoriasExtras.info };
          if (info[chaveInfo(grupo, categoriaEditando)]) { info[chaveInfo(grupo, nome)] = info[chaveInfo(grupo, categoriaEditando)]; delete info[chaveInfo(grupo, categoriaEditando)]; }
          novasExtras = { ...categoriasExtras, [grupo]: categoriasExtras[grupo].map(c => (c === categoriaEditando ? nome : c)), info };
          delete novosLimites[chaveLimite(grupo, categoriaEditando)];
          novos = trocarCategoriaNosLancamentos(grupo, categoriaEditando, nome);
        }
        novosLimites[chaveLimite(grupo, nome)] = val;

        setLimitesCategorias(novosLimites);
        setCategoriasExtras(novasExtras);
        setTransacoes(novos.transacoes);
        setRecorrentes(novos.recorrentes);
        fecharCategoria();
        const hist = anotar(criandoCategoria ? 'Criou categoria' : nome !== categoriaEditando ? 'Renomeou categoria' : 'Ajustou planejamento', (nome !== categoriaEditando && !criandoCategoria ? categoriaEditando + ' → ' : '') + nome + ' · ' + formatarMoeda(val));
        salvarTudoNoDisco({ limitesCategorias: novosLimites, categoriasExtras: novasExtras, transacoes: novos.transacoes, recorrentes: novos.recorrentes, historico: hist });
        exibirNotificacao(criandoCategoria ? 'Categoria "' + nome + '" criada' : 'Categoria atualizada');
      }

      // Resposta à pergunta "a categoria continua nos próximos meses?"
      function responderCategoria(grupo, cat, continua) { if (!podeGerenciar) { avisoSoDono(); return; }
        const chave = chaveInfo(grupo, cat);
        const atual = categoriasExtras.info[chave] || {};
        const novoInfo = continua ? { ...atual, confirmada: true, ate: null } : { ...atual, confirmada: false, ate: atual.criadaEm };
        const novasExtras = { ...categoriasExtras, info: { ...categoriasExtras.info, [chave]: novoInfo } };
        setCategoriasExtras(novasExtras);
        const hist = anotar(continua ? 'Manteve categoria nos próximos meses' : 'Deixou categoria só no mês em que criou', cat + (continua ? '' : ' · ' + nomeDoMes(atual.criadaEm)));
        salvarTudoNoDisco({ categoriasExtras: novasExtras, historico: hist });
        exibirNotificacao(continua ? '"' + cat + '" continua nos próximos meses' : '"' + cat + '" fica só em ' + nomeDoMes(atual.criadaEm).toLowerCase());
      }

      function excluirCategoria() { if (!podeGerenciar) { avisoSoDono(); return; }
        const grupo = grupoEditando, cat = categoriaEditando;
        if (!ehCategoriaCriada(grupo, cat)) return;
        const usados = transacoes.filter(t => t.category === cat).length;
        if (!confirm('Excluir a categoria "' + cat + '"?' + (usados ? ' Os ' + usados + ' lançamentos dela passam para "Outros".' : ''))) return;
        const infoSem = { ...categoriasExtras.info };
        delete infoSem[chaveInfo(grupo, cat)];
        const novasExtras = { ...categoriasExtras, [grupo]: categoriasExtras[grupo].filter(c => c !== cat), info: infoSem };
        const novosLimites = { ...limitesCategorias };
        delete novosLimites[chaveLimite(grupo, cat)];
        const novos = trocarCategoriaNosLancamentos(grupo, cat, 'Outros');
        setCategoriasExtras(novasExtras);
        setLimitesCategorias(novosLimites);
        setTransacoes(novos.transacoes);
        setRecorrentes(novos.recorrentes);
        fecharCategoria();
        const hist = anotar('Excluiu categoria', cat);
        salvarTudoNoDisco({ limitesCategorias: novosLimites, categoriasExtras: novasExtras, transacoes: novos.transacoes, recorrentes: novos.recorrentes, historico: hist });
        exibirNotificacao('Categoria excluída');
      }

      const abrirModalComData = (dataFormatted, peloCalendario = false) => {
        setEditandoId(null);
        setRepetirMensal(false);
        setRepetirDias(false);
        setDoCalendario(peloCalendario);
        setDestinoReceita('conta');
        setDescricao(''); setValor(''); setErroTransacao('');
        setDataTransacao(dataFormatted);
        setModalTransacaoAberto(true);
      };

      const renderIconeTipo = (t) => {
        if (t === 'receita') return <TrendingUp size={18} />;
        if (t === 'despesa') return <TrendingDown size={18} />;
        return <ShoppingBag size={18} />;
      };

      const renderCorTipo = (t) => {
        if (t === 'receita') return 'var(--accent-text)';
        if (t === 'despesa') return 'var(--danger-text)';
        return '#f59e0b';
      };

      const renderBgTipo = (t) => {
        if (t === 'receita') return 'rgba(var(--accent-rgb), 0.15)';
        if (t === 'despesa') return 'rgba(244, 63, 94, 0.15)';
        return 'rgba(245, 158, 11, 0.15)';
      };

      const gerarDiasDoMes = (ano, mesIndice) => {
        const primeiroDia = new Date(ano, mesIndice, 1).getDay();
        const totalDias = new Date(ano, mesIndice + 1, 0).getDate();
        return { primeiroDia, totalDias };
      };

      const transacoesPorDia = transacoes.reduce((acc, t) => {
        if (!acc[t.date]) acc[t.date] = [];
        acc[t.date].push(t);
        return acc;
      }, {});

      const transacoesDiaSelecionado = transacoes.filter(t => t.date === diaSelecionado);

      // Planilha para abrir no Excel ou Google Planilhas (separada por ";" para o Excel em português)
      const exportarPlanilha = () => {
        const cel = (v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
        const linhas = [['Data', 'Descrição', 'Tipo', 'Categoria', 'Valor', 'Lançado por'].map(cel).join(';')];
        [...transacoes].sort((a, b) => a.date.localeCompare(b.date)).forEach(t => {
          const tipoTexto = t.type === 'receita' ? 'Receita' : t.type === 'despesa' ? 'Despesa' : 'Gasto';
          const valorTexto = (t.type === 'receita' ? '' : '-') + Number(t.amount).toFixed(2).replace('.', ',');
          linhas.push([formatarDataBR(t.date), t.description, tipoTexto, t.category, valorTexto, t.autor || ''].map(cel).join(';'));
        });
        const blob = new Blob(['﻿' + linhas.join('\r\n')], { type: 'text/csv;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'lancamentos-' + hojeISO() + '.csv';

        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);

      const exportarDados = () => {
        const dados = { versao: 4, exportadoEm: new Date().toISOString(), transacoes, limitesCategorias, metas, recorrentes, categoriasExtras, historico };

        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'backup-financeiro-' + hojeISO() + '.json';
        document.body.appendChild(a);
        a.click();

        setTimeout(() => URL.revokeObjectURL(url), 1000);

      const importarDados = (e) => {
        if (!podeGerenciar) { e.target.value = ''; avisoSoDono(); return; }

            const limites = d.limitesCategorias ? { ...limitesCategorias, ...d.limitesCategorias } : limitesCategorias;

        const n = Math.floor(Number(aCadaDias)), v = Math.floor(Number(vezesRepetir));
        if (!repetirDias || !(n >= 1 && n <= 365) || !(v >= 2 && v <= 60) || !dataTransacao) return '';
        const datas = datasRepeticao(dataTransacao, n, v);
        const curtas = datas.map(d => formatarDataBR(d).slice(0, 5));
        const lista = curtas.length > 5 ? curtas.slice(0, 4).join(', ') + ' … ' + curtas[curtas.length - 1] : curtas.slice(0, -1).join(', ') + ' e ' + curtas[curtas.length - 1];
        const val = lerValor(valor);
        return v + ' lançamentos: ' + lista + (isNaN(val) ? '' : ' · total ' + formatarMoeda(val * v)) + '. Os de data futura ficam como agendados.';
      })();

      if (estadoLogin === 'carregando' || estadoLogin === 'fora' || estadoLogin === 'sem-internet') {

        <div className="app-root" style={estilos.container}>

          {mensagemNotificacao && (
            <div style={{

                <div>
