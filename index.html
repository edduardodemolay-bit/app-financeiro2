<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10b981">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="EddFinança">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <link rel="icon" type="image/png" href="./icon-192.png">
  <title>EddFinança</title>
  
  <!-- Tailwind CSS para utilitários de animação -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel para interpretar JSX no navegador -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@1.49.0/dist/umd/lucide.min.js"></script>

  <style>
    :root {
      --accent: #10b981;
      --accent-light: #34d399;
      --accent-dark: #059669;
      --accent-rgb: 16, 185, 129;
      --accent-text: #059669;
      /* ===== TEMA CLARO (padrão) ===== */
      --bg: #f1f5f9;
      --surface: #ffffff;
      --card: #ffffff;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --text: #1e293b;
      --text-strong: #0f172a;
      --text-muted: #64748b;
      --text-faint: #94a3b8;
      --text-soft: #475569;
      --danger-text: #e11d48;
      --on-accent: #ffffff;
      --overlay: rgba(15, 23, 42, 0.45);
      --c-sky: #0284c7; --c-amber: #d97706; --c-purple: #9333ea;
      --c-indigo: #4f46e5; --c-blue: #2563eb; --c-teal: #0d9488;
    }
    /* ===== TEMA ESCURO (opcional) ===== */
    :root[data-tema="escuro"] {
      --bg: #090d16;
      --surface: #0e1525;
      --card: #121c33;
      --border: #1e293b;
      --border-strong: #334155;
      --text: #f8fafc;
      --text-strong: #ffffff;
      --text-muted: #94a3b8;
      --text-faint: #64748b;
      --text-soft: #cbd5e1;
      --danger-text: #fb7185;
      --on-accent: #090d16;
      --overlay: rgba(0, 0, 0, 0.75);
      --c-sky: #38bdf8; --c-amber: #fbbf24; --c-purple: #c084fc;
      --c-indigo: #818cf8; --c-blue: #60a5fa; --c-teal: #2dd4bf;
    }
    * {
      box-sizing: border-box;
    }
    html { -webkit-text-size-adjust: 100%; }
    @supports (height: 100dvh) {
      .app-root { height: 100dvh !important; }
    }
    button { -webkit-tap-highlight-color: transparent; }
    @media (max-width: 767px) {
      /* 16px evita o zoom automático do iPhone ao tocar nos campos */
      input, select, textarea { font-size: 16px !important; }
    }
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
  </style>
</head>
<body>

  <div id="root"></div>

  <script>
    if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function () {});
      });
    }
  </script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Ícones do Lucide desenhados pelo próprio React (como <svg>).
    // Antes usávamos lucide.createIcons(), que troca elementos da tela por fora do React
    // e fazia o app ficar em branco ao mudar um ícone (ex.: botão Salvar).
    const createIcon = (iconName) => ({ size = 20, color = 'currentColor', className = '', style = {} }) => {
      const nomePascal = iconName.replace(/(^|-)([a-z0-9])/g, (_, __, c) => c.toUpperCase());
      const lib = window.lucide || {};
      const desenho = (lib.icons && lib.icons[nomePascal]) || lib[nomePascal];
      const partes = Array.isArray(desenho) && desenho[0] === 'svg' ? desenho[2] : desenho;
      return React.createElement('svg', {
        xmlns: 'http://www.w3.org/2000/svg',
        width: size,
        height: size,
        viewBox: '0 0 24 24',
        fill: 'none',
        stroke: color,
        strokeWidth: 2,
        strokeLinecap: 'round',
        strokeLinejoin: 'round',
        className: className,
        style: { display: 'inline-block', verticalAlign: 'middle', flexShrink: 0, ...style }
      }, Array.isArray(partes) ? partes.map(([tag, attrs], i) => React.createElement(tag, { key: i, ...attrs })) : null);
    };

    const Wallet = createIcon('wallet');
    const LayoutDashboard = createIcon('layout-dashboard');
    const Receipt = createIcon('receipt');
    const PieChart = createIcon('pie-chart');
    const Target = createIcon('target');
    const PlusCircle = createIcon('plus-circle');
    const Trash2 = createIcon('trash-2');
    const TrendingUp = createIcon('trending-up');
    const TrendingDown = createIcon('trending-down');
    const AlertTriangle = createIcon('alert-triangle');
    const CheckCircle2 = createIcon('check-circle-2');
    const Sparkles = createIcon('sparkles');
    const Save = createIcon('save');
    const Plus = createIcon('plus');
    const Minus = createIcon('minus');
    const Sliders = createIcon('sliders');
    const ShoppingBag = createIcon('shopping-bag');
    const CalendarIcon = createIcon('calendar');
    const ChevronLeft = createIcon('chevron-left');
    const ChevronRight = createIcon('chevron-right');
    const Pencil = createIcon('pencil');
    const Repeat = createIcon('repeat');
    const History = createIcon('history');
    const Mic = createIcon('mic');
    const Zap = createIcon('zap');
    const CloudIcon = createIcon('cloud');
    const LogOut = createIcon('log-out');

    // ===== CONTA GOOGLE + CÓPIA NA NUVEM (Firebase / Google Cloud) =====
    // Desligado enquanto estiver null. Para ligar, crie o projeto no Firebase e cole aqui a
    // configuração do app da Web (passo a passo em COMO-ATIVAR-LOGIN.txt).
    const FIREBASE_CONFIG = null;
    const FIREBASE_VERSAO = '10.12.2';
    let firebasePromessa = null;
    function carregarFirebase() {
      if (firebasePromessa) return firebasePromessa;
      const script = (nome) => new Promise((ok, erro) => {
        const s = document.createElement('script');
        s.src = 'https://www.gstatic.com/firebasejs/' + FIREBASE_VERSAO + '/' + nome + '.js';
        s.onload = ok; s.onerror = () => erro(new Error('Não carregou ' + nome));
        document.head.appendChild(s);
      });
      firebasePromessa = script('firebase-app-compat')
        .then(() => Promise.all([script('firebase-auth-compat'), script('firebase-firestore-compat')]))
        .then(() => {
          if (!window.firebase.apps.length) window.firebase.initializeApp(FIREBASE_CONFIG);
          return window.firebase;
        })
        // Se a internet falhar, a próxima tentativa carrega de novo em vez de repetir o erro
        .catch((e) => { firebasePromessa = null; throw e; });
      return firebasePromessa;
    }

    // Leitura e gravação direta no aparelho (sem depender do estado da tela)
    const CHAVES_LOCAIS = { transacoes: '@finapp_transacoes', limitesCategorias: '@finapp_limitesCategorias', metas: '@finapp_metas', recorrentes: '@finapp_recorrentes', categoriasExtras: '@finapp_categorias', historico: '@finapp_historico' };
    function lerLocal() {
      const d = {};
      Object.entries(CHAVES_LOCAIS).forEach(([campo, chave]) => {
        try { const v = localStorage.getItem(chave); if (v) d[campo] = JSON.parse(v); } catch (e) {}
      });
      return d;
    }
    function gravarLocal(d) {
      Object.entries(CHAVES_LOCAIS).forEach(([campo, chave]) => {
        if (d[campo] !== undefined) localStorage.setItem(chave, JSON.stringify(d[campo]));
      });
    }

    // ===== SINCRONIZAÇÃO COM A NUVEM =====
    // Cada salvamento no aparelho ganha uma "versão" nova. A nuvem guarda a versão que recebeu e
    // o aparelho lembra a última versão que combinou com a nuvem (a "base"). Comparando as três,
    // o app sabe sozinho quem mudou, sem depender do relógio de cada aparelho.
    const CHAVE_VERSAO_LOCAL = '@finapp_versaoLocal';
    const CHAVE_BASE_NUVEM = '@finapp_nuvemBase';
    const CHAVE_UID_NUVEM = '@finapp_uidNuvem';
    const lerChave = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
    const gravarChave = (k, v) => { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} };
    const novaVersao = () => Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
    const temDados = (d) => !!d && ((d.transacoes || []).length > 0 || (d.metas || []).length > 0 || (d.recorrentes || []).length > 0);

    // 'enviar' | 'baixar' | 'conflito' | 'nada'
    function decidirSync(versaoLocal, base, versaoNuvem, temLocal, temNuvem) {
      if (!temNuvem && !versaoNuvem) return temLocal ? 'enviar' : 'nada'; // conta ainda vazia
      if (!base) return temLocal ? 'conflito' : 'baixar';                  // primeira vez neste aparelho
      const localMudou = versaoLocal !== base;
      const nuvemMudou = versaoNuvem !== base;
      if (!localMudou && !nuvemMudou) return 'nada';
      if (!nuvemMudou) return 'enviar';                                    // só o aparelho mudou (inclusive se apagou tudo)
      if (!localMudou) return 'baixar';                                    // só a nuvem mudou
      return 'conflito';                                                   // os dois mudaram
    }

    // Baixa um arquivo de backup (usado antes de descartar um dos lados num conflito)
    function baixarBackup(dados, nome) {
      try {
        const blob = new Blob([JSON.stringify({ versao: 4, exportadoEm: new Date().toISOString(), ...dados }, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = nome;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (e) {}
    }

    // ===== LANÇAMENTO RÁPIDO: entende frases como "gastei 46 na padaria" ou "recebi 3500 de salário" =====
    const semAcento = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    const PALAVRAS_CATEGORIA = [
      ['Salário', ['salario', 'holerite', 'pagamento do mes', 'decimo terceiro', 'ferias']],
      ['Vendas', ['venda', 'vendi', 'vendas', 'cliente pagou', 'encomenda']],
      ['Moradia', ['aluguel', 'luz', 'energia', 'agua', 'condominio', 'internet', 'gas', 'iptu', 'conta de casa', 'reforma']],
      ['Alimentação', ['mercado', 'supermercado', 'padaria', 'lanche', 'almoco', 'jantar', 'restaurante', 'ifood', 'comida', 'pizza', 'acougue', 'feira', 'cafe', 'hamburguer', 'lanchonete', 'marmita', 'sorvete']],
      ['Transporte', ['uber', '99', 'onibus', 'gasolina', 'combustivel', 'metro', 'taxi', 'estacionamento', 'pedagio', 'passagem', 'posto', 'mecanico', 'oficina']],
      ['Saúde', ['farmacia', 'remedio', 'medico', 'consulta', 'dentista', 'exame', 'academia', 'plano de saude', 'hospital']],
      ['Educação', ['escola', 'curso', 'faculdade', 'livro', 'mensalidade', 'material escolar', 'apostila']],
      ['Lazer', ['cinema', 'show', 'bar', 'festa', 'viagem', 'netflix', 'spotify', 'jogo', 'passeio', 'cerveja', 'streaming']]
    ];
    const PALAVRAS_RECEITA = ['recebi', 'ganhei', 'entrou', 'caiu', 'vendi', 'venda', 'salario', 'pix recebido', 'me pagou', 'pagaram', 'renda', 'lucro'];
    const PALAVRAS_DESPESA = ['conta de', 'aluguel', 'luz', 'agua', 'internet', 'condominio', 'mensalidade', 'boleto', 'fatura', 'iptu', 'parcela', 'plano de'];
    const contemPalavra = (texto, palavra) => new RegExp('(^|[^a-z0-9])' + palavra.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '($|[^a-z0-9])').test(texto);

    function interpretarTexto(texto, catEntrada, catSaida, hoje) {
      const original = String(texto || '').trim();
      const t = semAcento(original);
      if (!t) return null;
      // Valor: "R$ 46,50", "46 reais", "1.200", "2 mil"
      let valor = NaN, trechoValor = '';
      const mMil = t.match(/(\d+(?:[.,]\d+)?)\s*mil\b/);
      const mDinheiro = t.match(/r\$\s*(\d[\d.]*(?:,\d{1,2})?)|(\d[\d.]*(?:,\d{1,2})?)\s*(?:reais|real|conto|contos|pila)\b/);
      const mNumero = t.replace(/\bdia\s+\d{1,2}\b/, ' ').match(/\d[\d.]*(?:,\d{1,2})?/);
      if (mMil) { valor = Number(mMil[1].replace(',', '.')) * 1000; trechoValor = mMil[0]; }
      else if (mDinheiro) { valor = lerValor(mDinheiro[1] || mDinheiro[2]); trechoValor = mDinheiro[0]; }
      else if (mNumero) { valor = lerValor(mNumero[0]); trechoValor = mNumero[0]; }
      if (isNaN(valor) || valor <= 0) return null;
      const resto = t.replace(trechoValor, ' ');

      // Tipo
      let type = 'gasto';
      if (PALAVRAS_RECEITA.some(p => contemPalavra(resto, p))) type = 'receita';
      else if (PALAVRAS_DESPESA.some(p => contemPalavra(resto, p))) type = 'despesa';

      // Data
      const base = new Date(hoje + 'T12:00:00');
      if (contemPalavra(resto, 'anteontem')) base.setDate(base.getDate() - 2);
      else if (contemPalavra(resto, 'ontem')) base.setDate(base.getDate() - 1);
      else {
        const mDia = resto.match(/\bdia\s+(\d{1,2})\b/);
        if (mDia && Number(mDia[1]) >= 1 && Number(mDia[1]) <= 31) base.setDate(Math.min(Number(mDia[1]), new Date(base.getFullYear(), base.getMonth() + 1, 0).getDate()));
      }
      const date = base.getFullYear() + '-' + String(base.getMonth() + 1).padStart(2, '0') + '-' + String(base.getDate()).padStart(2, '0');

      // Categoria: primeiro as criadas pela pessoa (pelo nome), depois as palavras conhecidas
      const lista = type === 'receita' ? catEntrada : catSaida;
      let category = lista.find(c => c !== 'Outros' && contemPalavra(resto, semAcento(c)));
      if (!category) {
        const achada = PALAVRAS_CATEGORIA.find(([cat, palavras]) => lista.includes(cat) && palavras.some(p => contemPalavra(resto, p)));
        category = achada ? achada[0] : 'Outros';
      }

      // Descrição: a frase sem o valor e sem as palavras de comando
      const tirar = ['gastei', 'paguei', 'comprei', 'recebi', 'ganhei', 'vendi', 'entrou', 'caiu', 'hoje', 'ontem', 'anteontem', 'reais', 'real', 'r\\$', 'por', 'com', 'no', 'na', 'nos', 'nas', 'em', 'de', 'do', 'da', 'dos', 'das', 'um', 'uma', 'pra', 'para', 'o', 'a'];
      let desc = original.replace(new RegExp(trechoValor.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i'), ' ');
      desc = desc.replace(/\bdia\s+\d{1,2}\b/i, ' ');
      tirar.forEach(p => { desc = desc.replace(new RegExp('(^|\\s)' + p + '(?=\\s|$)', 'gi'), ' '); });
      desc = desc.replace(/\s+/g, ' ').trim();
      if (!desc) desc = category === 'Outros' ? (type === 'receita' ? 'Receita' : 'Gasto') : category;
      desc = desc.charAt(0).toUpperCase() + desc.slice(1);

      return { description: desc.slice(0, 60), amount: Math.round(valor * 100) / 100, type, category, date };
    }

    const CATEGORIAS = ['Salário', 'Vendas', 'Alimentação', 'Transporte', 'Moradia', 'Lazer', 'Saúde', 'Educação', 'Outros'];
    // Categorias oferecidas no formulário conforme o tipo escolhido
    const CATEGORIAS_ENTRADA = ['Salário', 'Vendas', 'Outros'];
    const CATEGORIAS_SAIDA = ['Alimentação', 'Transporte', 'Moradia', 'Lazer', 'Saúde', 'Educação', 'Outros'];
    const CATEGORIA_PADRAO = { receita: 'Salário', despesa: 'Moradia', gasto: 'Alimentação' };
    // Categorias que a pessoa cria no Planejamento entram antes de "Outros"
    const montarCategorias = (padrao, extras) => [...padrao.filter(c => c !== 'Outros'), ...(extras || []), 'Outros'];
    // O valor planejado de ganhos fica numa chave própria, porque "Outros" existe nos dois grupos
    const chaveLimite = (grupo, cat) => (grupo === 'entrada' ? 'prev:' + cat : cat);
    // Categorias criadas: { entrada: [nomes], saida: [nomes], info: { 'saida:Pets': { criadaEm: 'AAAA-MM', confirmada, ate } } }
    //  confirmada = a pessoa disse que a categoria continua nos próximos meses
    //  ate        = a pessoa disse que era só até aquele mês (some do planejamento depois dele)
    const normalizarExtras = (c) => ({ entrada: (c && c.entrada) || [], saida: (c && c.saida) || [], info: (c && c.info) || {} });
    const chaveInfo = (grupo, cat) => grupo + ':' + cat;
    // A categoria aparece no mês? Some só nos meses depois do "ate".
    const categoriaValeNoMes = (extras, grupo, cat, mes) => {
      const i = extras.info[chaveInfo(grupo, cat)];
      return !(i && i.ate && mes > i.ate);
    };
    const CORES_EXTRAS = [
      { bg: 'rgba(236, 72, 153, 0.15)', color: '#db2777', border: 'rgba(236, 72, 153, 0.3)' },
      { bg: 'rgba(132, 204, 22, 0.15)', color: '#65a30d', border: 'rgba(132, 204, 22, 0.3)' },
      { bg: 'rgba(249, 115, 22, 0.15)', color: '#ea580c', border: 'rgba(249, 115, 22, 0.3)' },
      { bg: 'rgba(6, 182, 212, 0.15)', color: '#0891b2', border: 'rgba(6, 182, 212, 0.3)' },
      { bg: 'rgba(139, 92, 246, 0.15)', color: '#7c3aed', border: 'rgba(139, 92, 246, 0.3)' }
    ];
    const corDaCategoria = (cat) => {
      if (CATEGORIA_CORES[cat]) return CATEGORIA_CORES[cat];
      let h = 0;
      for (const ch of String(cat || '')) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
      return CORES_EXTRAS[h % CORES_EXTRAS.length];
    };
    const EXPLICACAO_TIPO = {
      receita: 'Dinheiro que entra: salário, vendas, pix recebido. Escolha abaixo se ele fica na conta ou vai direto para uma meta.',
      despesa: 'Contas fixas e essenciais, que vêm todo mês: aluguel, luz, água, internet, escola.',
      gasto: 'Gastos do dia a dia, que mudam de valor: mercado, lanche, Uber, lazer, compras.'
    };

    // Metas: o valor desejado fica fixo e o guardado é o valor inicial + cada movimentação.
    // Cada movimentação fica registrada e pode ser excluída depois.
    const guardadoDaMeta = (m) => Number(m.inicial || 0) + (m.aportes || []).reduce((a, x) => a + Number(x.valor), 0);
    const normalizarMeta = (m) => (Array.isArray(m.aportes) ? m : { ...m, inicial: Number(m.economizado || 0), aportes: [] });

    // Lançamentos ligados a uma meta (metaId + metaMov):
    //  'aporte'   = gasto que sai da conta e vai para a meta
    //  'retirada' = receita que sai da meta e volta para a conta
    //  'entrada'  = receita que entra direto na meta (não passa pela conta)
    // Mantém a lista de movimentações da meta igual aos lançamentos.
    function sincronizarMeta(listaMetas, t, apenasRemover) {
      let novas = listaMetas.map(m => ((m.aportes || []).some(a => a.transacaoId === t.id) ? { ...m, aportes: m.aportes.filter(a => a.transacaoId !== t.id) } : m));
      if (apenasRemover || !t.metaId || !t.metaMov) return novas;
      const valor = t.metaMov === 'retirada' ? -Number(t.amount) : Number(t.amount);
      return novas.map(m => (m.id === t.metaId ? { ...m, aportes: [...(m.aportes || []), { id: t.id, valor, data: t.date, transacaoId: t.id, tipo: t.metaMov, descricao: t.description }] } : m));
    }
    const entraNaConta = (t) => t.metaMov !== 'entrada';

    // Datas de um lançamento que se repete a cada N dias, X vezes no total
    function datasRepeticao(inicio, cadaDias, vezes) {
      const base = new Date(inicio + 'T12:00:00');
      return Array.from({ length: vezes }, (_, i) => {
        const d = new Date(base);
        d.setDate(base.getDate() + i * cadaDias);
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      });
    }

    // Aceita "12,50", "1.234,56", "2.000" (dois mil) ou "12.5"
    const lerValor = (texto) => {
      let s = String(texto == null ? '' : texto).trim().replace(/\s|R\$/g, '');
      if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
      else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
      return s === '' ? NaN : Number(s);
    };
    const valorParaCampo = (n) => (n === '' || n == null ? '' : String(n).replace('.', ','));

    const CATEGORIA_CORES = {
      'Salário': { bg: 'rgba(var(--accent-rgb), 0.15)', color: 'var(--accent-text)', border: 'rgba(var(--accent-rgb), 0.3)' },
      'Vendas': { bg: 'rgba(20, 184, 166, 0.15)', color: 'var(--c-teal)', border: 'rgba(20, 184, 166, 0.3)' },
      'Alimentação': { bg: 'rgba(245, 158, 11, 0.15)', color: 'var(--c-amber)', border: 'rgba(245, 158, 11, 0.3)' },
      'Transporte': { bg: 'rgba(14, 165, 233, 0.15)', color: 'var(--c-sky)', border: 'rgba(14, 165, 233, 0.3)' },
      'Moradia': { bg: 'rgba(99, 102, 241, 0.15)', color: 'var(--c-indigo)', border: 'rgba(99, 102, 241, 0.3)' },
      'Lazer': { bg: 'rgba(168, 85, 247, 0.15)', color: 'var(--c-purple)', border: 'rgba(168, 85, 247, 0.3)' },
      'Saúde': { bg: 'rgba(244, 63, 94, 0.15)', color: 'var(--danger-text)', border: 'rgba(244, 63, 94, 0.3)' },
      'Educação': { bg: 'rgba(59, 130, 246, 0.15)', color: 'var(--c-blue)', border: 'rgba(59, 130, 246, 0.3)' },
      'Outros': { bg: 'rgba(148, 163, 184, 0.15)', color: 'var(--text-muted)', border: 'rgba(148, 163, 184, 0.3)' },
      'Metas': { bg: 'rgba(168, 85, 247, 0.15)', color: 'var(--c-purple)', border: 'rgba(168, 85, 247, 0.3)' }
    };

    // Data de hoje no fuso do aparelho (toISOString usa UTC e, no Brasil, virava o dia seguinte após as 21h)
    const hojeISO = () => {
      const d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    };

    const NOMES_MESES = [
      'Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho',
      'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'
    ];

    // Meses no formato "AAAA-MM"
    const mesDe = (dataISO) => String(dataISO || '').slice(0, 7);
    const somarMeses = (mes, n) => {
      const [a, m] = mes.split('-').map(Number);
      const d = new Date(a, m - 1 + n, 1);
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    };
    const nomeDoMes = (mes) => {
      const [a, m] = mes.split('-').map(Number);
      return NOMES_MESES[m - 1] + ' de ' + a;
    };
    const ultimoDia = (mes) => {
      const [a, m] = mes.split('-').map(Number);
      return new Date(a, m, 0).getDate();
    };

    // Cria os lançamentos das contas fixas que ainda faltam, do mês de início até o mês atual.
    // Cada conta fixa guarda os meses já gerados, então apagar um lançamento gerado não o recria.
    function gerarLancamentosFixos(recorrentes, transacoes, mesAtual) {
      const novas = [];
      // Os ids começam depois do maior id já usado, para nunca repetir o de um lançamento criado no mesmo instante
      let base = transacoes.reduce((mx, t) => (typeof t.id === 'number' && t.id >= mx ? t.id + 1 : mx), Date.now());
      const atualizadas = recorrentes.map(r => {
        if (!r.ativo) return r;
        const gerados = new Set(r.gerados || []);
        let mes = r.inicio;
        let guarda = 0;
        while (mes <= mesAtual && guarda < 240) {
          if (!gerados.has(mes)) {
            const dia = String(Math.min(r.dia, ultimoDia(mes))).padStart(2, '0');
            const nova = { id: base++, description: r.description, amount: r.amount, category: r.category, type: r.type, date: mes + '-' + dia, recorrenteId: r.id };
            if (r.metaId && r.metaMov) { nova.metaId = r.metaId; nova.metaMov = r.metaMov; }
            novas.push(nova);
            gerados.add(mes);
          }
          mes = somarMeses(mes, 1);
          guarda++;
        }
        return gerados.size === (r.gerados || []).length ? r : { ...r, gerados: [...gerados].sort() };
      });
      if (!novas.length) return null;
      return {
        novas,
        recorrentes: atualizadas,
        transacoes: [...novas, ...transacoes].sort((a, b) => new Date(b.date) - new Date(a.date))
      };
    }

    const LIMITES_PADRAO = {
      'Salário': 0,
      'Vendas': 0,
      'Alimentação': 800,
      'Transporte': 300,
      'Moradia': 1200,
      'Lazer': 400,
      'Saúde': 200,
      'Educação': 300,
      'Outros': 200
    };

    function App() {
      const [transacoes, setTransacoes] = useState([]);
      
      const [limitesCategorias, setLimitesCategorias] = useState(LIMITES_PADRAO);

      const [metas, setMetas] = useState([]);
      const [recorrentes, setRecorrentes] = useState([]);
      const [mesSelecionado, setMesSelecionado] = useState(mesDe(hojeISO()));

      const [valoresAporte, setValoresAporte] = useState({});

      const [abaAtiva, setAbaAtiva] = useState('dashboard');

      // ===== TEMA / COR DE DESTAQUE =====
      const TEMAS = {
        verde:   { hex: '#10b981', light: '#34d399', dark: '#059669', rgb: '16, 185, 129' },
        azul:    { hex: '#3b82f6', light: 'var(--c-blue)', dark: '#1d4ed8', rgb: '59, 130, 246' },
        roxo:    { hex: '#8b5cf6', light: '#a78bfa', dark: '#6d28d9', rgb: '139, 92, 246' },
        rosa:    { hex: '#ec4899', light: '#f472b6', dark: '#be185d', rgb: '236, 72, 153' },
        laranja: { hex: '#f97316', light: '#fb923c', dark: '#c2410c', rgb: '249, 115, 22' }
      };
      const [corTema, setCorTema] = useState(() => {
        try { return localStorage.getItem('@finapp_cor') || 'verde'; } catch (e) { return 'verde'; }
      });
      const [modoTema, setModoTema] = useState(() => {
        try { return localStorage.getItem('@finapp_modo') || 'claro'; } catch (e) { return 'claro'; }
      });
      useEffect(() => {
        const t = TEMAS[corTema] || TEMAS.verde;
        const root = document.documentElement;
        root.setAttribute('data-tema', modoTema);
        root.style.setProperty('--accent', t.hex);
        root.style.setProperty('--accent-light', t.light);
        root.style.setProperty('--accent-dark', t.dark);
        root.style.setProperty('--accent-rgb', t.rgb);
        root.style.setProperty('--accent-text', modoTema === 'escuro' ? t.light : t.dark);
        try {
          localStorage.setItem('@finapp_cor', corTema);
          localStorage.setItem('@finapp_modo', modoTema);
        } catch (e) {}
      }, [corTema, modoTema]);
      const [isMobile, setIsMobile] = useState(() => window.innerWidth < 768);
      const [menuAberto, setMenuAberto] = useState(false);
      useEffect(() => {
        const aoRedimensionar = () => {
          const m = window.innerWidth < 768;
          setIsMobile(m);
          if (!m) setMenuAberto(false);
        };
        window.addEventListener('resize', aoRedimensionar);
        return () => window.removeEventListener('resize', aoRedimensionar);
      }, []);
      const [filtroTipo, setFiltroTipo] = useState('todas');
      const [filtroCategoria, setFiltroCategoria] = useState('todas');
      const [termoPesquisa, setTermoPesquisa] = useState('');

      const [mensagemNotificacao, setMensagemNotificacao] = useState(null);

      // Mês do meio do calendário (mostra o anterior, este e o próximo)
      const [mesCalendario, setMesCalendario] = useState(mesDe(hojeISO()));
      const [diaSelecionado, setDiaSelecionado] = useState(hojeISO());

      const [modalTransacaoAberto, setModalTransacaoAberto] = useState(false);
      const [descricao, setDescricao] = useState('');
      const [valor, setValor] = useState('');
      const [categoria, setCategoria] = useState('Alimentação');
      const [tipo, setTipo] = useState('gasto');
      const [dataTransacao, setDataTransacao] = useState(hojeISO());
      const [erroTransacao, setErroTransacao] = useState('');
      const [editandoId, setEditandoId] = useState(null);
      const [repetirMensal, setRepetirMensal] = useState(false);
      // Repetir a cada X dias (ex.: feira toda semana), um número de vezes
      const [repetirDias, setRepetirDias] = useState(false);
      const [aCadaDias, setACadaDias] = useState('7');
      const [vezesRepetir, setVezesRepetir] = useState('4');
      const [doCalendario, setDoCalendario] = useState(false);
      // Para onde vai uma receita: 'conta' ou o id de uma meta
      const [destinoReceita, setDestinoReceita] = useState('conta');

      const [modalMetaAberto, setModalMetaAberto] = useState(false);
      const [editandoMetaId, setEditandoMetaId] = useState(null);
      const [nomeMeta, setNomeMeta] = useState('');
      const [objetivoMeta, setObjetivoMeta] = useState('');
      const [economizadoMeta, setEconomizadoMeta] = useState('');

      const [modalOrcamentoAberto, setModalOrcamentoAberto] = useState(false);
      const [categoriaEditando, setCategoriaEditando] = useState('Alimentação');
      const [novoLimiteCategoria, setNovoLimiteCategoria] = useState('');
      // Categorias criadas pela pessoa: { entrada: [...], saida: [...] }
      const [categoriasExtras, setCategoriasExtras] = useState({ entrada: [], saida: [], info: {} });
      const [grupoEditando, setGrupoEditando] = useState('saida');
      const [criandoCategoria, setCriandoCategoria] = useState(false);
      const [nomeCategoriaEdit, setNomeCategoriaEdit] = useState('');
      const [erroCategoria, setErroCategoria] = useState('');
      const catEntrada = montarCategorias(CATEGORIAS_ENTRADA, categoriasExtras.entrada);
      const catSaida = montarCategorias(CATEGORIAS_SAIDA, categoriasExtras.saida);
      // Categorias que valem num mês (as marcadas "só até tal mês" somem depois dele)
      const catDoMes = (grupo, mes) => (grupo === 'entrada' ? catEntrada : catSaida).filter(c => categoriaValeNoMes(categoriasExtras, grupo, c, mes));
      const categoriasDoTipo = (t) => catDoMes(t === 'receita' ? 'entrada' : 'saida', mesDe(dataTransacao));
      const ehCategoriaCriada = (grupo, cat) => (categoriasExtras[grupo] || []).includes(cat);

      // Histórico de registros: quem fez o quê e quando (fica no menu)
      const [historico, setHistorico] = useState([]);
      const [nomeUsuario, setNomeUsuario] = useState(() => {
        try { return localStorage.getItem('@finapp_nome') || ''; } catch (e) { return ''; }
      });
      // Conta Google (só aparece quando FIREBASE_CONFIG estiver preenchido)
      const [usuarioNuvem, setUsuarioNuvem] = useState(null);
      const [statusNuvem, setStatusNuvem] = useState(FIREBASE_CONFIG ? 'saiu' : 'desligado');
      // 'livre' (login desligado) | 'carregando' | 'fora' (mostra a tela de entrada) | 'dentro' | 'offline' | 'sem-internet'
      const [estadoLogin, setEstadoLogin] = useState(FIREBASE_CONFIG ? 'carregando' : 'livre');
      const nuvemRef = useRef(null);
      const timerNuvem = useRef(null);
      const nomeAutor = (usuarioNuvem && usuarioNuvem.nome) || nomeUsuario.trim() || 'Você';

      // Lançamento rápido por texto ou voz
      const [textoRapido, setTextoRapido] = useState('');
      const [previaRapida, setPreviaRapida] = useState(null);
      // "ouvindo" = o teclado foi aberto pelo 🎤 e a dica de falar está na tela
      const [ouvindo, setOuvindo] = useState(false);
      const [avisoVoz, setAvisoVoz] = useState('');

      // Parcelamento de compras
      const [parcelas, setParcelas] = useState('1');

      useEffect(() => {
        async function carregarDadosIniciais() {
          if (window.electronAPI) {
            try {
              const dadosDoDisco = await window.electronAPI.loadData();
              if (dadosDoDisco) {
                if (dadosDoDisco.transacoes) setTransacoes(dadosDoDisco.transacoes);
                if (dadosDoDisco.limitesCategorias) setLimitesCategorias(prev => ({ ...prev, ...dadosDoDisco.limitesCategorias }));
                if (dadosDoDisco.metas) setMetas(dadosDoDisco.metas.map(normalizarMeta));
                if (dadosDoDisco.categoriasExtras) setCategoriasExtras(normalizarExtras(dadosDoDisco.categoriasExtras));
                return;
              }
            } catch (e) {
              console.error("Erro ao carregar dados do Electron:", e);
            }
          }

          try {
            const t = localStorage.getItem('@finapp_transacoes');
            const listaTransacoes = t ? JSON.parse(t) : [];
            setTransacoes(listaTransacoes);
            const l = localStorage.getItem('@finapp_limitesCategorias');
            if (l) setLimitesCategorias(prev => ({ ...prev, ...JSON.parse(l) }));
            const ce = localStorage.getItem('@finapp_categorias');
            if (ce) setCategoriasExtras(normalizarExtras(JSON.parse(ce)));
            const h = localStorage.getItem('@finapp_historico');
            if (h) setHistorico(JSON.parse(h));
            // Metas zeradas a pedido do usuário (uma única vez): remove as metas salvas neste aparelho.
            if (!localStorage.getItem('@finapp_metas_zeradas')) {
              localStorage.setItem('@finapp_metas', '[]');
              localStorage.setItem('@finapp_metas_zeradas', '1');
            }
            const m = localStorage.getItem('@finapp_metas');
            const listaMetas = m ? JSON.parse(m).map(normalizarMeta) : [];
            setMetas(listaMetas);
            const r = localStorage.getItem('@finapp_recorrentes');
            const listaRecorrentes = r ? JSON.parse(r) : [];
            setRecorrentes(listaRecorrentes);

            // Lança as contas fixas dos meses que passaram desde a última abertura
            const gerado = gerarLancamentosFixos(listaRecorrentes, listaTransacoes, mesDe(hojeISO()));
            if (gerado) {
              const metasAtualizadas = gerado.novas.reduce((acc, t) => sincronizarMeta(acc, t), listaMetas);
              setTransacoes(gerado.transacoes);
              setRecorrentes(gerado.recorrentes);
              setMetas(metasAtualizadas);
              localStorage.setItem('@finapp_transacoes', JSON.stringify(gerado.transacoes));
              localStorage.setItem('@finapp_recorrentes', JSON.stringify(gerado.recorrentes));
              localStorage.setItem('@finapp_metas', JSON.stringify(metasAtualizadas));
            }
          } catch (e) {}
        }

        carregarDadosIniciais();
      }, []);

      const timerNotificacao = useRef(null);
      const exibirNotificacao = (texto) => {
        setMensagemNotificacao(texto);
        clearTimeout(timerNotificacao.current);
        timerNotificacao.current = setTimeout(() => {
          setMensagemNotificacao(null);
        }, 3000);
      };

      // Tudo é salvo no aparelho a cada ação; não existe mais botão de salvar.
      const [salvoEm, setSalvoEm] = useState(null);
      const salvarTudoNoDisco = async (novosDados = {}) => {
        const payload = {
          transacoes: novosDados.transacoes !== undefined ? novosDados.transacoes : transacoes,
          limitesCategorias: novosDados.limitesCategorias !== undefined ? novosDados.limitesCategorias : limitesCategorias,
          metas: novosDados.metas !== undefined ? novosDados.metas : metas,
          recorrentes: novosDados.recorrentes !== undefined ? novosDados.recorrentes : recorrentes,
          categoriasExtras: novosDados.categoriasExtras !== undefined ? novosDados.categoriasExtras : categoriasExtras,
          historico: novosDados.historico !== undefined ? novosDados.historico : historico
        };

        try {
          gravarLocal(payload);
          // Marca que este aparelho mudou: a nuvem vai receber esta versão
          gravarChave(CHAVE_VERSAO_LOCAL, novaVersao());
          setSalvoEm(new Date());
        } catch (e) {
          exibirNotificacao('❌ Não foi possível salvar neste aparelho. Exporte um backup.');
        }

        if (window.electronAPI) {
          window.electronAPI.saveData(payload).catch((e) => console.error("Erro ao salvar no Electron:", e));
        }
        enviarParaNuvem();
      };

      // Sincroniza com a nuvem 1,5 s depois da última mudança
      const enviarParaNuvem = () => {
        if (!nuvemRef.current) return;
        clearTimeout(timerNuvem.current);
        setStatusNuvem('salvando');
        timerNuvem.current = setTimeout(() => { timerNuvem.current = null; sincronizar(); }, 1500);
      };

      // Coloca no app os dados que vieram da nuvem ou de um backup
      const aplicarDados = (d) => {
        const lista = Array.isArray(d.transacoes) ? d.transacoes : [];
        const novasMetas = Array.isArray(d.metas) ? d.metas.map(normalizarMeta) : [];
        const novosRecorrentes = Array.isArray(d.recorrentes) ? d.recorrentes : [];
        const novasExtras = normalizarExtras(d.categoriasExtras);
        const novosLimites = { ...LIMITES_PADRAO, ...(d.limitesCategorias || {}) };
        const novoHistorico = Array.isArray(d.historico) ? d.historico : [];
        setTransacoes(lista); setMetas(novasMetas); setRecorrentes(novosRecorrentes);
        setCategoriasExtras(novasExtras); setLimitesCategorias(novosLimites); setHistorico(novoHistorico);
        return { transacoes: lista, metas: novasMetas, recorrentes: novosRecorrentes, categoriasExtras: novasExtras, limitesCategorias: novosLimites, historico: novoHistorico };
      };

      // Compara aparelho e nuvem e faz o que for preciso: enviar, baixar ou (só se os dois mudaram) perguntar.
      // Lê tudo direto do aparelho, então funciona mesmo chamada de dentro de eventos antigos.
      const sincronizandoRef = useRef(false);
      const repetirSyncRef = useRef(false);
      const sincronizar = async () => {
        const sessao = nuvemRef.current;
        if (!sessao) return 'sem-conta';
        if (sincronizandoRef.current) { repetirSyncRef.current = true; return 'ocupado'; }
        sincronizandoRef.current = true;
        setStatusNuvem('salvando');
        let resultado = 'erro';
        try {
          for (let tentativa = 0; tentativa < 3; tentativa++) {
            const snap = await sessao.doc.get();
            const dadosNuvem = snap.exists && snap.data().dados ? JSON.parse(snap.data().dados) : null;
            const versaoNuvem = snap.exists ? (snap.data().versao || null) : null;
            const local = lerLocal();
            let versaoLocal = lerChave(CHAVE_VERSAO_LOCAL);
            const base = lerChave(CHAVE_BASE_NUVEM);
            let acao = decidirSync(versaoLocal, base, versaoNuvem, temDados(local), temDados(dadosNuvem));

            if (acao === 'conflito') {
              const ficarNuvem = window.confirm('Este aparelho e a sua conta têm mudanças diferentes desde a última sincronização.\n\n'
                + 'OK = ficar com os dados da conta (' + (((dadosNuvem || {}).transacoes || []).length) + ' lançamentos)\n'
                + 'Cancelar = ficar com os dados deste aparelho (' + ((local.transacoes || []).length) + ' lançamentos)\n\n'
                + 'O lado que não for escolhido é salvo num arquivo de backup antes, para nada se perder.');
              if (ficarNuvem) { baixarBackup(local, 'backup-deste-aparelho-' + hojeISO() + '.json'); acao = 'baixar'; }
              else { baixarBackup(dadosNuvem || {}, 'backup-da-conta-' + hojeISO() + '.json'); acao = 'enviar'; }
            }

            if (acao === 'baixar') {
              gravarLocal(aplicarDados(dadosNuvem || {}));
              gravarChave(CHAVE_VERSAO_LOCAL, versaoNuvem);
              gravarChave(CHAVE_BASE_NUVEM, versaoNuvem);
              exibirNotificacao('Dados atualizados com a sua conta');
              resultado = 'baixou';
              break;
            }
            if (acao === 'enviar') {
              if (!versaoLocal) { versaoLocal = novaVersao(); gravarChave(CHAVE_VERSAO_LOCAL, versaoLocal); }
              // Só grava se a nuvem ainda estiver na versão que acabamos de ler; se outro aparelho
              // enviou nesse meio-tempo, a gravação é recusada e o app compara de novo.
              const doc = sessao.doc;
              const mudouNoMeio = await sessao.fb.firestore().runTransaction(async (tx) => {
                const atual = await tx.get(doc);
                const versaoAgora = atual.exists ? (atual.data().versao || null) : null;
                if (versaoAgora !== versaoNuvem) return true;
                tx.set(doc, { nome: sessao.nome, email: sessao.email, atualizadoEm: new Date().toISOString(), versao: versaoLocal, dados: JSON.stringify(local) }, { merge: true });
                return false;
              });
              if (mudouNoMeio) continue;
              gravarChave(CHAVE_BASE_NUVEM, versaoLocal);
              resultado = 'enviou';
              break;
            }
            // nada a fazer: os dois lados já estão iguais
            if (versaoLocal === versaoNuvem) gravarChave(CHAVE_BASE_NUVEM, versaoNuvem);
            resultado = 'em-dia';
            break;
          }
          setStatusNuvem(resultado === 'erro' ? 'erro' : 'sincronizado');
        } catch (e) {
          console.error('Erro ao sincronizar:', e);
          setStatusNuvem('erro');
        } finally {
          sincronizandoRef.current = false;
          if (repetirSyncRef.current) { repetirSyncRef.current = false; setTimeout(sincronizar, 300); }
        }
        return resultado;
      };

      // Apaga deste aparelho os dados da conta (ao sair ou ao trocar de conta)
      const limparAparelho = () => {
        Object.values(CHAVES_LOCAIS).forEach(k => gravarChave(k, null));
        [CHAVE_VERSAO_LOCAL, CHAVE_BASE_NUVEM, CHAVE_UID_NUVEM].forEach(k => gravarChave(k, null));
        aplicarDados({});
      };

      // Ao voltar para o app (trocou de aba ou desbloqueou o celular), busca o que mudou na nuvem
      useEffect(() => {
        const aoVoltar = () => { if (document.visibilityState === 'visible' && nuvemRef.current && !timerNuvem.current) sincronizar(); };
        document.addEventListener('visibilitychange', aoVoltar);
        return () => document.removeEventListener('visibilitychange', aoVoltar);
      }, []);

      // Liga o login quando o Firebase estiver configurado (com ele ligado, o app só abre depois de entrar)
      useEffect(() => {
        if (!FIREBASE_CONFIG) return;
        let cancelado = false;
        carregarFirebase().then(fb => {
          if (cancelado) return;
          fb.auth().languageCode = 'pt-BR';
          fb.auth().getRedirectResult().catch(() => {});
          fb.auth().onAuthStateChanged(async (user) => {
            if (!user) { nuvemRef.current = null; setUsuarioNuvem(null); setStatusNuvem('saiu'); setEstadoLogin('fora'); return; }
            const perfil = { uid: user.uid, nome: user.displayName || user.email, email: user.email, foto: user.photoURL };
            setUsuarioNuvem(perfil);
            setStatusNuvem('conectando');
            const doc = fb.firestore().collection('usuarios').doc(user.uid);
            // Os dados deste aparelho são de outra conta? Não mistura: apaga daqui e usa os desta conta.
            const uidAnterior = lerChave(CHAVE_UID_NUVEM);
            if (uidAnterior && uidAnterior !== user.uid && temDados(lerLocal())) {
              const trocar = window.confirm('Este aparelho tem dados de outra conta.\n\nOK = apagar esses dados daqui (eles continuam na outra conta) e carregar os da conta ' + (user.email || '') + '\nCancelar = não entrar agora');
              if (!trocar) { nuvemRef.current = null; await fb.auth().signOut(); return; }
              limparAparelho();
            }
            gravarChave(CHAVE_UID_NUVEM, user.uid);
            nuvemRef.current = { fb, doc, nome: perfil.nome, email: perfil.email };
            setEstadoLogin('dentro');
            await sincronizar();
          });
        }).catch(() => {
          // Sem internet para carregar o login: quem já entrou neste aparelho usa os dados daqui
          setStatusNuvem('erro');
          setEstadoLogin(lerChave(CHAVE_UID_NUVEM) ? 'offline' : 'sem-internet');
        });
        return () => { cancelado = true; };
      }, []);

      // Mensagens de erro do login em português
      const traduzirErroLogin = (e) => ({
        'auth/invalid-email': 'Esse e-mail não parece certo. Confira se digitou tudo.',
        'auth/missing-email': 'Digite o seu e-mail.',
        'auth/missing-password': 'Digite a sua senha.',
        'auth/user-not-found': 'Não achamos conta com esse e-mail. Toque em "Criar conta".',
        'auth/wrong-password': 'Senha errada. Tente de novo ou toque em "Esqueci a senha".',
        'auth/invalid-credential': 'E-mail ou senha errados. Tente de novo ou toque em "Esqueci a senha".',
        'auth/invalid-login-credentials': 'E-mail ou senha errados. Tente de novo ou toque em "Esqueci a senha".',
        'auth/email-already-in-use': 'Já existe conta com esse e-mail. Toque em "Entrar".',
        'auth/weak-password': 'A senha precisa ter pelo menos 6 caracteres.',
        'auth/too-many-requests': 'Muitas tentativas seguidas. Espere alguns minutos e tente de novo.',
        'auth/network-request-failed': 'Sem internet. Conecte-se e tente de novo.',
        'auth/popup-closed-by-user': 'A janela do Google foi fechada antes de terminar.',
        'auth/cancelled-popup-request': 'A janela do Google foi fechada antes de terminar.',
        'auth/account-exists-with-different-credential': 'Esse e-mail já entra de outro jeito (Google ou senha). Use a forma que você usou da primeira vez.',
        'auth/operation-not-allowed': 'Essa forma de entrar ainda não foi ligada no Firebase.'
      }[e && e.code] || 'Não foi possível entrar. Tente de novo.');

      const entrarComGoogle = async () => {
        const fb = await carregarFirebase();
        const provedor = new fb.auth.GoogleAuthProvider();
        provedor.setCustomParameters({ prompt: 'select_account' });
        const instalado = window.matchMedia && window.matchMedia('(display-mode: standalone)').matches;
        if (instalado) { await fb.auth().signInWithRedirect(provedor); return; }
        try { await fb.auth().signInWithPopup(provedor); }
        catch (e) { if (e && (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment')) await fb.auth().signInWithRedirect(provedor); else throw e; }
      };

      const entrarComEmail = async (email, senha) => {
        const fb = await carregarFirebase();
        await fb.auth().signInWithEmailAndPassword(email.trim(), senha);
      };

      const criarContaEmail = async (nome, email, senha) => {
        const fb = await carregarFirebase();
        const cred = await fb.auth().createUserWithEmailAndPassword(email.trim(), senha);
        const nomeLimpo = nome.trim();
        if (nomeLimpo && cred.user) {
          await cred.user.updateProfile({ displayName: nomeLimpo });
          setUsuarioNuvem(u => (u ? { ...u, nome: nomeLimpo } : u));
          if (nuvemRef.current) nuvemRef.current.nome = nomeLimpo;
        }
      };

      const esqueciSenha = async (email) => {
        const fb = await carregarFirebase();
        fb.auth().languageCode = 'pt-BR';
        await fb.auth().sendPasswordResetEmail(email.trim());
      };

      // Sair: primeiro garante que tudo foi para a nuvem, depois apaga os dados deste aparelho
      // (assim quem usar o aparelho depois não vê nem leva os seus dados)
      const sairDaConta = async () => {
        if (!window.confirm('Sair da conta?\n\nSeus dados ficam guardados na sua conta e são apagados deste aparelho. Para vê-los de novo, é só entrar outra vez.')) return;
        clearTimeout(timerNuvem.current); timerNuvem.current = null;
        let r = await sincronizar();
        if (r === 'ocupado') { await new Promise(ok => setTimeout(ok, 1500)); r = await sincronizar(); }
        if ((r === 'erro' || r === 'ocupado') && !window.confirm('Não foi possível enviar as últimas mudanças para a sua conta (sem internet?).\n\nSe sair agora, o que não foi enviado se perde. Sair mesmo assim?')) return;
        nuvemRef.current = null;
        try { const fb = await carregarFirebase(); await fb.auth().signOut(); } catch (e) {}
        limparAparelho();
        exibirNotificacao('Você saiu. Os dados deste aparelho foram apagados');
      };

      // Anota uma ação no histórico e devolve a lista nova (para salvar junto)
      const anotar = (acao, detalhe) => {
        const novo = [{ id: Date.now() + '-' + Math.random().toString(36).slice(2, 7), quando: new Date().toISOString(), quem: nomeAutor, acao, detalhe }, ...historico].slice(0, 500);
        setHistorico(novo);
        return novo;
      };

      const salvarNome = (nome) => {
        setNomeUsuario(nome);
        try { localStorage.setItem('@finapp_nome', nome); } catch (e) {}
      };

      const formatarMoeda = (val) => Number(val || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
      const formatarDataBR = (dataISO) => {
        if (!dataISO) return '';
        const [ano, mes, dia] = dataISO.split('-');
        return `${dia}/${mes}/${ano}`;
      };

      // Números do mês escolhido (Dashboard e Planejamento)
      const somar = (lista) => lista.reduce((acc, t) => acc + Number(t.amount), 0);
      // Lançamentos com data futura são "agendados": aparecem à parte e só entram nos totais quando o dia chegar
      const hoje = hojeISO();
      const ehFuturo = (t) => t.date > hoje;
      const agendadosDoMes = transacoes.filter(t => mesDe(t.date) === mesSelecionado && ehFuturo(t)).sort((a, b) => a.date.localeCompare(b.date));
      const transacoesDoMes = transacoes.filter(t => mesDe(t.date) === mesSelecionado && !ehFuturo(t));
      const totalReceitas = somar(transacoesDoMes.filter(t => t.type === 'receita'));
      // Receitas que ficaram na conta (as que foram direto para metas não entram no saldo da conta)
      const receitasConta = somar(transacoesDoMes.filter(t => t.type === 'receita' && entraNaConta(t)));
      const receitasParaMetas = totalReceitas - receitasConta;
      const totalDespesas = somar(transacoesDoMes.filter(t => t.type === 'despesa'));
      const totalGastos = somar(transacoesDoMes.filter(t => t.type === 'gasto'));

      const totalSaidas = totalDespesas + totalGastos;
      const saldoMes = receitasConta - totalSaidas;

      // Saldo acumulado: tudo até o fim do mês escolhido
      const transacoesAteMes = transacoes.filter(t => mesDe(t.date) <= mesSelecionado && !ehFuturo(t));
      // Saldo do mês se todos os agendados acontecerem
      const saldoPrevistoMes = saldoMes + somar(agendadosDoMes.filter(t => t.type === 'receita' && entraNaConta(t))) - somar(agendadosDoMes.filter(t => t.type !== 'receita'));
      const saldoAcumulado = somar(transacoesAteMes.filter(t => t.type === 'receita' && entraNaConta(t))) - somar(transacoesAteMes.filter(t => t.type !== 'receita'));

      // "Metas" (aportes) fica fora do planejamento: é dinheiro guardado, não gasto
      const categoriasDeGastos = catDoMes('saida', mesSelecionado);
      const categoriasDeGanhos = catDoMes('entrada', mesSelecionado);
      // Categorias criadas em meses anteriores que ainda esperam resposta: "continua neste mês?"
      const categoriasPerguntar = ['entrada', 'saida'].flatMap(grupo => (categoriasExtras[grupo] || [])
        .filter(cat => { const i = categoriasExtras.info[chaveInfo(grupo, cat)]; return i && i.criadaEm && !i.confirmada && !i.ate && mesSelecionado > i.criadaEm; })
        .map(cat => ({ grupo, cat, criadaEm: categoriasExtras.info[chaveInfo(grupo, cat)].criadaEm })));

      const gastosPorCategoria = categoriasDeGastos.reduce((acc, cat) => {
        acc[cat] = somar(transacoesDoMes.filter(t => (t.type === 'despesa' || t.type === 'gasto') && t.category === cat));
        return acc;
      }, {});

      const orcamentoTotalPlanejado = categoriasDeGastos.reduce((a, cat) => a + Number(limitesCategorias[cat] || 0), 0);
      const totalGastoGeral = Object.values(gastosPorCategoria).reduce((a, b) => a + Number(b), 0);
      const saldoRestanteGeral = orcamentoTotalPlanejado - totalGastoGeral;
      const percentualOrcamento = orcamentoTotalPlanejado > 0 ? (totalGastoGeral / orcamentoTotalPlanejado) * 100 : 0;

      // Planejamento de ganhos: quanto se espera receber em cada categoria de entrada
      const ganhosPorCategoria = categoriasDeGanhos.reduce((acc, cat) => {
        acc[cat] = somar(transacoesDoMes.filter(t => t.type === 'receita' && t.category === cat && t.metaMov !== 'retirada'));
        return acc;
      }, {});
      const ganhosPrevistos = categoriasDeGanhos.reduce((a, cat) => a + Number(limitesCategorias[chaveLimite('entrada', cat)] || 0), 0);
      const ganhosRecebidos = Object.values(ganhosPorCategoria).reduce((a, b) => a + b, 0);

      // O orçamento do mês cresce a cada receita que entra na conta
      const orcamentoDoMes = receitasConta;
      const disponivelOrcamento = orcamentoDoMes - totalSaidas;

      // Metas: totais e gráfico
      const totalObjetivoMetas = metas.reduce((a, m) => a + Number(m.objetivo || 0), 0);
      const totalGuardadoMetas = metas.reduce((a, m) => a + Math.max(0, guardadoDaMeta(m)), 0);
      const totalFaltaMetas = metas.reduce((a, m) => a + Math.max(0, Number(m.objetivo || 0) - guardadoDaMeta(m)), 0);
      const percentualMetas = totalObjetivoMetas > 0 ? Math.min(100, (totalGuardadoMetas / totalObjetivoMetas) * 100) : 0;
      const temExemplos = transacoes.some(t => t.exemplo) || metas.some(m => m.exemplo);

      // Gráfico de gastos por categoria e comparação com o mês anterior
      const fatiasGastos = categoriasDeGastos.map(cat => ({ cat, valor: gastosPorCategoria[cat] || 0, cor: corDaCategoria(cat).color })).filter(f => f.valor > 0).sort((a, b) => b.valor - a.valor);
      const mesAnteriorSel = somarMeses(mesSelecionado, -1);
      const saidasMesAnterior = somar(transacoes.filter(t => mesDe(t.date) === mesAnteriorSel && !ehFuturo(t) && (t.type === 'despesa' || t.type === 'gasto') && t.category !== 'Metas'));
      const variacaoGastos = saidasMesAnterior > 0 ? ((totalGastoGeral - saidasMesAnterior) / saidasMesAnterior) * 100 : null;
      let acumuladoFatias = 0;
      const gradienteGastos = totalGastoGeral > 0
        ? 'conic-gradient(' + fatiasGastos.map(f => { const ini = acumuladoFatias; acumuladoFatias += (f.valor / totalGastoGeral) * 360; return f.cor + ' ' + ini + 'deg ' + acumuladoFatias + 'deg'; }).join(', ') + ')'
        : 'var(--border)';
      // Contas a vencer nos próximos 7 dias (lançamentos agendados de saída)
      const daquiA7 = (() => { const d = new Date(hoje + 'T12:00:00'); d.setDate(d.getDate() + 7); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); })();
      const proximosVencimentos = transacoes.filter(t => t.type !== 'receita' && t.date > hoje && t.date <= daquiA7).sort((a, b) => a.date.localeCompare(b.date));

      const ordenarPorData = (lista) => lista.sort((a, b) => new Date(b.date) - new Date(a.date));

      // Dinheiro na conta hoje (tudo que já aconteceu, de todos os meses)
      const saldoContaHoje = somar(transacoes.filter(t => !ehFuturo(t) && t.type === 'receita' && entraNaConta(t))) - somar(transacoes.filter(t => !ehFuturo(t) && t.type !== 'receita'));
      // Nenhuma meta pode ficar com valor guardado negativo (seria tirar dinheiro que não existe)
      const metaFicaNegativa = (lista) => lista.find(m => guardadoDaMeta(m) < -0.005);
      const avisoMetaNegativa = (m) => 'Não dá: a meta "' + m.nome + '" ficaria com ' + formatarMoeda(guardadoDaMeta(m)) + '. Exclua antes a retirada que usou esse dinheiro.';

      function adicionarTransacao(e) {
        e.preventDefault();
        setErroTransacao('');
        if (!descricao.trim()) { setErroTransacao('A descrição é obrigatória.'); return; }
        const numValor = lerValor(valor);
        if (isNaN(numValor) || numValor <= 0) { setErroTransacao('Digite um valor maior que zero, por exemplo 12,50.'); return; }
        if (!dataTransacao) { setErroTransacao('Escolha a data do lançamento.'); return; }

        const dados = { description: descricao.trim(), amount: Math.round(numValor * 100) / 100, category: categoria, type: tipo, date: dataTransacao };
        // Receita: fica na conta ou entra direto numa meta.
        // Aportes e retiradas feitos pela tela de Metas mantêm a ligação que já têm.
        const original = editandoId !== null ? transacoes.find(t => t.id === editandoId) : null;
        const movFixo = original && (original.metaMov === 'aporte' || original.metaMov === 'retirada');
        if (movFixo) {
          // Aporte continua gasto e retirada continua receita, senão o dinheiro seria contado duas vezes
          dados.type = original.type;
          dados.category = original.category;
        } else {
          const metaDestino = tipo === 'receita' && destinoReceita !== 'conta' ? metas.find(m => String(m.id) === String(destinoReceita)) : null;
          dados.metaId = metaDestino ? metaDestino.id : undefined;
          dados.metaMov = metaDestino ? 'entrada' : undefined;
        }
        let novasTransacoes;
        let novosRecorrentes = recorrentes;
        let novasMetas = metas;
        let afetadas = [];

        const usarDias = editandoId === null && repetirDias && !repetirMensal;
        const cadaDias = Math.floor(Number(aCadaDias));
        const vezes = Math.floor(Number(vezesRepetir));
        if (usarDias && (!(cadaDias >= 1) || cadaDias > 365)) { setErroTransacao('Repita a cada 1 a 365 dias.'); return; }
        if (usarDias && (!(vezes >= 2) || vezes > 60)) { setErroTransacao('Escolha de 2 a 60 vezes no total.'); return; }
        const qtdParcelas = usarDias ? 1 : Math.floor(Number(parcelas) || 1);
        if (editandoId === null && tipo !== 'receita' && !repetirMensal && (qtdParcelas < 1 || qtdParcelas > 48)) { setErroTransacao('Parcele em 1 a 48 vezes.'); return; }
        if (editandoId !== null) {
          dados.editadoPor = nomeAutor;
        } else {
          dados.autor = nomeAutor;
        }

        if (editandoId !== null) {
          novasTransacoes = ordenarPorData(transacoes.map(t => (t.id === editandoId ? { ...t, ...dados } : t)));
          afetadas = novasTransacoes.filter(t => t.id === editandoId);
        } else if (usarDias) {
          // Repete a cada N dias: cria todos de uma vez; os de data futura ficam como agendados
          const grupo = Date.now();
          afetadas = datasRepeticao(dataTransacao, cadaDias, vezes).map((data, i) => ({ ...dados, id: grupo + i, date: data, repeticaoGrupo: grupo, repeticao: 'a cada ' + cadaDias + ' dias' }));
          novasTransacoes = ordenarPorData([...afetadas, ...transacoes]);
        } else if (!repetirMensal && tipo !== 'receita' && qtdParcelas > 1) {
          // Compra parcelada: uma parcela por mês; a última ajusta os centavos
          const grupo = Date.now();
          const centavos = Math.round(dados.amount * 100);
          const parcela = Math.floor(centavos / qtdParcelas);
          const [a, m, d] = dataTransacao.split('-').map(Number);
          afetadas = Array.from({ length: qtdParcelas }, (_, i) => {
            const mes = somarMeses(a + '-' + String(m).padStart(2, '0'), i);
            const dia = String(Math.min(d, ultimoDia(mes))).padStart(2, '0');
            const valorParcela = (i === qtdParcelas - 1 ? centavos - parcela * (qtdParcelas - 1) : parcela) / 100;
            return { ...dados, id: grupo + i, amount: valorParcela, date: mes + '-' + dia, description: dados.description + ' (' + (i + 1) + '/' + qtdParcelas + ')', parcelaGrupo: grupo };
          });
          novasTransacoes = ordenarPorData([...afetadas, ...transacoes]);
        } else if (repetirMensal) {
          // Conta fixa: lança este mês agora e os próximos automaticamente
          const rec = { id: Date.now(), ...dados, dia: Number(dataTransacao.slice(8, 10)), inicio: mesDe(dataTransacao), gerados: [mesDe(dataTransacao)], ativo: true };
          const nova = { id: Date.now() + 1, ...dados, recorrenteId: rec.id };
          novosRecorrentes = [...recorrentes, rec];
          novasTransacoes = ordenarPorData([nova, ...transacoes]);
          afetadas = [nova];
          const gerado = gerarLancamentosFixos(novosRecorrentes, novasTransacoes, mesDe(hojeISO()));
          if (gerado) { novasTransacoes = gerado.transacoes; novosRecorrentes = gerado.recorrentes; afetadas = [nova, ...gerado.novas]; }
          setRecorrentes(novosRecorrentes);
        } else {
          const nova = { id: Date.now(), ...dados };
          novasTransacoes = ordenarPorData([nova, ...transacoes]);
          afetadas = [nova];
        }
        // Ao editar, primeiro tira da meta antiga o valor que o lançamento tinha
        const base = original ? sincronizarMeta(metas, original, true) : metas;
        novasMetas = afetadas.reduce((acc, t) => sincronizarMeta(acc, t), base);
        const negativa = metaFicaNegativa(novasMetas);
        if (negativa) { setErroTransacao(avisoMetaNegativa(negativa)); return; }

        const parcelado = editandoId === null && !repetirMensal && !usarDias && tipo !== 'receita' && qtdParcelas > 1;
        const hist = anotar(
          editandoId !== null ? 'Editou lançamento' : usarDias ? 'Lançou com repetição' : parcelado ? 'Lançou compra parcelada' : repetirMensal ? 'Criou conta fixa' : 'Lançou ' + (tipo === 'receita' ? 'receita' : tipo === 'despesa' ? 'despesa' : 'gasto'),
          dados.description + ' · ' + formatarMoeda(dados.amount) + (parcelado ? ' em ' + qtdParcelas + 'x' : '') + (usarDias ? ' · a cada ' + cadaDias + ' dias, ' + vezes + ' vezes' : '') + ' · ' + dados.category
        );

        setTransacoes(novasTransacoes);
        setMetas(novasMetas);
        fecharModalTransacao();
        salvarTudoNoDisco({ transacoes: novasTransacoes, recorrentes: novosRecorrentes, metas: novasMetas, historico: hist });
        const metaMsg = dados.metaMov === 'entrada' ? ' e somada à meta' : '';
        exibirNotificacao((editandoId !== null ? 'Lançamento atualizado' : usarDias ? vezes + ' lançamentos criados, a cada ' + cadaDias + ' dias' : parcelado ? 'Compra lançada em ' + qtdParcelas + ' parcelas' : repetirMensal ? 'Conta fixa criada: repete todo mês' : 'Lançamento guardado') + metaMsg);
      }

      // Salva direto o que o lançamento rápido entendeu
      function salvarLancamentoRapido() {
        if (!previaRapida) return;
        const nova = { id: Date.now(), ...previaRapida, autor: nomeAutor, viaRapido: true };
        const novasTransacoes = ordenarPorData([nova, ...transacoes]);
        const hist = anotar('Lançou pelo lançamento rápido', nova.description + ' · ' + formatarMoeda(nova.amount) + ' · ' + nova.category);
        setTransacoes(novasTransacoes);
        setPreviaRapida(null);
        setTextoRapido('');
        salvarTudoNoDisco({ transacoes: novasTransacoes, historico: hist });
        exibirNotificacao('Guardado: ' + formatarMoeda(nova.amount) + ' em ' + nova.category);
      }

      function interpretarRapido(texto) {
        const r = interpretarTexto(texto, catEntrada, catSaida, hojeISO());
        setPreviaRapida(r);
        if (!r) exibirNotificacao('Não achei o valor. Tente algo como "gastei 46 na padaria"');
      }

      // Abre o formulário completo já preenchido com o que foi entendido
      function corrigirRapido() {
        if (!previaRapida) return;
        abrirModalComData(previaRapida.date);
        setDescricao(previaRapida.description);
        setValor(valorParaCampo(previaRapida.amount));
        setTipo(previaRapida.type);
        setCategoria(previaRapida.category);
        setPreviaRapida(null);
        setTextoRapido('');
      }

      // ===== VOZ (sem pedir permissão) =====
      // O 🎤 do app abre o teclado no campo de lançamento rápido; a pessoa fala pelo 🎤 do próprio
      // teclado (Gboard, ditado do iPhone), que já tem permissão no celular. Assim o site nunca
      // pede acesso ao microfone. Quando ela para de falar, o app entende sozinho.
      function ouvirVoz() {
        const campo = document.getElementById && document.getElementById('texto-rapido');
        if (campo && campo.focus) campo.focus();
        setOuvindo(true);
        setAvisoVoz('');
      }

      // Entende sozinho ~1 s depois que a pessoa para de falar ou digitar
      const timerRapido = useRef(null);
      function mudarTextoRapido(texto) {
        setTextoRapido(texto);
        setPreviaRapida(null);
        clearTimeout(timerRapido.current);
        if (!/\d|\bmil\b/i.test(texto)) return;
        timerRapido.current = setTimeout(() => {
          const r = interpretarTexto(texto, catEntrada, catSaida, hojeISO());
          if (r) { setPreviaRapida(r); setOuvindo(false); }
        }, 1100);
      }

      function fecharModalTransacao() {
        setModalTransacaoAberto(false);
        setEditandoId(null);
        setRepetirMensal(false);
        setRepetirDias(false);
        setDoCalendario(false);
        setDestinoReceita('conta');
        setParcelas('1');
        setDescricao(''); setValor(''); setErroTransacao('');
      }

      function trocarTipo(novoTipo) {
        setTipo(novoTipo);
        if (!categoriasDoTipo(novoTipo).includes(categoria)) setCategoria(CATEGORIA_PADRAO[novoTipo]);
      }

      function abrirEdicao(t) {
        setEditandoId(t.id);
        setRepetirMensal(false);
        setDescricao(t.description);
        setValor(valorParaCampo(t.amount));
        setTipo(t.type);
        setCategoria(t.category);
        setDataTransacao(t.date);
        setDestinoReceita(t.metaMov === 'entrada' && t.metaId ? String(t.metaId) : 'conta');
        setErroTransacao('');
        setModalTransacaoAberto(true);
      }

      function pararRecorrente(id) {
        if (!confirm('Parar de lançar esta conta todo mês? Os lançamentos que já existem continuam no extrato.')) return;
        const novos = recorrentes.map(r => (r.id === id ? { ...r, ativo: false } : r));
        setRecorrentes(novos);
        salvarTudoNoDisco({ recorrentes: novos });
        exibirNotificacao('Conta fixa encerrada');
      }

      function excluirTransacao(id) {
        const alvo = transacoes.find(t => t.id === id);
        const novasMetas = alvo ? sincronizarMeta(metas, alvo, true) : metas;
        const negativa = metaFicaNegativa(novasMetas);
        if (negativa) { exibirNotificacao(avisoMetaNegativa(negativa)); return; }
        const aviso = alvo && alvo.metaId ? 'Deseja excluir este lançamento? O valor também sai da meta.' : 'Deseja excluir este lançamento?';
        if (confirm(aviso)) {
          const novasTransacoes = transacoes.filter(t => t.id !== id);
          const hist = alvo ? anotar('Excluiu lançamento', alvo.description + ' · ' + formatarMoeda(alvo.amount) + ' · ' + alvo.category) : historico;
          setTransacoes(novasTransacoes);
          setMetas(novasMetas);
          salvarTudoNoDisco({ transacoes: novasTransacoes, metas: novasMetas, historico: hist });
        }
      }

      const transacoesFiltradas = transacoes.filter(t => {
        if (filtroTipo !== 'todas' && t.type !== filtroTipo) return false;
        if (filtroCategoria !== 'todas' && t.category !== filtroCategoria) return false;
        if (termoPesquisa && !t.description.toLowerCase().includes(termoPesquisa.toLowerCase())) return false;
        return true;
      });

      const [erroMeta, setErroMeta] = useState('');

      function adicionarMeta(e) {
        e.preventDefault();
        setErroMeta('');
        const objetivo = lerValor(objetivoMeta);
        const guardado = economizadoMeta === '' ? 0 : lerValor(economizadoMeta);
        if (!nomeMeta.trim()) { setErroMeta('Dê um nome para a meta.'); return; }
        if (isNaN(objetivo) || objetivo <= 0) { setErroMeta('Digite o valor desejado, por exemplo 5000 ou 5.000,00.'); return; }
        if (isNaN(guardado) || guardado < 0) { setErroMeta('O valor já guardado não pode ser negativo.'); return; }

        const novasMetas = editandoMetaId !== null
          ? metas.map(m => (m.id === editandoMetaId ? { ...m, nome: nomeMeta.trim(), objetivo, inicial: guardado } : m))
          : [...metas, { id: Date.now(), nome: nomeMeta.trim(), objetivo, inicial: guardado, aportes: [] }];
        const negativa = metaFicaNegativa(novasMetas);
        if (negativa) { setErroMeta('O valor inicial não pode ser tão baixo: já foram retirados ' + formatarMoeda(guardado - guardadoDaMeta(negativa)) + ' desta meta.'); return; }

        const hist = anotar(editandoMetaId !== null ? 'Editou meta' : 'Criou meta', nomeMeta.trim() + ' · objetivo ' + formatarMoeda(objetivo));
        setMetas(novasMetas);
        fecharModalMeta();
        salvarTudoNoDisco({ metas: novasMetas, historico: hist });
      }

      function fecharModalMeta() {
        setModalMetaAberto(false);
        setEditandoMetaId(null);
        setNomeMeta(''); setObjetivoMeta(''); setEconomizadoMeta(''); setErroMeta('');
      }

      function abrirEdicaoMeta(meta) {
        setEditandoMetaId(meta.id);
        setNomeMeta(meta.nome);
        setObjetivoMeta(valorParaCampo(meta.objetivo));
        setEconomizadoMeta(valorParaCampo(meta.inicial || 0));
        setErroMeta('');
        setModalMetaAberto(true);
      }

      function alterarValorMeta(id, operacao) {
        const lido = lerValor(valoresAporte[id]);
        if (isNaN(lido) || lido <= 0) { exibirNotificacao('Digite um valor, por exemplo 50,00'); return; }
        const quantia = Math.round(lido * 100) / 100;

        const metaAlvo = metas.find(m => m.id === id);
        if (!metaAlvo) return;
        const nomeDaMeta = metaAlvo.nome;
        // Só retira o que a meta tem; só guarda o que a conta tem
        const guardadoAtual = Math.round(guardadoDaMeta(metaAlvo) * 100) / 100;
        if (operacao !== 'somar' && quantia > guardadoAtual) {
          exibirNotificacao(guardadoAtual <= 0 ? 'Esta meta está zerada: não há o que retirar' : 'A meta só tem ' + formatarMoeda(guardadoAtual) + ' para retirar');
          return;
        }
        const saldoAtual = Math.round(saldoContaHoje * 100) / 100;
        if (operacao === 'somar' && quantia > saldoAtual) {
          exibirNotificacao(saldoAtual <= 0 ? 'A conta está sem saldo. Lance a receita primeiro ou mande a receita direto para a meta' : 'A conta só tem ' + formatarMoeda(saldoAtual) + ' para guardar');
          return;
        }

        const novaTransacao = {
          id: Date.now(),
          description: operacao === 'somar' ? `Aporte: ${nomeDaMeta}` : `Retirada: ${nomeDaMeta}`,
          amount: quantia,
          category: 'Metas',
          type: operacao === 'somar' ? 'gasto' : 'receita',
          date: hojeISO(),
          metaId: id,
          metaMov: operacao === 'somar' ? 'aporte' : 'retirada'
        };

        const novasMetas = sincronizarMeta(metas, novaTransacao);
        const novasTransacoes = [novaTransacao, ...transacoes].sort((a, b) => new Date(b.date) - new Date(a.date));

        setMetas(novasMetas);
        setTransacoes(novasTransacoes);
        setValoresAporte(prev => ({ ...prev, [id]: '' }));
        const hist = anotar(operacao === 'somar' ? 'Guardou na meta' : 'Retirou da meta', nomeDaMeta + ' · ' + formatarMoeda(quantia));

        salvarTudoNoDisco({ metas: novasMetas, transacoes: novasTransacoes, historico: hist });
      }

      function excluirMeta(id) {
        const meta = metas.find(m => m.id === id);
        if (!meta) return;
        // Dinheiro que saiu da conta para a meta (aportes − retiradas) volta para a conta; o valor inicial não veio da conta
        const devolver = Math.round((meta.aportes || []).filter(a => a.tipo !== 'entrada').reduce((s, a) => s + Number(a.valor), 0) * 100) / 100;
        const aviso = devolver > 0
          ? 'Deseja excluir esta meta? Os ' + formatarMoeda(devolver) + ' que você guardou nela voltam para a conta, assim como as receitas que entraram direto nela.'
          : 'Deseja excluir esta meta? As receitas que entraram direto nela passam a contar na conta.';
        if (confirm(aviso)) {
          const novasMetas = metas.filter(m => m.id !== id);
          // Receitas que iam direto para esta meta voltam a ser da conta; aportes e retiradas ficam no extrato como histórico
          let novasTransacoes = transacoes.map(t => (t.metaId === id ? { ...t, metaId: undefined, metaMov: t.metaMov === 'entrada' ? undefined : t.metaMov } : t));
          if (devolver > 0) novasTransacoes = ordenarPorData([{ id: Date.now(), description: 'Devolução da meta excluída: ' + meta.nome, amount: devolver, category: 'Metas', type: 'receita', date: hojeISO() }, ...novasTransacoes]);
          const novosRecorrentes = recorrentes.map(r => (r.metaId === id ? { ...r, metaId: undefined, metaMov: undefined } : r));
          setMetas(novasMetas);
          setTransacoes(novasTransacoes);
          setRecorrentes(novosRecorrentes);
          const hist = anotar('Excluiu meta', meta.nome + (devolver > 0 ? ' · ' + formatarMoeda(devolver) + ' voltaram para a conta' : ''));
          salvarTudoNoDisco({ metas: novasMetas, transacoes: novasTransacoes, recorrentes: novosRecorrentes, historico: hist });
        }
      }

      // Exclui uma movimentação da meta (e o lançamento ligado a ela, se existir)
      function excluirMovimentoMeta(meta, mov) {
        const novasMetas = metas.map(m => (m.id === meta.id ? { ...m, aportes: (m.aportes || []).filter(a => a.id !== mov.id) } : m));
        const negativa = metaFicaNegativa(novasMetas);
        if (negativa) { exibirNotificacao(avisoMetaNegativa(negativa)); return; }
        if (!confirm('Excluir esta movimentação de ' + formatarMoeda(Math.abs(mov.valor)) + ' da meta "' + meta.nome + '"? O lançamento ligado a ela também sai do extrato.')) return;
        const novasTransacoes = mov.transacaoId ? transacoes.filter(t => t.id !== mov.transacaoId) : transacoes;
        const hist = anotar('Excluiu movimentação da meta', meta.nome + ' · ' + formatarMoeda(Math.abs(mov.valor)));
        setMetas(novasMetas);
        setTransacoes(novasTransacoes);
        salvarTudoNoDisco({ metas: novasMetas, transacoes: novasTransacoes, historico: hist });
        exibirNotificacao('Movimentação excluída');
      }

      // ===== DADOS DE EXEMPLO =====
      // Ajudam a entender o app. Ficam marcados como "Exemplo" e saem todos de uma vez.
      function carregarExemplos() {
        const mes = mesDe(hojeISO());
        const diaHoje = Number(hojeISO().slice(8, 10));
        const d = (dia) => mes + '-' + String(Math.min(dia, diaHoje)).padStart(2, '0');
        let id = Date.now();
        const metaReserva = { id: id++, nome: 'Reserva de emergência (exemplo)', objetivo: 10000, inicial: 1500, aportes: [], exemplo: true };
        const metaViagem = { id: id++, nome: 'Viagem de férias (exemplo)', objetivo: 4000, inicial: 0, aportes: [], exemplo: true };
        const ex = (description, amount, category, type, dia, extra = {}) => ({ id: id++, description, amount, category, type, date: d(dia), exemplo: true, ...extra });
        const lista = [
          ex('Salário', 3500, 'Salário', 'receita', 5),
          ex('Venda de produto', 450, 'Vendas', 'receita', 12),
          ex('Venda online', 300, 'Vendas', 'receita', 15, { metaId: metaViagem.id, metaMov: 'entrada' }),
          ex('Aluguel', 1100, 'Moradia', 'despesa', 10),
          ex('Conta de luz', 180, 'Moradia', 'despesa', 10),
          ex('Internet', 100, 'Moradia', 'despesa', 10),
          ex('Escola / curso', 250, 'Educação', 'despesa', 8),
          ex('Mercado do mês', 620, 'Alimentação', 'gasto', 6),
          ex('Lanche', 45, 'Alimentação', 'gasto', 14),
          ex('Uber / ônibus', 130, 'Transporte', 'gasto', 9),
          ex('Farmácia', 85, 'Saúde', 'gasto', 11),
          ex('Cinema', 60, 'Lazer', 'gasto', 13),
          ex('Aporte: Reserva de emergência (exemplo)', 200, 'Metas', 'gasto', 6, { metaId: metaReserva.id, metaMov: 'aporte' })
        ];
        const novasMetas = lista.reduce((acc, t) => sincronizarMeta(acc, t), [...metas, metaReserva, metaViagem]);
        const novasTransacoes = ordenarPorData([...lista, ...transacoes]);
        // Previsão de ganhos de exemplo, só onde ainda não há valor definido
        const novosLimites = { ...limitesCategorias };
        if (!Number(novosLimites['prev:Salário'])) novosLimites['prev:Salário'] = 3500;
        if (!Number(novosLimites['prev:Vendas'])) novosLimites['prev:Vendas'] = 800;
        setMetas(novasMetas);
        setTransacoes(novasTransacoes);
        setLimitesCategorias(novosLimites);
        setMesSelecionado(mes);
        salvarTudoNoDisco({ metas: novasMetas, transacoes: novasTransacoes, limitesCategorias: novosLimites });
        exibirNotificacao('Dados de exemplo carregados');
      }

      function removerExemplos() {
        if (!confirm('Remover todos os dados de exemplo? Seus lançamentos e metas reais continuam.')) return;
        const removidas = transacoes.filter(t => t.exemplo);
        let novasMetas = removidas.reduce((acc, t) => sincronizarMeta(acc, t, true), metas.filter(m => !m.exemplo));
        const idsMetasExemplo = metas.filter(m => m.exemplo).map(m => m.id);
        const novasTransacoes = transacoes.filter(t => !t.exemplo).map(t => (idsMetasExemplo.includes(t.metaId) ? { ...t, metaId: undefined, metaMov: undefined } : t));
        setMetas(novasMetas);
        setTransacoes(novasTransacoes);
        salvarTudoNoDisco({ metas: novasMetas, transacoes: novasTransacoes });
        exibirNotificacao('Dados de exemplo removidos');
      }

      // ===== CATEGORIAS DO PLANEJAMENTO (criar, renomear, ajustar valor, excluir) =====
      function abrirCategoria(grupo, cat) {
        setGrupoEditando(grupo);
        setCriandoCategoria(!cat);
        setCategoriaEditando(cat || '');
        setNomeCategoriaEdit(cat || '');
        setNovoLimiteCategoria(cat ? valorParaCampo(Number(limitesCategorias[chaveLimite(grupo, cat)] || 0)) : '');
        setErroCategoria('');
        setModalOrcamentoAberto(true);
      }

      function fecharCategoria() {
        setModalOrcamentoAberto(false);
        setNovoLimiteCategoria('');
        setErroCategoria('');
      }

      // Troca o nome da categoria em todos os lançamentos e contas fixas do mesmo grupo
      const trocarCategoriaNosLancamentos = (grupo, de, para) => {
        const doGrupo = (t) => (grupo === 'entrada' ? t.type === 'receita' : t.type !== 'receita');
        return {
          transacoes: transacoes.map(t => (t.category === de && doGrupo(t) ? { ...t, category: para } : t)),
          recorrentes: recorrentes.map(r => (r.category === de && doGrupo(r) ? { ...r, category: para } : r))
        };
      };

      function handleSalvarLimiteCategoria(e) {
        e.preventDefault();
        setErroCategoria('');
        const val = novoLimiteCategoria === '' ? 0 : lerValor(novoLimiteCategoria);
        if (isNaN(val) || val < 0) { setErroCategoria('Digite um valor válido, por exemplo 800,00'); return; }

        const grupo = grupoEditando;
        const podeRenomear = criandoCategoria || ehCategoriaCriada(grupo, categoriaEditando);
        const nome = podeRenomear ? nomeCategoriaEdit.trim().replace(/\s+/g, ' ') : categoriaEditando;
        if (!nome) { setErroCategoria('Dê um nome para a categoria, por exemplo "Pets" ou "Freelance".'); return; }
        if (nome.length > 30) { setErroCategoria('Use um nome com até 30 letras.'); return; }
        // Recriar uma categoria que tinha ficado "só naquele mês" volta a usá-la
        const parada = criandoCategoria && (categoriasExtras[grupo] || []).find(c => c.toLowerCase() === nome.toLowerCase() && (categoriasExtras.info[chaveInfo(grupo, c)] || {}).ate);
        if (parada) {
          const novasExtras2 = { ...categoriasExtras, info: { ...categoriasExtras.info, [chaveInfo(grupo, parada)]: { ...categoriasExtras.info[chaveInfo(grupo, parada)], confirmada: true, ate: null } } };
          const novosLimites2 = { ...limitesCategorias, [chaveLimite(grupo, parada)]: val };
          setCategoriasExtras(novasExtras2);
          setLimitesCategorias(novosLimites2);
          fecharCategoria();
