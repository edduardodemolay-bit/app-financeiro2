                          {Object.entries(detalhes.membros || {}).map(([uid, papel]) => (
                            <div key={uid} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: '6px', marginTop: '4px' }}>
                              <span style={{ minWidth: 0, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{(detalhes.nomes && detalhes.nomes[uid]) || 'Pessoa'}{uid === meuUid ? ' (você)' : ''} · {papel === 'dono' ? 'dono' : 'convidado'}</span>
                              {detalhes.papel === 'dono' && papel !== 'dono' && (
                                <button onClick={() => tirarDaGestao(detalhes, uid, detalhes.nomes && detalhes.nomes[uid])} style={{ background: 'none', border: 'none', color: 'var(--danger-text)', fontWeight: '600', fontSize: '11px', cursor: 'pointer', padding: 0, flexShrink: 0 }}>Tirar</button>
                              )}
                            </div>
                          ))}
                        </div>
                        {detalhes.papel === 'dono' ? (
                          <div style={{ display: 'flex', gap: '6px' }}>
                            <button onClick={() => novoCodigoEspaco(detalhes)} style={botaoMenor}>Novo código</button>
                            <button onClick={() => excluirEspaco(detalhes)} style={{ ...botaoMenor, color: 'var(--danger-text)', borderColor: 'rgba(244, 63, 94, 0.45)' }}>Excluir gestão</button>
                          </div>
                        ) : (
                          <button onClick={() => tirarDaGestao(detalhes, meuUid, null)} style={{ ...botaoMenor, color: 'var(--danger-text)', borderColor: 'rgba(244, 63, 94, 0.45)' }}>Sair desta gestão</button>
                        )}
                      </div>
                    )}

                    {formEspaco ? (
                      <div style={{ display: 'flex', flexDirection: 'column', gap: '6px' }}>
                        <input
                          id="texto-gestao"
                          type="text"
                          autoFocus
                          value={textoEspaco}
                          onChange={e => setTextoEspaco(e.target.value)}
                          onKeyDown={e => { if (e.key === 'Enter') (formEspaco === 'criar' ? criarEspaco : entrarComCodigo)(); }}
                          placeholder={formEspaco === 'criar' ? 'Nome, ex.: Casa' : 'Código, ex.: EDD-7KQ4MZ'}
                          maxLength={formEspaco === 'criar' ? 40 : 12}
                          aria-label={formEspaco === 'criar' ? 'Nome da gestão compartilhada' : 'Código de convite'}
                          style={{ ...estilos.input, padding: '8px 10px', fontSize: '13px', textTransform: formEspaco === 'entrar' ? 'uppercase' : 'none' }}
                        />
                        <div style={{ display: 'flex', gap: '6px' }}>
                          <button onClick={() => { setFormEspaco(null); setTextoEspaco(''); }} style={botaoMenor}>Cancelar</button>
                          <button disabled={ocupadoEspaco} onClick={formEspaco === 'criar' ? criarEspaco : entrarComCodigo} style={{ ...botaoMenor, backgroundColor: 'var(--accent)', color: 'var(--on-accent)', border: 'none' }}>{ocupadoEspaco ? 'Aguarde…' : formEspaco === 'criar' ? 'Criar' : 'Entrar'}</button>
                        </div>
                      </div>
                    ) : (
                      <div style={{ display: 'flex', gap: '6px' }}>
                        <button onClick={() => { setFormEspaco('criar'); setTextoEspaco(''); }} style={botaoMenor}>+ Criar compartilhada</button>
                        <button onClick={() => { setFormEspaco('entrar'); setTextoEspaco(''); }} style={botaoMenor}>Entrar com código</button>
                      </div>
                    )}
                  </div>
                );
              })()}

              {usuarioNuvem && WHATSAPP_NUMERO && (
                <div style={{ marginTop: '14px', backgroundColor: 'var(--bg)', border: '1px solid var(--border)', borderRadius: '14px', padding: '14px', display: 'flex', flexDirection: 'column', gap: '8px', fontSize: '12px', color: 'var(--text)' }}>
                  <span style={{ fontSize: '11px', color: 'var(--text-muted)', fontWeight: '600', textTransform: 'uppercase' }}>📲 WhatsApp</span>
                  {whatsappLigado ? (
                    <React.Fragment>
                      <span>Ligado: <strong>{formatarTelefone(whatsappLigado)}</strong></span>
                      <span style={{ color: 'var(--text-muted)' }}>Mande para <strong>{formatarTelefone(WHATSAPP_NUMERO)}</strong> frases como "gastei 46 na padaria". Para uma gestão compartilhada: "casa: gastei 50 no mercado".</span>
                      <div style={{ display: 'flex', gap: '6px' }}>
                        <a href={'https://wa.me/' + WHATSAPP_NUMERO} target="_blank" rel="noopener" style={{ flex: 1, textAlign: 'center', textDecoration: 'none', backgroundColor: '#25D366', color: '#ffffff', borderRadius: '10px', padding: '8px 10px', fontWeight: '700' }}>Abrir conversa</a>
                        <button onClick={desligarWhatsapp} style={{ background: 'none', border: '1px solid var(--border-strong)', color: 'var(--text-muted)', borderRadius: '10px', padding: '8px 10px', fontWeight: '600', fontSize: '12px', cursor: 'pointer' }}>Desligar</button>
                      </div>
                    </React.Fragment>
                  ) : codigoWhatsapp ? (
                    <React.Fragment>
                      <span>Mande esta mensagem para <strong>{formatarTelefone(WHATSAPP_NUMERO)}</strong> do WhatsApp que você quer usar:</span>
                      <strong style={{ fontFamily: 'ui-monospace, Consolas, monospace', fontSize: '16px', textAlign: 'center', backgroundColor: 'var(--surface)', border: '1px dashed #25D366', borderRadius: '10px', padding: '8px' }}>LIGAR {codigoWhatsapp.codigo}</strong>
                      <a href={'https://wa.me/' + WHATSAPP_NUMERO + '?text=' + encodeURIComponent('LIGAR ' + codigoWhatsapp.codigo)} target="_blank" rel="noopener" style={{ textAlign: 'center', textDecoration: 'none', backgroundColor: '#25D366', color: '#ffffff', borderRadius: '10px', padding: '9px 10px', fontWeight: '700' }}>Abrir o WhatsApp com a mensagem</a>
                      <span style={{ color: 'var(--text-faint)', fontSize: '11px' }}>O código vale 15 minutos. Quando a mensagem chegar, este quadro muda sozinho.</span>
                      <button onClick={() => { const c = codigoWhatsapp.codigo; setCodigoWhatsapp(null); if (nuvemRef.current) nuvemRef.current.fb.firestore().collection('vinculosWhatsapp').doc(c).delete().catch(() => {}); }} style={{ background: 'none', border: 'none', color: 'var(--text-muted)', fontWeight: '600', fontSize: '12px', cursor: 'pointer', padding: 0 }}>Cancelar</button>
                    </React.Fragment>
                  ) : (
                    <React.Fragment>
                      <span style={{ color: 'var(--text-muted)' }}>Lance mandando mensagem no WhatsApp, como "gastei 46 na padaria".</span>
                      <button onClick={ligarWhatsapp} style={{ backgroundColor: '#25D366', color: '#ffffff', border: 'none', borderRadius: '10px', padding: '9px 10px', fontWeight: '700', fontSize: '12px', cursor: 'pointer' }}>Ligar meu WhatsApp</button>
                    </React.Fragment>
                  )}
                </div>
              )}

              <div style={{ marginTop: '22px' }}>
                <p style={{ fontSize: '11px', color: 'var(--text-muted)', margin: '0 0 8px 0', fontWeight: '600', textTransform: 'uppercase' }}>Aparência</p>
                <div role="radiogroup" aria-label="Aparência do app" style={{ display: 'flex', gap: '4px', padding: '4px', borderRadius: '12px', border: '1px solid var(--border-strong)', backgroundColor: 'var(--bg)' }}>
                  {[
                    { id: 'auto', rotulo: '🌗 Auto' },
                    { id: 'claro', rotulo: '☀️ Claro' },
                    { id: 'escuro', rotulo: '🌙 Escuro' }
                  ].map(op => {
                    const ativo = preferenciaTema === op.id;
                    return (
                      <button
                        key={op.id}
                        role="radio"
                        aria-checked={ativo}
                        onClick={() => setPreferenciaTema(op.id)}
                        style={{ flex: 1, padding: '8px 4px', borderRadius: '9px', border: 'none', backgroundColor: ativo ? 'var(--accent)' : 'transparent', color: ativo ? 'var(--on-accent)' : 'var(--text)', fontWeight: ativo ? '700' : '600', fontSize: '12px', cursor: 'pointer', whiteSpace: 'nowrap' }}
                      >
                        {op.rotulo}
                      </button>
                    );
                  })}
                </div>
                <p style={{ fontSize: '11px', color: 'var(--text-faint)', margin: '6px 0 18px 0' }}>
                  {preferenciaTema === 'auto'
                    ? 'Escuro das 18h às 6h, claro durante o dia' + (noite ? ' · agora: escuro' : ' · agora: claro')
                    : 'Fica sempre ' + (preferenciaTema === 'escuro' ? 'escuro' : 'claro') + '. Toque em Auto para voltar ao horário.'}
                </p>
                <p style={{ fontSize: '11px', color: 'var(--text-muted)', margin: '0 0 10px 0', fontWeight: '600', textTransform: 'uppercase' }}>Cor do tema</p>
                <div style={{ display: 'flex', gap: '10px' }}>
                  {Object.entries(TEMAS).map(([nome, t]) => (
                    <button
                      key={nome}
                      title={nome}
                      onClick={() => setCorTema(nome)}
                      style={{ width: '28px', height: '28px', borderRadius: '50%', backgroundColor: t.hex, cursor: 'pointer', border: corTema === nome ? '3px solid var(--text-strong)' : '3px solid transparent', padding: 0 }}
                    />
                  ))}
                </div>

                <p style={{ fontSize: '11px', color: 'var(--text-muted)', margin: '22px 0 10px 0', fontWeight: '600', textTransform: 'uppercase' }}>Backup dos dados</p>
                <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                  <button onClick={exportarDados} style={{ width: '100%', padding: '10px 12px', borderRadius: '10px', border: '1px solid var(--border-strong)', backgroundColor: 'var(--bg)', color: 'var(--text)', fontWeight: '600', fontSize: '13px', cursor: 'pointer' }}>
                    📤 Exportar backup
                  </button>
                  {podeGerenciar && (
                  <label style={{ width: '100%', padding: '10px 12px', borderRadius: '10px', border: '1px solid var(--border-strong)', backgroundColor: 'var(--bg)', color: 'var(--text)', fontWeight: '600', fontSize: '13px', cursor: 'pointer', textAlign: 'center', display: 'block' }}>
                    📥 Importar backup
                    <input type="file" accept="application/json,.json" onChange={importarDados} style={{ display: 'none' }} />
                  </label>
                  )}
                  <button onClick={exportarPlanilha} style={{ width: '100%', padding: '10px 12px', borderRadius: '10px', border: '1px solid var(--border-strong)', backgroundColor: 'var(--bg)', color: 'var(--text)', fontWeight: '600', fontSize: '13px', cursor: 'pointer' }}>
                    📊 Exportar planilha (Excel)
                  </button>
                  {!espacoAtivo && <button onClick={() => { (temExemplos ? removerExemplos : carregarExemplos)(); setMenuAberto(false); }} style={{ width: '100%', padding: '10px 12px', borderRadius: '10px', border: '1px dashed var(--c-sky)', backgroundColor: 'var(--bg)', color: 'var(--c-sky)', fontWeight: '600', fontSize: '13px', cursor: 'pointer' }}>
                    {temExemplos ? '🧹 Remover dados de exemplo' : '✨ Carregar dados de exemplo'}
                  </button>}
                </div>
              </div>
            </div>

            <div style={{ backgroundColor: 'var(--bg)', border: '1px solid var(--border)', borderRadius: '14px', padding: '16px' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '8px', fontSize: '12px' }}>
                <span style={{ color: 'var(--text-muted)' }}>Planejamento Usado</span>
                <span style={{ color: percentualOrcamento >= 100 ? '#f43f5e' : 'var(--accent)', fontWeight: 'bold' }}>{percentualOrcamento.toFixed(0)}%</span>
              </div>
              <div style={{ width: '100%', backgroundColor: 'var(--border)', height: '8px', borderRadius: '999px', overflow: 'hidden' }}>
                <div style={{ width: `${Math.min(100, percentualOrcamento)}%`, backgroundColor: percentualOrcamento >= 100 ? '#f43f5e' : 'var(--accent)', height: '100%', borderRadius: '999px' }}></div>
              </div>
            </div>
          </aside>

          <main style={estilos.main}>
            <header style={isMobile ? { ...estilos.header, height: 'auto', minHeight: '60px', padding: '10px 12px', gap: '8px' } : estilos.header}>
              <div style={{ display: 'flex', alignItems: 'center', gap: '10px', minWidth: 0 }}>
              {isMobile && (
                <button onClick={() => setMenuAberto(true)} aria-label="Abrir menu" style={{ flexShrink: 0, width: '40px', height: '40px', borderRadius: '10px', border: '1px solid var(--border-strong)', backgroundColor: 'var(--bg)', color: 'var(--text)', fontSize: '20px', cursor: 'pointer', lineHeight: 1 }}>☰</button>
              )}
              <h2 style={{ fontSize: isMobile ? '15px' : '20px', fontWeight: 'bold', color: 'var(--text-strong)', margin: 0, ...(isMobile ? { whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' } : {}) }}>
                {abaAtiva === 'dashboard' && 'Visão Geral do Mês'}
                {abaAtiva === 'orcamento' && 'Planejamento de Ganhos e Gastos'}
                {abaAtiva === 'extrato' && 'Extrato de Lançamentos'}
                {abaAtiva === 'metas' && 'Metas e Objetivos'}
                {abaAtiva === 'calendario' && 'Calendário Anual Interativo'}
                {abaAtiva === 'devedores' && 'Quem me deve'}
                {abaAtiva === 'historico' && 'Histórico de Registros'}
                {abaAtiva === 'admin' && 'Administrador de Acessos'}
              </h2>
              </div>
              <div style={{ display: 'flex', gap: isMobile ? '8px' : '12px', flexShrink: 0 }}>
                {!isMobile && (
                  <span title="Tudo é salvo neste aparelho automaticamente" style={{ alignSelf: 'center', display: 'flex', alignItems: 'center', gap: '6px', fontSize: '12px', color: 'var(--text-muted)' }}>
                    <CheckCircle2 size={14} color="var(--accent)" />
                    {salvoEm ? 'Salvo às ' + salvoEm.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : 'Salvo automaticamente'}
                  </span>
                )}
                <button onClick={() => abrirModalComData(hojeISO())} style={isMobile ? { ...estilos.buttonPrimary, padding: '10px 12px' } : estilos.buttonPrimary} aria-label="Novo lançamento">
                  <PlusCircle size={20} /> {!isMobile && 'Novo Lançamento'}
                </button>
              </div>
            </header>

            <div style={{ padding: isMobile ? '14px' : '32px', maxWidth: '1400px', width: '100%', margin: '0 auto', boxSizing: 'border-box' }}>
              {espacoAtivo && abaAtiva !== 'admin' && (
                <div role="status" style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: '10px', flexWrap: 'wrap', marginBottom: isMobile ? '14px' : '20px', padding: '10px 14px', borderRadius: '12px', backgroundColor: 'rgba(168, 85, 247, 0.12)', border: '1px solid rgba(168, 85, 247, 0.35)', fontSize: '13px', color: 'var(--text)' }}>
                  <span>👥 Gestão compartilhada <strong>{espacoAtivo.nome}</strong>{espacoAtivo.papel === 'dono' ? ' · você é o dono' : ' · você pode lançar e ver (só o dono apaga)'}</span>
                  <button onClick={() => abrirEspaco(null)} style={{ background: 'none', border: 'none', color: 'var(--c-purple)', fontWeight: '700', fontSize: '12px', cursor: 'pointer', padding: 0 }}>Ir para a pessoal</button>
                </div>
              )}

              {abaAtiva === 'dashboard' && (
                <div style={{ display: 'flex', flexDirection: 'column', gap: '28px' }}>
                  {!espacoAtivo && transacoes.length === 0 && metas.length === 0 && (
                    <div style={{ ...estilos.card, border: '1px dashed var(--c-sky)', display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: '16px', flexWrap: 'wrap' }}>
                      <div style={{ minWidth: 0, flex: '1 1 260px' }}>
                        <h3 style={{ margin: '0 0 4px 0', fontSize: '16px', fontWeight: 'bold', color: 'var(--text-strong)', display: 'flex', alignItems: 'center', gap: '8px' }}><Sparkles size={18} color="var(--c-sky)" /> Primeira vez aqui?</h3>
                        <p style={{ margin: 0, fontSize: '13px', color: 'var(--text-muted)' }}>Carregue um mês de exemplo, com salário, vendas, contas fixas, gastos do dia a dia e metas, para ver como tudo funciona. Depois é só remover.</p>
                      </div>
                      <button onClick={carregarExemplos} style={{ ...estilos.buttonPrimary, background: 'var(--c-sky)', boxShadow: 'none' }}><Sparkles size={16} /> Carregar exemplos</button>
                    </div>
                  )}
                  {temExemplos && podeGerenciar && (
                    <div style={{ backgroundColor: 'rgba(14, 165, 233, 0.12)', border: '1px solid rgba(14, 165, 233, 0.35)', borderRadius: '14px', padding: '12px 16px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: '12px', flexWrap: 'wrap', fontSize: '13px', color: 'var(--text)' }}>
                      <span>Você está vendo <strong>dados de exemplo</strong> (marcados como "Exemplo"). Eles servem só para mostrar como o app funciona.</span>
                      <button onClick={removerExemplos} style={{ background: 'none', border: '1px solid var(--c-sky)', color: 'var(--c-sky)', borderRadius: '8px', padding: '6px 12px', fontWeight: '700', fontSize: '12px', cursor: 'pointer' }}>Remover exemplos</button>
                    </div>
                  )}

                  <div style={estilos.card}>
                    <h3 style={{ fontSize: '16px', fontWeight: 'bold', color: 'var(--text-strong)', margin: '0 0 4px 0', display: 'flex', alignItems: 'center', gap: '8px' }}><Zap size={16} color="var(--accent)" /> Lançamento rápido</h3>
                    <p style={{ fontSize: '12px', color: 'var(--text-muted)', margin: '0 0 12px 0' }}>Escreva ou fale do seu jeito: "gastei 46 na padaria", "recebi 3500 de salário", "paguei 120 de luz ontem".</p>
                    <form onSubmit={e => { e.preventDefault(); clearTimeout(timerRapido.current); setOuvindo(false); interpretarRapido(textoRapido); }} style={{ display: 'flex', gap: '8px' }}>
                      <input id="texto-rapido" type="text" enterKeyHint="done" autoComplete="off" value={textoRapido} onChange={e => mudarTextoRapido(e.target.value)} placeholder="Ex: gastei 46 na padaria" style={{ ...estilos.input, flex: 1, minWidth: 0 }} aria-label="Lançamento rápido" />
                      <button type="button" onClick={ouvirVoz} title={ouvindo === 'gravando' ? 'Parar de ouvir' : 'Falar'} aria-label={ouvindo === 'gravando' ? 'Parar de ouvir' : 'Falar o lançamento'} aria-pressed={ouvindo === 'gravando'} style={{ flexShrink: 0, width: '46px', borderRadius: '12px', border: ouvindo ? 'none' : '1px solid var(--border-strong)', backgroundColor: ouvindo === 'gravando' ? '#e11d48' : ouvindo ? 'var(--accent)' : 'var(--bg)', color: ouvindo ? '#ffffff' : 'var(--text)', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', boxShadow: ouvindo === 'gravando' ? '0 0 0 4px rgba(225, 29, 72, 0.25)' : 'none' }}>
                        <Mic size={18} />
                      </button>
                      <button type="submit" style={{ ...estilos.buttonPrimary, flexShrink: 0, padding: '10px 14px' }}>Entender</button>
                    </form>
                    {ouvindo === 'gravando' && <p role="status" style={{ margin: '8px 0 0 0', fontSize: '12px', color: 'var(--danger-text)', fontWeight: '700', backgroundColor: 'rgba(225, 29, 72, 0.1)', borderRadius: '8px', padding: '8px 10px' }}>🔴 Ouvindo… fale, ex.: "gastei 30 no mercado". Quando você parar de falar, o app escreve e entende sozinho.</p>}
                    {ouvindo === 'teclado' && !previaRapida && <p style={{ margin: '8px 0 0 0', fontSize: '12px', color: 'var(--accent-text)', fontWeight: '600', backgroundColor: 'rgba(var(--accent-rgb), 0.1)', borderRadius: '8px', padding: '8px 10px' }}>🎤 Toque no microfone do teclado e fale, ex.: "gastei 30 no mercado". Quando parar de falar, o app entende sozinho.</p>}
                    {avisoVoz && !ouvindo && <p role="status" style={{ margin: '8px 0 0 0', fontSize: '12px', color: 'var(--c-amber)', fontWeight: '600', backgroundColor: 'rgba(245, 158, 11, 0.1)', borderRadius: '8px', padding: '8px 10px' }}>{avisoVoz}</p>}
                    {previaRapida && (
                      <div style={{ marginTop: '12px', backgroundColor: 'var(--bg)', border: '1px dashed var(--accent)', borderRadius: '12px', padding: '12px 14px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: '12px', flexWrap: 'wrap' }}>
                        <div style={{ minWidth: 0 }}>
                          <strong style={{ fontSize: '15px', color: renderCorTipo(previaRapida.type) }}>{previaRapida.type === 'receita' ? '+' : '-'} {formatarMoeda(previaRapida.amount)}</strong>
                          <span style={{ fontSize: '13px', color: 'var(--text)', marginLeft: '8px' }}>{previaRapida.description}</span>
                          <div style={{ display: 'flex', gap: '6px', flexWrap: 'wrap', marginTop: '6px' }}>
                            <span style={{ fontSize: '10px', padding: '2px 8px', borderRadius: '6px', backgroundColor: renderBgTipo(previaRapida.type), color: renderCorTipo(previaRapida.type), fontWeight: '700', textTransform: 'uppercase' }}>{previaRapida.type === 'receita' ? 'Receita' : previaRapida.type === 'despesa' ? 'Despesa' : 'Gasto'}</span>
                            <span style={{ fontSize: '10px', padding: '2px 8px', borderRadius: '6px', backgroundColor: corDaCategoria(previaRapida.category).bg, color: corDaCategoria(previaRapida.category).color, fontWeight: '600' }}>{previaRapida.category}</span>
                            <span style={{ fontSize: '11px', color: 'var(--text-faint)' }}>{formatarDataBR(previaRapida.date)}</span>
                          </div>
                        </div>
                        <div style={{ display: 'flex', gap: '8px' }}>
                          <button onClick={corrigirRapido} style={{ background: 'none', border: '1px solid var(--border-strong)', color: 'var(--text)', borderRadius: '10px', padding: '8px 12px', fontWeight: '600', fontSize: '12px', cursor: 'pointer' }}>Corrigir</button>
                          <button onClick={salvarLancamentoRapido} style={{ ...estilos.buttonPrimary, padding: '8px 14px', fontSize: '12px' }}>Salvar</button>
                        </div>
                      </div>
                    )}
                  </div>

                  {paraConfirmar.length > 0 && (
                    <div style={{ ...estilos.card, border: '1px solid rgba(245, 158, 11, 0.5)' }}>
                      <h3 style={{ fontSize: '16px', fontWeight: 'bold', color: 'var(--text-strong)', margin: '0 0 4px 0', display: 'flex', alignItems: 'center', gap: '8px' }}>
                        <CheckCircle2 size={16} color="var(--c-amber)" /> Para confirmar ({paraConfirmar.length})
                      </h3>
                      <p style={{ fontSize: '12px', color: 'var(--text-muted)', margin: '0 0 14px 0' }}>O dia já chegou. Toque em <strong>Recebi</strong> ou <strong>Paguei</strong> quando o dinheiro entrar ou sair de verdade; só então ele conta no saldo.</p>
                      <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                        {paraConfirmar.map(t => (
                          <div key={t.id} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: '10px', flexWrap: 'wrap', backgroundColor: 'var(--bg)', border: '1px dashed var(--c-amber)', borderRadius: '12px', padding: isMobile ? '10px 12px' : '12px 18px' }}>
                            <div style={{ minWidth: 0, flex: '1 1 160px' }}>
                              <p style={{ margin: '0 0 2px 0', fontWeight: '600', color: 'var(--text)', fontSize: '14px', overflowWrap: 'anywhere' }}>{t.description}</p>
                              <span style={{ fontSize: '11px', color: 'var(--text-faint)' }}>{t.date === hoje ? 'Hoje' : 'Desde ' + formatarDataBR(t.date)} · {t.category}</span>
                            </div>
                            <div style={{ display: 'flex', alignItems: 'center', gap: '6px', flexShrink: 0 }}>
                              <strong style={{ fontSize: '14px', color: renderCorTipo(t.type), whiteSpace: 'nowrap' }}>{t.type === 'receita' ? '+' : '-'} {formatarMoeda(t.amount)}</strong>
                              {botaoConfirmar(t)}
                              {botoesItem(t)}
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  {pessoasDevendo.length > 0 && (
                    <button onClick={() => setAbaAtiva('devedores')} style={{ ...estilos.card, display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: '12px', cursor: 'pointer', textAlign: 'left', width: '100%', font: 'inherit', color: 'inherit' }}>
                      <span style={{ display: 'flex', alignItems: 'center', gap: '10px', minWidth: 0 }}>
                        <HandCoins size={20} color="var(--c-amber)" />
                        <span style={{ fontSize: '14px', color: 'var(--text)' }}><strong>{pessoasDevendo.length === 1 ? pessoasDevendo[0].nome + ' te deve' : pessoasDevendo.length + ' pessoas te devem'}</strong> {formatarMoeda(totalDividas)}</span>
                      </span>
                      <span style={{ fontSize: '12px', color: 'var(--accent-text)', fontWeight: '700', whiteSpace: 'nowrap' }}>Ver →</span>
                    </button>
                  )}

                  {seletorMes}

                  {avisoCategorias}
                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(min(100%, 200px), 1fr))', gap: '20px' }}>
                    <div style={estilos.card}>
                      <p style={{ fontSize: '12px', color: 'var(--text-muted)', fontWeight: 'bold', textTransform: 'uppercase', margin: '0 0 8px 0' }}>Saldo do Mês</p>
                      <h3 style={{ fontSize: '28px', fontWeight: '800', color: saldoMes >= 0 ? 'var(--accent-text)' : 'var(--danger-text)', margin: 0 }}>{formatarMoeda(saldoMes)}</h3>
                      <p style={{ fontSize: '11px', color: 'var(--text-faint)', margin: '8px 0 0 0', display: 'flex', alignItems: 'center', gap: '4px' }}>
                        <Sparkles size={12} color="var(--accent)" /> Acumulado até aqui: {formatarMoeda(saldoAcumulado)}
                      </p>
                      {agendadosDoMes.length > 0 && (
                        <p style={{ fontSize: '11px', color: 'var(--text-faint)', margin: '4px 0 0 0' }}>
                          Previsto com agendados: <strong style={{ color: saldoPrevistoMes >= 0 ? 'var(--accent-text)' : 'var(--danger-text)' }}>{formatarMoeda(saldoPrevistoMes)}</strong>
                        </p>
                      )}
                    </div>

                    <div style={estilos.card}>
                      <p style={{ fontSize: '12px', color: 'var(--text-muted)', fontWeight: 'bold', textTransform: 'uppercase', margin: '0 0 8px 0' }}>Receitas</p>
                      <h3 style={{ fontSize: '24px', fontWeight: '700', color: 'var(--accent-text)', margin: 0 }}>{formatarMoeda(totalReceitas)}</h3>
                      <p style={{ fontSize: '11px', color: 'var(--text-faint)', margin: '8px 0 0 0' }}>
                        {receitasParaMetas > 0 ? <span>Na conta: {formatarMoeda(receitasConta)} · Para metas: {formatarMoeda(receitasParaMetas)}</span> : 'Salários, Vendas e Entradas'}
                      </p>
                    </div>

                    <div style={estilos.card}>
                      <p style={{ fontSize: '12px', color: 'var(--text-muted)', fontWeight: 'bold', textTransform: 'uppercase', margin: '0 0 8px 0' }}>Despesas (Fixas)</p>
                      <h3 style={{ fontSize: '24px', fontWeight: '700', color: 'var(--danger-text)', margin: 0 }}>{formatarMoeda(totalDespesas)}</h3>
                      <p style={{ fontSize: '11px', color: 'var(--text-faint)', margin: '8px 0 0 0' }}>Contas essenciais</p>
                    </div>

                    <div style={estilos.card}>
                      <p style={{ fontSize: '12px', color: 'var(--text-muted)', fontWeight: 'bold', textTransform: 'uppercase', margin: '0 0 8px 0' }}>Gastos (Variáveis)</p>
                      <h3 style={{ fontSize: '24px', fontWeight: '700', color: '#f59e0b', margin: 0 }}>{formatarMoeda(totalGastos)}</h3>
                      <p style={{ fontSize: '11px', color: 'var(--text-faint)', margin: '8px 0 0 0' }}>Extras / Aportes</p>
                    </div>
                  </div>

                  {percentualOrcamento >= 90 && (
                    <div style={{ backgroundColor: 'rgba(244, 63, 94, 0.15)', border: '1px solid rgba(244, 63, 94, 0.4)', borderRadius: '16px', padding: '16px 20px', display: 'flex', alignItems: 'center', gap: '16px', color: 'var(--danger-text)' }}>
                      <AlertTriangle size={24} />
                      <div>
                        <h4 style={{ margin: '0 0 2px 0', fontSize: '14px', fontWeight: 'bold' }}>Alerta de Planejamento</h4>
                        <p style={{ margin: 0, fontSize: '12px', opacity: 0.9 }}>Você está muito próximo ou ultrapassou o teto total de gastos planejado.</p>
                      </div>
                    </div>
                  )}

                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(min(100%, 320px), 1fr))', gap: '20px' }}>
                    <div style={estilos.card}>
                      <h3 style={{ fontSize: '16px', fontWeight: 'bold', color: 'var(--text-strong)', margin: '0 0 4px 0' }}>Para onde foi o dinheiro</h3>
                      <p style={{ fontSize: '12px', color: 'var(--text-muted)', margin: '0 0 16px 0' }}>
                        {variacaoGastos === null ? 'Gastos e despesas do mês por categoria' : (
                          <span>Você gastou <strong style={{ color: variacaoGastos > 0 ? 'var(--danger-text)' : 'var(--accent-text)' }}>{Math.abs(variacaoGastos).toFixed(0)}% {variacaoGastos > 0 ? 'a mais' : 'a menos'}</strong> que em {NOMES_MESES[Number(mesAnteriorSel.slice(5, 7)) - 1].toLowerCase()} ({formatarMoeda(saidasMesAnterior)})</span>
                        )}
                      </p>
                      {fatiasGastos.length === 0 ? (
                        <p style={{ color: 'var(--text-faint)', fontSize: '13px', margin: 0 }}>Nenhum gasto em {nomeDoMes(mesSelecionado)}.</p>
                      ) : (
                        <div style={{ display: 'flex', alignItems: 'center', gap: '20px', flexWrap: 'wrap' }}>
                          <div role="img" aria-label="Gráfico de gastos por categoria" style={{ position: 'relative', width: '130px', height: '130px', flexShrink: 0 }}>
                            <div style={{ width: '100%', height: '100%', borderRadius: '50%', background: gradienteGastos }} />
                            <div style={{ position: 'absolute', inset: '22px', borderRadius: '50%', backgroundColor: 'var(--card)', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center' }}>
                              <strong style={{ fontSize: '13px', color: 'var(--text-strong)' }}>{formatarMoeda(totalGastoGeral)}</strong>
                              <span style={{ fontSize: '10px', color: 'var(--text-muted)' }}>no mês</span>
                            </div>
                          </div>
                          <div style={{ flex: '1 1 160px', minWidth: 0, display: 'flex', flexDirection: 'column', gap: '6px' }}>
                            {fatiasGastos.slice(0, 6).map(f => (
                              <div key={f.cat} style={{ display: 'flex', alignItems: 'center', gap: '8px', fontSize: '12px' }}>
                                <span style={{ width: '10px', height: '10px', borderRadius: '3px', backgroundColor: f.cor, flexShrink: 0 }} />
                                <span style={{ color: 'var(--text)', flex: 1, minWidth: 0, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{f.cat}</span>
                                <span style={{ color: 'var(--text-muted)', fontVariantNumeric: 'tabular-nums' }}>{((f.valor / totalGastoGeral) * 100).toFixed(0)}%</span>
                                <strong style={{ color: 'var(--text-strong)', fontVariantNumeric: 'tabular-nums' }}>{formatarMoeda(f.valor)}</strong>
                              </div>
                            ))}
                          </div>
                        </div>
                      )}
                    </div>

                    <div style={estilos.card}>
                      <h3 style={{ fontSize: '16px', fontWeight: 'bold', color: 'var(--text-strong)', margin: '0 0 4px 0', display: 'flex', alignItems: 'center', gap: '8px' }}><AlertTriangle size={16} color="var(--c-amber)" /> Vence nos próximos 7 dias</h3>
                      <p style={{ fontSize: '12px', color: 'var(--text-muted)', margin: '0 0 14px 0' }}>Contas e gastos agendados para não esquecer.</p>
                      {proximosVencimentos.length === 0 ? (
                        <p style={{ color: 'var(--text-faint)', fontSize: '13px', margin: 0 }}>Nada vence nesta semana. Para lembrar de uma conta, lance com a data do vencimento.</p>
                      ) : (
                        <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                          {proximosVencimentos.slice(0, 6).map(t => (
                            <div key={t.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: '10px', fontSize: '13px', backgroundColor: 'var(--bg)', borderRadius: '10px', padding: '8px 12px' }}>
                              <span style={{ minWidth: 0, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', color: 'var(--text)' }}><strong>{formatarDataBR(t.date).slice(0, 5)}</strong> · {t.description}</span>
                              <strong style={{ color: 'var(--danger-text)', whiteSpace: 'nowrap' }}>{formatarMoeda(t.amount)}</strong>
                            </div>
                          ))}
                          <span style={{ fontSize: '12px', color: 'var(--text-muted)', textAlign: 'right' }}>Total: <strong>{formatarMoeda(somar(proximosVencimentos))}</strong></span>
                        </div>
                      )}
                    </div>
                  </div>

                  <div style={estilos.card}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: '12px', flexWrap: 'wrap', marginBottom: '16px' }}>
                      <div>
                        <h3 style={{ fontSize: '16px', fontWeight: 'bold', color: 'var(--text-strong)', margin: '0 0 4px 0' }}>Evolução dos últimos 6 meses</h3>
                        <p style={{ fontSize: '12px', color: 'var(--text-muted)', margin: 0 }}>Quanto entrou e quanto saiu da conta em cada mês</p>
                      </div>
                      <div style={{ display: 'flex', gap: '12px', fontSize: '12px', color: 'var(--text-muted)' }}>
                        <span style={{ display: 'flex', alignItems: 'center', gap: '5px' }}><span style={{ width: '10px', height: '10px', borderRadius: '3px', backgroundColor: 'var(--accent)' }} /> Entrou</span>
                        <span style={{ display: 'flex', alignItems: 'center', gap: '5px' }}><span style={{ width: '10px', height: '10px', borderRadius: '3px', backgroundColor: 'var(--danger-text)' }} /> Saiu</span>
                      </div>
                    </div>
                    {!temEvolucao ? (
                      <p style={{ color: 'var(--text-faint)', fontSize: '13px', margin: 0 }}>Os meses com lançamentos aparecem aqui.</p>
                    ) : (
                      <div role="img" aria-label={'Evolução: ' + evolucao.map(e => NOMES_MESES[Number(e.mes.slice(5, 7)) - 1] + ' entrou ' + formatarMoeda(e.entrou) + ' e saiu ' + formatarMoeda(e.saiu)).join('; ')} style={{ display: 'grid', gridTemplateColumns: 'repeat(6, minmax(0, 1fr))', gap: isMobile ? '6px' : '14px', alignItems: 'end' }}>
                        {evolucao.map(e => {
                          const saldo = e.entrou - e.saiu;
                          const selecionado = e.mes === mesSelecionado;
                          return (
                            <div key={e.mes} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '6px', minWidth: 0 }}>
                              <div style={{ height: '120px', width: '100%', display: 'flex', alignItems: 'flex-end', justifyContent: 'center', gap: '3px', borderBottom: '1px solid var(--border)' }}>
                                <div title={'Entrou ' + formatarMoeda(e.entrou)} style={{ width: '40%', maxWidth: '22px', height: (e.entrou / maxEvolucao * 100) + '%', minHeight: e.entrou > 0 ? '3px' : 0, backgroundColor: 'var(--accent)', borderRadius: '4px 4px 0 0' }} />
                                <div title={'Saiu ' + formatarMoeda(e.saiu)} style={{ width: '40%', maxWidth: '22px', height: (e.saiu / maxEvolucao * 100) + '%', minHeight: e.saiu > 0 ? '3px' : 0, backgroundColor: 'var(--danger-text)', borderRadius: '4px 4px 0 0' }} />
                              </div>
                              <span style={{ fontSize: '11px', fontWeight: selecionado ? '800' : '600', color: selecionado ? 'var(--accent-text)' : 'var(--text-muted)' }}>{NOMES_MESES[Number(e.mes.slice(5, 7)) - 1].slice(0, 3)}</span>
                              <span style={{ fontSize: isMobile ? '9px' : '10px', fontWeight: '700', color: saldo >= 0 ? 'var(--accent-text)' : 'var(--danger-text)', fontVariantNumeric: 'tabular-nums', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis', maxWidth: '100%' }}>
                                {(e.entrou || e.saiu) ? (saldo >= 0 ? '+' : '−') + Math.abs(saldo).toLocaleString('pt-BR', { maximumFractionDigits: 0 }) : '—'}
                              </span>
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>

                  <div style={estilos.card}>
                    <h3 style={{ fontSize: '16px', fontWeight: 'bold', color: 'var(--text-strong)', margin: '0 0 20px 0' }}>Últimos Lançamentos do Mês</h3>
                    {transacoesDoMes.length === 0 ? (
                      <p style={{ color: 'var(--text-faint)', textAlign: 'center', padding: '24px 0', fontSize: '14px' }}>Nenhum lançamento em {nomeDoMes(mesSelecionado)}.</p>
                    ) : (
                      <div style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
                        {transacoesDoMes.slice(0, 5).map(t => {
                          const cfg = corDaCategoria(t.category);
                          return (
                            <div key={t.id} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: '10px', backgroundColor: 'var(--bg)', border: '1px solid var(--border)', padding: isMobile ? '12px' : '14px 18px', borderRadius: '12px' }}>
                              <div style={{ display: 'flex', alignItems: 'center', gap: isMobile ? '10px' : '14px', minWidth: 0 }}>
                                {!isMobile && <div style={{ padding: '10px', borderRadius: '10px', backgroundColor: renderBgTipo(t.type), color: renderCorTipo(t.type) }}>
                                  {renderIconeTipo(t.type)}
                                </div>}
                                <div style={{ minWidth: 0 }}>
                                  <p style={{ margin: '0 0 4px 0', fontWeight: '600', color: 'var(--text)', fontSize: '14px', overflowWrap: 'anywhere' }}>{t.description}</p>
                                  <div style={{ display: 'flex', gap: '8px', alignItems: 'center', flexWrap: 'wrap' }}>
                                    <span style={{ fontSize: '10px', padding: '2px 8px', borderRadius: '6px', backgroundColor: cfg.bg, color: cfg.color, border: `1px solid ${cfg.border}`, fontWeight: '600' }}>{t.category}</span>
                                    <span style={{ fontSize: '10px', padding: '2px 8px', borderRadius: '6px', backgroundColor: renderBgTipo(t.type), color: renderCorTipo(t.type), fontWeight: '700', textTransform: 'uppercase' }}>
                                      {t.type === 'receita' ? 'Receita' : t.type === 'despesa' ? 'Despesa' : 'Gasto'}
                                    </span>
                                    <span style={{ fontSize: '11px', color: 'var(--text-faint)' }}>{formatarDataBR(t.date)}</span>
                                    {seloPendente(t)}
                                    {selosExtras(t)}
                                  </div>
                                </div>
                              </div>
                              <span style={{ fontWeight: 'bold', fontSize: '15px', color: renderCorTipo(t.type), whiteSpace: 'nowrap', flexShrink: 0 }}>
                                {t.type === 'receita' ? '+' : '-'} {formatarMoeda(t.amount)}
                              </span>
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>

                  {agendadosDoMes.length > 0 && (
                    <div style={estilos.card}>
                      <h3 style={{ fontSize: '16px', fontWeight: 'bold', color: 'var(--text-strong)', margin: '0 0 6px 0', display: 'flex', alignItems: 'center', gap: '8px' }}>
                        <CalendarIcon size={16} /> Agendados e a confirmar ({agendadosDoMes.length})
                      </h3>
                      <p style={{ fontSize: '12px', color: 'var(--text-muted)', margin: '0 0 14px 0' }}>Só entram no saldo e no planejamento quando você toca em <strong>Recebi</strong> ou <strong>Paguei</strong>.</p>
                      <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                        {agendadosDoMes.map(t => (
                          <div key={t.id} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: '10px', backgroundColor: 'var(--bg)', border: '1px dashed var(--border-strong)', borderRadius: '12px', padding: isMobile ? '10px 12px' : '12px 18px' }}>
                            <div style={{ minWidth: 0 }}>
                              <p style={{ margin: '0 0 2px 0', fontWeight: '600', color: 'var(--text)', fontSize: '14px', overflowWrap: 'anywhere' }}>{t.description}</p>
                              <span style={{ fontSize: '11px', color: 'var(--text-faint)' }}>{formatarDataBR(t.date)} · {t.category}</span>
                            </div>
                            <div style={{ display: 'flex', alignItems: 'center', gap: '6px', flexShrink: 0, flexWrap: 'wrap', justifyContent: 'flex-end' }}>
                              <span style={{ fontWeight: 'bold', fontSize: '14px', color: renderCorTipo(t.type), opacity: 0.8, whiteSpace: 'nowrap' }}>
                                {t.type === 'receita' ? '+' : '-'} {formatarMoeda(t.amount)}
                              </span>
                              {!t.metaMov && botaoConfirmar(t)}
                              {botoesItem(t)}
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </div>
              )}

              {abaAtiva === 'orcamento' && (
                <div style={{ display: 'flex', flexDirection: 'column', gap: '28px' }}>
                  {seletorMes}
                  {avisoCategorias}
                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(min(100%, 200px), 1fr))', gap: '20px' }}>
                    <div style={estilos.card}>
                      <p style={tituloSecao}>Orçamento do Mês</p>
                      <h3 style={{ fontSize: '26px', fontWeight: '800', color: 'var(--accent-text)', margin: 0 }}>{formatarMoeda(orcamentoDoMes)}</h3>
                      <p style={{ fontSize: '11px', color: 'var(--text-faint)', margin: '8px 0 0 0' }}>{orcamentoDoMes > 0 ? 'Aumenta a cada receita que entra na conta' : 'Lance suas receitas: cada uma aumenta o orçamento'}</p>
                    </div>

                    <div style={estilos.card}>
                      <p style={tituloSecao}>Teto Planejado</p>
                      <h3 style={{ fontSize: '26px', fontWeight: '800', color: 'var(--c-sky)', margin: 0 }}>{formatarMoeda(orcamentoTotalPlanejado)}</h3>
                      <p style={{ fontSize: '11px', color: 'var(--text-faint)', margin: '8px 0 0 0' }}>Resta do teto: <strong style={{ color: saldoRestanteGeral >= 0 ? 'var(--accent-text)' : 'var(--danger-text)' }}>{formatarMoeda(saldoRestanteGeral)}</strong></p>
                    </div>

                    <div style={estilos.card}>
                      <p style={tituloSecao}>Total Consumido</p>
                      <h3 style={{ fontSize: '26px', fontWeight: '800', color: totalGastoGeral > orcamentoTotalPlanejado ? 'var(--danger-text)' : '#f59e0b', margin: 0 }}>{formatarMoeda(totalGastoGeral)}</h3>
                      <p style={{ fontSize: '11px', color: 'var(--text-faint)', margin: '8px 0 0 0' }}>Despesas + Gastos</p>
                    </div>

                    <div style={estilos.card}>
                      <p style={tituloSecao}>Disponível</p>
                      <h3 style={{ fontSize: '26px', fontWeight: '800', color: disponivelOrcamento >= 0 ? 'var(--accent-text)' : 'var(--danger-text)', margin: 0 }}>{formatarMoeda(disponivelOrcamento)}</h3>
                      <p style={{ fontSize: '11px', color: 'var(--text-faint)', margin: '8px 0 0 0' }}>Orçamento − todas as saídas (inclui aportes em metas)</p>
                    </div>
                  </div>

                  {orcamentoDoMes > 0 && orcamentoTotalPlanejado > orcamentoDoMes && (
                    <div style={{ backgroundColor: 'rgba(245, 158, 11, 0.12)', border: '1px solid rgba(245, 158, 11, 0.4)', borderRadius: '14px', padding: '12px 16px', display: 'flex', alignItems: 'center', gap: '12px', fontSize: '13px', color: 'var(--c-amber)' }}>
                      <AlertTriangle size={18} /> O teto planejado ({formatarMoeda(orcamentoTotalPlanejado)}) está maior que o que entrou até agora ({formatarMoeda(orcamentoDoMes)}).
                    </div>
                  )}

                  <div style={estilos.card}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', gap: '12px', flexWrap: 'wrap', marginBottom: '24px' }}>
                      <div>
                        <h3 style={{ fontSize: '18px', fontWeight: 'bold', color: 'var(--text-strong)', margin: 0 }}>Planejamento de Ganhos por Categoria</h3>
                        <p style={{ fontSize: '12px', color: 'var(--text-muted)', margin: '4px 0 0 0' }}>Quanto você espera receber no mês e quanto já entrou</p>
                      </div>
                      <div style={{ display: 'flex', alignItems: 'center', gap: '14px', flexWrap: 'wrap' }}>
                        <span style={{ fontSize: '13px', color: 'var(--text-muted)' }}>
                          Recebido <strong style={{ color: 'var(--accent-text)' }}>{formatarMoeda(ganhosRecebidos)}</strong> de <strong style={{ color: 'var(--text-strong)' }}>{formatarMoeda(ganhosPrevistos)}</strong> previstos
                        </span>
                        {podeGerenciar && <button onClick={() => abrirCategoria('entrada', null)} style={botaoNovaCategoria}><Plus size={14} /> Nova categoria de ganho</button>}
                      </div>
                    </div>

                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(min(100%, 300px), 1fr))', gap: '20px' }}>
                      {categoriasDeGanhos.map(cat => {
                        const previsto = Number(limitesCategorias[chaveLimite('entrada', cat)] || 0);
                        const recebido = ganhosPorCategoria[cat] || 0;
                        const pct = previsto > 0 ? (recebido / previsto) * 100 : 0;
                        const cfg = corDaCategoria(cat);
                        const falta = previsto - recebido;
                        return (
                          <div key={cat} style={{ backgroundColor: 'var(--bg)', border: '1px solid var(--border)', borderRadius: '16px', padding: '20px', display: 'flex', flexDirection: 'column', gap: '14px' }}>
                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                              <span style={{ fontSize: '12px', padding: '4px 10px', borderRadius: '8px', backgroundColor: cfg.bg, color: cfg.color, border: `1px solid ${cfg.border}`, fontWeight: '700' }}>{cat}</span>
                              {podeGerenciar && <button
                                onClick={() => abrirCategoria('entrada', cat)}
                                style={{ background: 'none', border: 'none', color: 'var(--c-sky)', fontSize: '12px', fontWeight: '600', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: '4px' }}
                              >
                                {ehCategoriaCriada('entrada', cat) ? <React.Fragment><Pencil size={14} /> Editar</React.Fragment> : <React.Fragment><Sliders size={14} /> Ajustar</React.Fragment>}
                              </button>}
                            </div>
                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
                              <div>
                                <span style={{ fontSize: '20px', fontWeight: '800', color: 'var(--text-strong)' }}>{formatarMoeda(recebido)}</span>
                                <span style={{ fontSize: '12px', color: 'var(--text-faint)', marginLeft: '6px' }}>/ {formatarMoeda(previsto)}</span>
                              </div>

                        const concluida = progresso >= 100;
                        const movimentos = [...(meta.aportes || [])].sort((a, b) => String(b.data).localeCompare(String(a.data)) || b.id - a.id);

                                  <strong style={{ color: 'var(--accent-text)' }}>+ {formatarMoeda(meta.inicial)}</strong>

                const termo = semAcento(buscaAcesso.trim());

                const seteDias = new Date(Date.now() - 7 * 86400000).toISOString();
                const ativos = lista.filter(a => !a.bloqueado && String(a.ultimoAcesso || '') >= seteDias).length;
                const bloqueados = lista.filter(a => a.bloqueado).length;
                const dataHora = (iso) => (iso ? new Date(iso).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—');
