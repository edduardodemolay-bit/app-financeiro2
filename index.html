                  <div style={{ display: 'flex', flexDirection: 'column', gap: '20px' }}>
                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(min(100%, 180px), 1fr))', gap: '16px' }}>
                      <div style={estilos.card}><p style={tituloSecao}>Contas criadas</p><h3 style={{ fontSize: '26px', fontWeight: '800', margin: 0, color: 'var(--text-strong)' }}>{lista.length}</h3></div>
                      <div style={estilos.card}><p style={tituloSecao}>Ativas (7 dias)</p><h3 style={{ fontSize: '26px', fontWeight: '800', margin: 0, color: 'var(--accent-text)' }}>{ativos}</h3></div>
                      <div style={estilos.card}><p style={tituloSecao}>Bloqueadas</p><h3 style={{ fontSize: '26px', fontWeight: '800', margin: 0, color: bloqueados ? 'var(--danger-text)' : 'var(--text-strong)' }}>{bloqueados}</h3></div>
                    </div>
                    <div style={estilos.card}>
                      <div style={{ display: 'flex', gap: '10px', flexWrap: 'wrap', alignItems: 'center', justifyContent: 'space-between', marginBottom: '14px' }}>
                        <input id="busca-acesso" type="text" value={buscaAcesso} onChange={e => setBuscaAcesso(e.target.value)} placeholder="Buscar por nome ou e-mail" style={{ ...estilos.input, flex: '1 1 220px' }} aria-label="Buscar conta" />
                        <button onClick={carregarAcessos} disabled={carregandoAcessos} style={{ background: 'none', border: '1px solid var(--border-strong)', color: 'var(--text)', borderRadius: '10px', padding: '10px 14px', fontWeight: '600', fontSize: '13px', cursor: 'pointer' }}>{carregandoAcessos ? 'Atualizando…' : 'Atualizar lista'}</button>
                      </div>
                      <p style={{ margin: '0 0 14px 0', fontSize: '12px', color: 'var(--text-muted)' }}>Cada conta criada aparece aqui. Por privacidade, o administrador vê só o cadastro e os acessos: os lançamentos, metas e planejamento de cada pessoa ficam só com ela.</p>
                      {acessos === null ? (
                        <p style={{ color: 'var(--text-faint)', fontSize: '13px' }}>Carregando contas…</p>
                      ) : filtrados.length === 0 ? (
                        <p style={{ color: 'var(--text-faint)', fontSize: '13px' }}>Nenhuma conta encontrada.</p>
                      ) : (
                        <div style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
                          {filtrados.map(a => {
                            const souEu = usuarioNuvem && a.uid === usuarioNuvem.uid;
                            return (
                              <div key={a.uid} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: '12px', flexWrap: 'wrap', backgroundColor: 'var(--bg)', border: '1px solid ' + (a.bloqueado ? 'rgba(244, 63, 94, 0.45)' : 'var(--border)'), borderRadius: '12px', padding: '12px 14px' }}>
                                <div style={{ minWidth: 0, flex: '1 1 240px' }}>
                                  <div style={{ display: 'flex', alignItems: 'center', gap: '8px', flexWrap: 'wrap' }}>
                                    <strong style={{ fontSize: '14px', color: 'var(--text-strong)', overflowWrap: 'anywhere' }}>{a.nomeCompleto || '(sem nome)'}</strong>
                                    {a.bloqueado
                                      ? <span style={{ fontSize: '10px', padding: '2px 8px', borderRadius: '6px', backgroundColor: 'rgba(244, 63, 94, 0.15)', color: 'var(--danger-text)', fontWeight: '700', textTransform: 'uppercase' }}>Bloqueada</span>
                                      : <span style={{ fontSize: '10px', padding: '2px 8px', borderRadius: '6px', backgroundColor: 'rgba(var(--accent-rgb), 0.15)', color: 'var(--accent-text)', fontWeight: '700', textTransform: 'uppercase' }}>Liberada</span>}
                                    {souEu && <span style={{ fontSize: '11px', color: 'var(--text-faint)' }}>(você)</span>}
                                  </div>
                                  <div style={{ fontSize: '12px', color: 'var(--text-muted)', overflowWrap: 'anywhere' }}>{a.email}{a.idade ? ' · ' + a.idade + ' anos' : ''}</div>
                                  <div style={{ fontSize: '11px', color: 'var(--text-faint)', marginTop: '2px' }}>Criada em {dataHora(a.criadoEm)} · Último acesso {dataHora(a.ultimoAcesso)} · {a.totalAcessos || 0} {Number(a.totalAcessos) === 1 ? 'acesso' : 'acessos'}</div>
                                </div>
                                {!souEu && (
                                  <button onClick={() => alternarBloqueio(a, !a.bloqueado)} style={a.bloqueado
                                    ? { ...estilos.buttonPrimary, padding: '8px 14px', fontSize: '12px' }
                                    : { background: 'none', border: '1px solid rgba(244, 63, 94, 0.45)', color: 'var(--danger-text)', borderRadius: '10px', padding: '8px 14px', fontWeight: '700', fontSize: '12px', cursor: 'pointer' }}>
                                    {a.bloqueado ? 'Liberar acesso' : 'Bloquear acesso'}
                                  </button>
                                )}
                              </div>
                            );
                          })}
                        </div>
                      )}
                    </div>
                  </div>
                );
              })()}

              {abaAtiva === 'historico' && (
                <div style={{ display: 'flex', flexDirection: 'column', gap: '20px' }}>
                  <div style={estilos.card}>
                    <h3 style={{ fontSize: '16px', fontWeight: 'bold', color: 'var(--text-strong)', margin: '0 0 4px 0' }}>Quem registrou o quê</h3>
                    <p style={{ fontSize: '12px', color: 'var(--text-muted)', margin: 0 }}>
                      Cada lançamento, meta e categoria criada, editada ou excluída fica anotada aqui, com o nome de quem fez e a hora. Guardamos os últimos 500 registros.
                      {!usuarioNuvem && !nomeUsuario.trim() && <span> Coloque seu nome no menu, em "Quem está usando", para ele aparecer nos próximos registros.</span>}
                    </p>
                  </div>
                  {historico.length === 0 ? (
                    <p style={{ color: 'var(--text-faint)', textAlign: 'center', padding: '32px 0' }}>Nenhum registro ainda. Faça um lançamento e ele aparece aqui.</p>
                  ) : (
                    Object.entries(historico.reduce((acc, h) => {
                      // Dia no fuso do aparelho (o horário guardado é UTC; depois das 21h virava o dia seguinte)
                      const q = new Date(h.quando);
                      const dia = q.getFullYear() + '-' + String(q.getMonth() + 1).padStart(2, '0') + '-' + String(q.getDate()).padStart(2, '0');
                      (acc[dia] = acc[dia] || []).push(h);
                      return acc;
                    }, {})).map(([dia, itens]) => (
                      <div key={dia} style={estilos.card}>
                        <h4 style={{ margin: '0 0 12px 0', fontSize: '13px', color: 'var(--text-muted)', textTransform: 'uppercase', letterSpacing: '0.03em' }}>{dia === hoje ? 'Hoje' : formatarDataBR(dia)}</h4>
                        <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                          {itens.map(h => (
                            <div key={h.id} style={{ display: 'flex', gap: '12px', alignItems: 'flex-start', fontSize: '13px' }}>
                              <span style={{ color: 'var(--text-faint)', fontVariantNumeric: 'tabular-nums', flexShrink: 0, width: '42px' }}>{new Date(h.quando).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}</span>
                              <div style={{ minWidth: 0 }}>
                                <span style={{ color: 'var(--text-strong)', fontWeight: '700' }}>{h.quem}</span>
                                <span style={{ color: 'var(--text-muted)' }}> · {h.acao}</span>
                                <div style={{ color: 'var(--text)', overflowWrap: 'anywhere' }}>{h.detalhe}</div>
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    ))
                  )}
                </div>
              )}

              {abaAtiva === 'devedores' && (() => {
                const rotulo = { display: 'block', fontSize: '12px', fontWeight: '700', color: 'var(--text-muted)', margin: '0 0 6px 0' };
                const atrasada = (t) => t.date < hoje;
                return (
                  <div style={{ display: 'flex', flexDirection: 'column', gap: '24px' }}>
                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(min(100%, 200px), 1fr))', gap: '20px' }}>
                      <div style={estilos.card}>
                        <p style={tituloSecao}>Total a receber</p>
                        <h3 style={{ fontSize: '28px', fontWeight: '800', color: 'var(--c-amber)', margin: 0 }}>{formatarMoeda(totalDividas)}</h3>
                        <p style={{ fontSize: '11px', color: 'var(--text-faint)', margin: '8px 0 0 0' }}>{pessoasDevendo.length === 0 ? 'Ninguém te deve agora' : pessoasDevendo.length === 1 ? '1 pessoa' : pessoasDevendo.length + ' pessoas'} · só entra no saldo quando você confirmar que recebeu</p>
                      </div>
                    </div>

                    <form onSubmit={anotarDivida} style={estilos.card}>
                      <h3 style={{ fontSize: '16px', fontWeight: 'bold', color: 'var(--text-strong)', margin: '0 0 4px 0', display: 'flex', alignItems: 'center', gap: '8px' }}><HandCoins size={16} color="var(--c-amber)" /> Anotar quem está devendo</h3>
                      <p style={{ fontSize: '12px', color: 'var(--text-muted)', margin: '0 0 16px 0' }}>Venda fiado, dinheiro emprestado, conta dividida… Quando a pessoa pagar, toque em <strong>Recebi</strong>.</p>
                      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(min(100%, 200px), 1fr))', gap: '14px' }}>
                        <label><span style={rotulo}>Quem está devendo</span>
                          <input list="lista-devedores" value={formDivida.nome} onChange={e => mudarDivida('nome', e.target.value)} placeholder="Ex: João" autoComplete="off" style={estilos.input} />
                          <datalist id="lista-devedores">{nomesDevedores.map(n => <option key={n} value={n} />)}</datalist>
                        </label>
                        <label><span style={rotulo}>Valor</span>
                          <input inputMode="decimal" value={formDivida.valor} onChange={e => mudarDivida('valor', e.target.value)} placeholder="Ex: 150,00" style={estilos.input} />
                        </label>
                        <label><span style={rotulo}>O que foi (opcional)</span>
                          <input value={formDivida.descricao} onChange={e => mudarDivida('descricao', e.target.value)} placeholder="Ex: almoço, venda do bolo" maxLength={60} style={estilos.input} />
                        </label>
                        <label><span style={rotulo}>Combinou de pagar em (opcional)</span>
                          <input type="date" value={formDivida.data} onChange={e => mudarDivida('data', e.target.value)} style={estilos.input} />
                        </label>
                        <label><span style={rotulo}>WhatsApp da pessoa (opcional)</span>
                          <input type="tel" inputMode="tel" value={formDivida.telefone} onChange={e => mudarDivida('telefone', e.target.value)} placeholder="Ex: (11) 98888-7777" style={estilos.input} />
                        </label>
                        <label><span style={rotulo}>Categoria quando receber</span>
                          <select value={formDivida.categoria} onChange={e => mudarDivida('categoria', e.target.value)} style={estilos.input}>
                            {catEntrada.map(c => <option key={c} value={c}>{c}</option>)}
                          </select>
                        </label>
                      </div>
                      <label style={{ display: 'flex', alignItems: 'flex-start', gap: '8px', marginTop: '14px', fontSize: '13px', color: 'var(--text)', cursor: 'pointer' }}>
                        <input type="checkbox" checked={formDivida.emprestei} onChange={e => mudarDivida('emprestei', e.target.checked)} style={{ marginTop: '2px' }} />
                        <span>Saiu dinheiro do meu saldo <span style={{ color: 'var(--text-muted)' }}>(o valor sai hoje e volta para você quando a pessoa pagar; desmarque se foi venda fiado e nenhum dinheiro saiu)</span></span>
                      </label>
                      {erroDivida && <p role="alert" style={{ color: 'var(--danger-text)', fontSize: '13px', margin: '12px 0 0 0' }}>{erroDivida}</p>}
                      <button type="submit" style={{ ...estilos.buttonPrimary, marginTop: '16px' }}><Plus size={16} /> Anotar</button>
                    </form>

                    {pessoasDevendo.map(p => (
                      <div key={p.nome} style={estilos.card}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: '12px', flexWrap: 'wrap', marginBottom: '12px' }}>
                          <div style={{ minWidth: 0 }}>
                            <h3 style={{ fontSize: '17px', fontWeight: '800', color: 'var(--text-strong)', margin: 0, overflowWrap: 'anywhere' }}>👤 {p.nome}</h3>
                            <span style={{ fontSize: '12px', color: 'var(--text-muted)' }}>{p.itens.length === 1 ? '1 conta em aberto' : p.itens.length + ' contas em aberto'}{p.telefone ? ' · ' + formatarTelefone(p.telefone) : ''}</span>
                          </div>
                          <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                            <strong style={{ fontSize: '20px', color: 'var(--c-amber)', whiteSpace: 'nowrap' }}>{formatarMoeda(p.total)}</strong>
                            <a href={linkCobranca(p)} target="_blank" rel="noopener noreferrer" title="Mandar um lembrete pelo WhatsApp" style={{ display: 'inline-flex', alignItems: 'center', gap: '4px', backgroundColor: '#16a34a', color: '#ffffff', borderRadius: '8px', padding: '6px 10px', fontWeight: '700', fontSize: '12px', textDecoration: 'none', whiteSpace: 'nowrap' }}><MessageCircle size={14} /> Cobrar</a>
                          </div>
                        </div>
                        <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                          {p.itens.map(t => (
                            <div key={t.id} style={{ backgroundColor: 'var(--bg)', border: '1px solid ' + (atrasada(t) ? 'rgba(244, 63, 94, 0.45)' : 'var(--border)'), borderRadius: '12px', padding: isMobile ? '10px 12px' : '12px 16px' }}>
                              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: '10px', flexWrap: 'wrap' }}>
                                <div style={{ minWidth: 0, flex: '1 1 140px' }}>
                                  <p style={{ margin: '0 0 2px 0', fontWeight: '600', color: 'var(--text)', fontSize: '14px', overflowWrap: 'anywhere' }}>{t.description}</p>
                                  <span style={{ fontSize: '11px', color: atrasada(t) ? 'var(--danger-text)' : 'var(--text-faint)', fontWeight: atrasada(t) ? '700' : '400' }}>
                                    {atrasada(t) ? 'Atrasada desde ' + formatarDataBR(t.date) : t.date === hoje ? 'Para hoje' : 'Para ' + formatarDataBR(t.date)} · {t.category}
                                  </span>
                                </div>
                                <div style={{ display: 'flex', alignItems: 'center', gap: '6px', flexWrap: 'wrap', justifyContent: 'flex-end' }}>
                                  <strong style={{ fontSize: '15px', color: 'var(--text-strong)', whiteSpace: 'nowrap' }}>{formatarMoeda(t.amount)}</strong>
                                  {botaoConfirmar(t)}
                                  {podeMexer(t) && <button onClick={() => { setParteAberta(parteAberta === t.id ? null : t.id); setValorParte(''); }} style={{ background: 'none', border: '1px solid var(--border-strong)', color: 'var(--text)', borderRadius: '8px', padding: '5px 9px', fontWeight: '600', fontSize: '12px', cursor: 'pointer', whiteSpace: 'nowrap' }}>Recebi parte</button>}
                                  {botoesItem(t)}
                                </div>
                              </div>
                              {parteAberta === t.id && (
                                <form onSubmit={e => { e.preventDefault(); receberParte(t); }} style={{ display: 'flex', gap: '8px', marginTop: '10px', flexWrap: 'wrap' }}>
                                  <input autoFocus inputMode="decimal" value={valorParte} onChange={e => setValorParte(e.target.value)} placeholder="Quanto recebeu? Ex: 50" aria-label={'Quanto recebeu de ' + p.nome} style={{ ...estilos.input, flex: '1 1 160px', padding: '8px 12px' }} />
                                  <button type="submit" style={{ ...estilos.buttonPrimary, padding: '8px 14px', fontSize: '12px' }}>Confirmar</button>
                                </form>
                              )}
                            </div>
                          ))}
                        </div>
                      </div>
                    ))}

                    {dividasRecebidas.length > 0 && (
                      <div style={estilos.card}>
                        <h3 style={{ fontSize: '15px', fontWeight: 'bold', color: 'var(--text-strong)', margin: '0 0 12px 0', display: 'flex', alignItems: 'center', gap: '8px' }}><CheckCircle2 size={16} color="var(--accent)" /> Já recebidos</h3>
                        <div style={{ display: 'flex', flexDirection: 'column', gap: '6px' }}>
                          {dividasRecebidas.map(t => (
                            <div key={t.id} style={{ display: 'flex', justifyContent: 'space-between', gap: '10px', fontSize: '13px', padding: '6px 0', borderBottom: '1px solid var(--border)' }}>
                              <span style={{ minWidth: 0, overflowWrap: 'anywhere', color: 'var(--text)' }}><strong>{t.devedor}</strong> · {t.description} <span style={{ color: 'var(--text-faint)' }}>· {formatarDataBR(t.confirmadoEm || t.date)}</span></span>
                              <strong style={{ color: 'var(--accent-text)', whiteSpace: 'nowrap' }}>+ {formatarMoeda(t.amount)}</strong>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}
                  </div>
                );
              })()}

              {abaAtiva === 'calendario' && (
                <div style={{ display: 'flex', flexDirection: 'column', gap: '28px' }}>
                  
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: '14px', flexWrap: 'wrap', backgroundColor: 'var(--card)', padding: isMobile ? '14px' : '20px 24px', borderRadius: '16px', border: '1px solid var(--border)' }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '12px', flexWrap: 'wrap' }}>
                      <button onClick={() => setMesCalendario(somarMeses(mesCalendario, -1))} aria-label="Mês anterior" style={{ backgroundColor: 'var(--bg)', border: '1px solid var(--border)', color: 'var(--text-strong)', padding: '8px 12px', borderRadius: '10px', cursor: 'pointer', display: 'flex', alignItems: 'center' }}>
                        <ChevronLeft size={20} />
                      </button>
                      <h3 style={{ fontSize: isMobile ? '17px' : '20px', fontWeight: '800', margin: 0, color: 'var(--accent)' }}>{nomeDoMes(mesCalendario)}</h3>
                      <button onClick={() => setMesCalendario(somarMeses(mesCalendario, 1))} aria-label="Próximo mês" style={{ backgroundColor: 'var(--bg)', border: '1px solid var(--border)', color: 'var(--text-strong)', padding: '8px 12px', borderRadius: '10px', cursor: 'pointer', display: 'flex', alignItems: 'center' }}>
                        <ChevronRight size={20} />
                      </button>
                      {mesCalendario !== mesAtual && (
                        <button onClick={() => { setMesCalendario(mesAtual); setDiaSelecionado(hojeISO()); }} style={{ background: 'none', border: 'none', color: 'var(--accent-text)', fontWeight: '600', fontSize: '13px', cursor: 'pointer' }}>Voltar para hoje</button>
                      )}
                    </div>

                    <div style={{ display: 'flex', alignItems: 'center', gap: '16px' }}>
                      <div style={{ textAlign: 'right' }}>
                        <p style={{ margin: 0, fontSize: '12px', color: 'var(--text-muted)' }}>Dia Selecionado:</p>
                        <strong style={{ fontSize: '16px', color: 'var(--text-strong)' }}>{formatarDataBR(diaSelecionado)}</strong>
                      </div>
                      <button onClick={() => abrirModalComData(diaSelecionado, true)} style={{ ...estilos.buttonPrimary, padding: '10px 16px', fontSize: '13px' }}>
                        <Plus size={16} /> Lançar neste dia
                      </button>
                    </div>
                  </div>

                  <div style={estilos.card}>
                    <h4 style={{ margin: '0 0 16px 0', fontSize: '16px', fontWeight: 'bold', color: 'var(--text-strong)' }}>
                      Lançamentos do dia {formatarDataBR(diaSelecionado)}
                    </h4>
                    {transacoesDiaSelecionado.length === 0 ? (
                      <p style={{ margin: 0, color: 'var(--text-faint)', fontSize: '14px', fontStyle: 'italic' }}>Nenhuma movimentação nesta data. Clique em "Lançar neste dia" para adicionar.</p>
                    ) : (
                      <div style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
                        {transacoesDiaSelecionado.map(t => {
                          const cfg = corDaCategoria(t.category);
                          return (
                            <div key={t.id} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: '10px', backgroundColor: 'var(--bg)', padding: isMobile ? '10px 12px' : '12px 16px', borderRadius: '12px', border: '1px solid var(--border)' }}>
                              <div style={{ display: 'flex', alignItems: 'center', gap: '12px', minWidth: 0 }}>
                                {!isMobile && <div style={{ padding: '8px', borderRadius: '8px', backgroundColor: renderBgTipo(t.type), color: renderCorTipo(t.type) }}>
                                  {renderIconeTipo(t.type)}
                                </div>}
                                <div style={{ minWidth: 0 }}>
                                  <p style={{ margin: 0, fontWeight: 'bold', color: 'var(--text-strong)', fontSize: '14px', overflowWrap: 'anywhere' }}>{t.description}</p>
                                  <div style={{ display: 'flex', gap: '6px', alignItems: 'center', flexWrap: 'wrap' }}>
                                    <span style={{ fontSize: '10px', padding: '2px 6px', borderRadius: '4px', backgroundColor: cfg.bg, color: cfg.color, border: `1px solid ${cfg.border}`, fontWeight: '600' }}>{t.category}</span>
                                    {seloPendente(t)}
                                    {t.devedor && <span style={{ fontSize: '10px', color: 'var(--c-amber)', fontWeight: '700' }}>👤 {t.devedor}</span>}
                                    {t.aConfirmar === true && botaoConfirmar(t)}
                                  </div>
                                </div>
                              </div>
                              <div style={{ display: 'flex', alignItems: 'center', gap: '8px', flexShrink: 0 }}>
                                <span style={{ fontWeight: 'bold', color: renderCorTipo(t.type), fontSize: '15px', whiteSpace: 'nowrap' }}>
                                  {t.type === 'receita' ? '+' : '-'} {formatarMoeda(t.amount)}
                                </span>
                                {botoesItem(t)}
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>

                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(min(100%, 280px), 1fr))', gap: '20px' }}>
                    {/* Só o mês anterior, o atual e o próximo; as setas andam de mês em mês */}
                    {[-1, 0, 1].map(desloc => {
                      const mesChave = somarMeses(mesCalendario, desloc);
                      const anoCal = Number(mesChave.slice(0, 4));
                      const idxMes = Number(mesChave.slice(5, 7)) - 1;
                      const { primeiroDia, totalDias } = gerarDiasDoMes(anoCal, idxMes);
                      const diasEmBranco = Array.from({ length: primeiroDia });
                      const diasDoMes = Array.from({ length: totalDias }, (_, i) => i + 1);
                      const central = desloc === 0;

                      return (
                        <div key={mesChave} style={{ backgroundColor: 'var(--card)', border: central ? '2px solid var(--accent)' : '1px solid var(--border)', borderRadius: '16px', padding: '16px' }}>
                          <h4 style={{ margin: '0 0 12px 0', textAlign: 'center', color: central ? 'var(--accent-text)' : 'var(--c-sky)', fontSize: '15px', fontWeight: 'bold' }}>
                            {desloc === -1 ? 'Anterior · ' : desloc === 1 ? 'Próximo · ' : ''}{nomeDoMes(mesChave)}
                          </h4>

                          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', textAlign: 'center', fontSize: '11px', color: 'var(--text-faint)', fontWeight: 'bold', marginBottom: '8px' }}>
                            <span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span>
                          </div>

                          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: '4px' }}>
                            {diasEmBranco.map((_, i) => (
                              <div key={`blank-${i}`} />
                            ))}
                            {diasDoMes.map(dia => {
                              const diaFormatado = String(dia).padStart(2, '0');
                              const dataChave = `${mesChave}-${diaFormatado}`;
                              
                              const itensDoDia = transacoesPorDia[dataChave] || [];
                              const temEntrada = itensDoDia.some(t => t.type === 'receita');
                              const temSaida = itensDoDia.some(t => t.type === 'despesa' || t.type === 'gasto');
                              
                              const selecionado = diaSelecionado === dataChave;

                              return (
                                <button
                                  key={dia}
                                  onClick={() => setDiaSelecionado(dataChave)}
                                  style={{
                                    aspectRatio: '1',
                                    backgroundColor: selecionado ? 'var(--accent)' : 'var(--bg)',
                                    color: selecionado ? 'var(--on-accent)' : 'var(--text)',
                                    border: selecionado ? '2px solid var(--accent-text)' : '1px solid var(--border)',
                                    borderRadius: '8px',
                                    fontSize: '12px',
                                    fontWeight: selecionado || itensDoDia.length > 0 ? 'bold' : 'normal',
                                    cursor: 'pointer',
                                    display: 'flex',
                                    flexDirection: 'column',
                                    alignItems: 'center',
                                    justifyContent: 'center',
                                    position: 'relative',
                                    transition: '0.15s'
                                  }}
                                >
                                  <span>{dia}</span>
                                  {itensDoDia.length > 0 && (
                                    <div style={{ display: 'flex', gap: '2px', position: 'absolute', bottom: '3px' }}>
                                      {temEntrada && <div style={{ width: '4px', height: '4px', borderRadius: '50%', backgroundColor: selecionado ? 'var(--on-accent)' : 'var(--accent-text)' }}></div>}
                                      {temSaida && <div style={{ width: '4px', height: '4px', borderRadius: '50%', backgroundColor: selecionado ? '#f43f5e' : 'var(--danger-text)' }}></div>}
                                    </div>
                                  )}
                                </button>
                              );
                            })}
                          </div>
                        </div>
                      );
                    })}
                  </div>

                </div>
              )}

            </div>
          </main>

          {modalTransacaoAberto && (
            <div style={estilos.modalOverlay}>
              <div style={estilos.modalContent}>
                <h3 style={{ fontSize: '18px', fontWeight: 'bold', color: 'var(--text-strong)', margin: '0 0 20px 0' }}>{editandoId !== null ? 'Editar Lançamento' : 'Novo Lançamento'}</h3>
                {erroTransacao && <div style={{ backgroundColor: 'rgba(244,63,94,0.15)', color: 'var(--danger-text)', padding: '10px', borderRadius: '8px', fontSize: '12px', marginBottom: '16px' }}>{erroTransacao}</div>}
                <form onSubmit={adicionarTransacao} style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
                  <div>
                    <label style={{ fontSize: '12px', fontWeight: 'bold', color: 'var(--text-muted)' }}>Descrição</label>
                    <input type="text" value={descricao} onChange={e => setDescricao(e.target.value)} placeholder="Ex: Salário Empresa, Venda de Produto..." style={{ ...estilos.input, marginTop: '6px' }} required />
                  </div>
                  <div style={{ display: 'grid', gridTemplateColumns: isMobile ? '1fr' : '1fr 1fr', gap: '12px' }}>
                    <div>
                      <label style={{ fontSize: '12px', fontWeight: 'bold', color: 'var(--text-muted)' }}>Valor (R$)</label>
                      <input type="text" inputMode="decimal" value={valor} onChange={e => setValor(e.target.value)} placeholder="0,00" style={{ ...estilos.input, marginTop: '6px' }} required />
                    </div>
                    <div>
                      <label style={{ fontSize: '12px', fontWeight: 'bold', color: 'var(--text-muted)' }}>Tipo de Lançamento</label>
                      <select value={tipo} onChange={e => trocarTipo(e.target.value)} disabled={editandoId !== null && ['aporte', 'retirada'].includes((transacoes.find(t => t.id === editandoId) || {}).metaMov)} title="Aportes e retiradas de metas não mudam de tipo" style={{ ...estilos.input, marginTop: '6px' }}>
                        <option value="receita">Receita (Entrada)</option>
                        <option value="despesa">Despesa (Fixa/Essencial)</option>
                        <option value="gasto">Gasto (Variável/Extra)</option>
                      </select>
                    </div>
                  </div>
                  <p style={{ margin: '-6px 0 0 0', fontSize: '12px', color: 'var(--text-muted)', backgroundColor: 'var(--bg)', border: '1px solid var(--border)', borderRadius: '10px', padding: '8px 12px' }}>
                    💡 {EXPLICACAO_TIPO[tipo]}
                  </p>
                  {tipo === 'receita' && !(editandoId !== null && (transacoes.find(t => t.id === editandoId) || {}).metaMov === 'retirada') && (
                    <div>
                      <label style={{ fontSize: '12px', fontWeight: 'bold', color: 'var(--text-muted)' }}>Para onde vai este dinheiro?</label>
                      <select value={destinoReceita} onChange={e => setDestinoReceita(e.target.value)} style={{ ...estilos.input, marginTop: '6px' }}>
                        <option value="conta">💳 Conta (fica no saldo e aumenta o orçamento)</option>
                        {metas.map(m => <option key={m.id} value={String(m.id)}>🎯 Meta: {m.nome}</option>)}
                      </select>
                      {metas.length === 0 && <span style={{ fontSize: '11px', color: 'var(--text-faint)' }}>Crie uma meta na aba Metas para poder mandar receitas direto para ela.</span>}
                    </div>
                  )}
                  <div style={{ display: 'grid', gridTemplateColumns: isMobile ? '1fr' : '1fr 1fr', gap: '12px' }}>
                    <div>
                      <label style={{ fontSize: '12px', fontWeight: 'bold', color: 'var(--text-muted)' }}>Categoria</label>
                      <select value={categoria} onChange={e => setCategoria(e.target.value)} style={{ ...estilos.input, marginTop: '6px' }}>
                        {(categoriasDoTipo(tipo).includes(categoria) ? categoriasDoTipo(tipo) : [categoria, ...categoriasDoTipo(tipo)]).map(c => <option key={c} value={c}>{c}</option>)}
                      </select>
                    </div>
                    <div>
                      <label style={{ fontSize: '12px', fontWeight: 'bold', color: 'var(--text-muted)' }}>Data</label>
                      <input type="date" value={dataTransacao} onChange={e => setDataTransacao(e.target.value)} style={{ ...estilos.input, marginTop: '6px' }} required />
                    </div>
                  </div>
                  {editandoId === null && (
                    <div style={{ backgroundColor: 'var(--bg)', border: doCalendario ? '1px solid var(--accent)' : '1px solid var(--border)', borderRadius: '10px', padding: '10px 12px', display: 'flex', flexDirection: 'column', gap: '8px' }}>
                      <label htmlFor="repeticao" style={{ fontSize: '13px', fontWeight: '700', color: 'var(--text)' }}>{doCalendario ? 'Este lançamento se repete?' : 'Repetir'}</label>
                      <select id="repeticao" value={repetirMensal ? 'mensal' : repetirDias ? 'dias' : 'nao'} onChange={e => { setRepetirMensal(e.target.value === 'mensal'); setRepetirDias(e.target.value === 'dias'); }} style={estilos.input}>
                        <option value="nao">Não repete (só esta vez)</option>
                        <option value="dias">Sim, a cada alguns dias</option>
                        <option value="mensal">Sim, todo mês no mesmo dia (conta fixa)</option>
                      </select>
                      {repetirDias && (
                        <div style={{ display: 'flex', alignItems: 'center', gap: '8px', flexWrap: 'wrap', fontSize: '13px', color: 'var(--text)' }}>
                          <label htmlFor="a-cada-dias">A cada</label>
                          <input id="a-cada-dias" type="number" inputMode="numeric" min="1" max="365" value={aCadaDias} onChange={e => setACadaDias(e.target.value)} style={{ ...estilos.input, width: '70px' }} />
                          <span>dias,</span>
                          <input id="vezes-repetir" type="number" inputMode="numeric" min="2" max="60" value={vezesRepetir} onChange={e => setVezesRepetir(e.target.value)} style={{ ...estilos.input, width: '70px' }} aria-label="Quantas vezes no total" />
                          <label htmlFor="vezes-repetir">vezes no total</label>
                        </div>
                      )}
                      <span style={{ color: 'var(--text-muted)', fontSize: '12px' }}>
                        {repetirMensal ? 'Para contas fixas como aluguel, luz ou salário. O app lança sozinho no mesmo dia de cada mês.'
                          : repetirDias ? (resumoRepeticao || 'Ex.: a cada 7 dias para a feira, a cada 15 dias para a diarista.')
                          : 'Escolha "a cada alguns dias" para coisas como feira semanal, diarista ou remédio.'}
                      </span>
                    </div>
                  )}
                  {editandoId === null && tipo !== 'receita' && !repetirMensal && !repetirDias && (
                    <div style={{ display: 'flex', alignItems: 'center', gap: '10px', flexWrap: 'wrap' }}>
                      <label htmlFor="parcelas" style={{ fontSize: '13px', color: 'var(--text)', fontWeight: '600' }}>Parcelar em</label>
                      <input id="parcelas" type="number" inputMode="numeric" min="1" max="48" value={parcelas} onChange={e => setParcelas(e.target.value)} style={{ ...estilos.input, width: '80px' }} />
                      <span style={{ fontSize: '12px', color: 'var(--text-muted)' }}>
                        {Number(parcelas) > 1 && !isNaN(lerValor(valor)) ? Number(parcelas) + 'x de ' + formatarMoeda(lerValor(valor) / Number(parcelas)) + ' (uma por mês)' : 'vezes (1 = à vista)'}
                      </span>
                    </div>
                  )}
                  <div style={{ display: 'flex', justifyContent: 'flex-end', gap: '12px', marginTop: '8px' }}>
                    <button type="button" onClick={fecharModalTransacao} style={{ backgroundColor: 'var(--border)', color: 'var(--text)', border: 'none', padding: '10px 16px', borderRadius: '10px', fontWeight: 'bold', cursor: 'pointer' }}>Cancelar</button>
                    <button type="submit" style={estilos.buttonPrimary}>{editandoId !== null ? 'Salvar alterações' : 'Guardar'}</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {modalMetaAberto && (
            <div style={estilos.modalOverlay}>
              <div style={estilos.modalContent}>
                <h3 style={{ fontSize: '18px', fontWeight: 'bold', color: 'var(--text-strong)', margin: '0 0 20px 0' }}>{editandoMetaId !== null ? 'Editar Meta' : 'Nova Meta'}</h3>
                {erroMeta && <div style={{ backgroundColor: 'rgba(244,63,94,0.15)', color: 'var(--danger-text)', padding: '10px', borderRadius: '8px', fontSize: '12px', marginBottom: '16px' }}>{erroMeta}</div>}
                <form onSubmit={adicionarMeta} style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
                  <div>
                    <label style={{ fontSize: '12px', fontWeight: 'bold', color: 'var(--text-muted)' }}>Nome da Meta</label>
                    <input type="text" value={nomeMeta} onChange={e => setNomeMeta(e.target.value)} placeholder="Ex: Comprar Carro" style={{ ...estilos.input, marginTop: '6px' }} required />
                  </div>
                  <div style={{ display: 'grid', gridTemplateColumns: isMobile ? '1fr' : '1fr 1fr', gap: '12px' }}>
                    <div>
                      <label style={{ fontSize: '12px', fontWeight: 'bold', color: 'var(--text-muted)' }}>Valor Desejado (R$)</label>
                      <input type="text" inputMode="decimal" value={objetivoMeta} onChange={e => setObjetivoMeta(e.target.value)} placeholder="0,00" style={{ ...estilos.input, marginTop: '6px' }} required />
                    </div>
                    <div>
                      <label style={{ fontSize: '12px', fontWeight: 'bold', color: 'var(--text-muted)' }}>Valor Inicial Já Guardado</label>
                      <input type="text" inputMode="decimal" value={economizadoMeta} onChange={e => setEconomizadoMeta(e.target.value)} placeholder="0,00" style={{ ...estilos.input, marginTop: '6px' }} />
                    </div>
                  </div>
                  <div style={{ display: 'flex', justifyContent: 'flex-end', gap: '12px', marginTop: '8px' }}>
                    <button type="button" onClick={fecharModalMeta} style={{ backgroundColor: 'var(--border)', color: 'var(--text)', border: 'none', padding: '10px 16px', borderRadius: '10px', fontWeight: 'bold', cursor: 'pointer' }}>Cancelar</button>
                    <button type="submit" style={estilos.buttonPrimary}>{editandoMetaId !== null ? 'Salvar alterações' : 'Criar Meta'}</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {modalOrcamentoAberto && (
            <div style={estilos.modalOverlay}>
              <div style={estilos.modalContent}>
                <h3 style={{ fontSize: '18px', fontWeight: 'bold', color: 'var(--text-strong)', margin: '0 0 8px 0' }}>
                  {criandoCategoria
                    ? (grupoEditando === 'entrada' ? 'Nova Categoria de Ganho' : 'Nova Categoria de Gasto')
                    : (grupoEditando === 'entrada' ? 'Ganho Previsto' : 'Ajustar Limite') + ' - ' + categoriaEditando}
                </h3>
                <p style={{ fontSize: '13px', color: 'var(--text-muted)', margin: '0 0 20px 0' }}>{grupoEditando === 'entrada' ? 'Quanto você espera receber por mês nesta categoria.' : 'Defina o valor máximo de gastos mensal para esta categoria.'}</p>
                {erroCategoria && <div style={{ backgroundColor: 'rgba(244,63,94,0.15)', color: 'var(--danger-text)', padding: '10px', borderRadius: '8px', fontSize: '12px', marginBottom: '16px' }}>{erroCategoria}</div>}

                <form onSubmit={handleSalvarLimiteCategoria} style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
                  {(criandoCategoria || ehCategoriaCriada(grupoEditando, categoriaEditando)) && (
                    <div>
                      <label htmlFor="nome-categoria" style={{ fontSize: '12px', fontWeight: 'bold', color: 'var(--text-muted)' }}>Nome da Categoria</label>
                      <input
                        id="nome-categoria"
                        type="text"
                        value={nomeCategoriaEdit}
                        onChange={e => setNomeCategoriaEdit(e.target.value)}
                        placeholder={grupoEditando === 'entrada' ? 'Ex: Freelance, Aluguel recebido' : 'Ex: Pets, Assinaturas, Cartão'}
                        maxLength={30}
                        style={{ ...estilos.input, marginTop: '6px' }}
                        autoFocus={criandoCategoria}
                      />
                    </div>
                  )}
                  <div>
                    <label htmlFor="valor-categoria" style={{ fontSize: '12px', fontWeight: 'bold', color: 'var(--text-muted)' }}>{grupoEditando === 'entrada' ? 'Previsto por Mês (R$)' : 'Limite Mensal (R$)'}</label>
                    <input
                      id="valor-categoria"
                      type="text"
                      inputMode="decimal"
                      value={novoLimiteCategoria}
                      onChange={e => setNovoLimiteCategoria(e.target.value)}
                      placeholder="0,00"
                      style={{ ...estilos.input, marginTop: '6px', fontSize: '16px', fontWeight: 'bold', color: 'var(--accent-text)' }}
                      autoFocus={!criandoCategoria}
                    />
                  </div>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: '12px', flexWrap: 'wrap', marginTop: '8px' }}>
                    {!criandoCategoria && ehCategoriaCriada(grupoEditando, categoriaEditando) ? (
                      <button type="button" onClick={excluirCategoria} style={{ background: 'none', border: '1px solid rgba(244, 63, 94, 0.4)', color: 'var(--danger-text)', padding: '10px 14px', borderRadius: '10px', fontWeight: 'bold', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: '6px' }}>
                        <Trash2 size={14} /> Excluir categoria
                      </button>
                    ) : <span />}
                    <div style={{ display: 'flex', gap: '12px', marginLeft: 'auto' }}>
                      <button type="button" onClick={fecharCategoria} style={{ backgroundColor: 'var(--border)', color: 'var(--text)', border: 'none', padding: '10px 16px', borderRadius: '10px', fontWeight: 'bold', cursor: 'pointer' }}>Cancelar</button>
                      <button type="submit" style={estilos.buttonPrimary}>{criandoCategoria ? 'Criar Categoria' : grupoEditando === 'entrada' ? 'Salvar Previsão' : 'Salvar'}</button>
                    </div>
                  </div>
                  {!criandoCategoria && !ehCategoriaCriada(grupoEditando, categoriaEditando) && (
                    <p style={{ margin: 0, fontSize: '11px', color: 'var(--text-faint)' }}>Categoria padrão do app: dá para mudar o valor. Nome e exclusão só nas categorias que você criar.</p>
                  )}
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    // ===== TELA DE ENTRADA (login obrigatório quando o Firebase está ligado) =====
    function TelaLogin({ estado, aoGoogle, aoEntrar, aoCriar, aoEsqueci, traduzir, aoTentarDeNovo, avisoExterno }) {
      const [modo, setModo] = useState('entrar'); // 'entrar' | 'criar' | 'esqueci'
      const [nome, setNome] = useState('');
      const [idade, setIdade] = useState('');
      const [email, setEmail] = useState('');
      const [senha, setSenha] = useState('');
      const [verSenha, setVerSenha] = useState(false);
      const [erro, setErro] = useState('');
      const [aviso, setAviso] = useState('');
      const [ocupado, setOcupado] = useState(false);

      const rodar = async (acao) => {
        setErro(''); setAviso(''); setOcupado(true);
        try { await acao(); } catch (e) { setErro(traduzir(e)); } finally { setOcupado(false); }
      };
      const trocarModo = (m) => { setModo(m); setErro(''); setAviso(''); setAvisoExternoLido(true); };
      // O aviso que vem de fora (ex.: conta bloqueada) some quando a pessoa tenta de novo
      const [avisoExternoLido, setAvisoExternoLido] = useState(false);
      useEffect(() => { setAvisoExternoLido(false); }, [avisoExterno]);
      const avisoMostrar = avisoExternoLido ? '' : avisoExterno;

      const enviar = (e) => {
        e.preventDefault();
        setAvisoExternoLido(true);
        setErro(''); setAviso('');
        if (modo === 'esqueci') return rodar(async () => {
          if (!email.trim()) throw { code: 'auth/missing-email' };
          await aoEsqueci(email);
          setModo('entrar');
          setAviso('Pronto! Enviamos um link para ' + email.trim() + '. Abra o e-mail (veja também o spam) para criar uma senha nova.');
        });
        if (!email.trim()) return setErro('Digite o seu e-mail.');
        if (!senha) return setErro('Digite a sua senha.');
        if (modo === 'criar') {
          const nomeLimpo = nome.trim().replace(/\s+/g, ' ');
          const anos = Number(idade);
          if (nomeLimpo.split(' ').length < 2) return setErro('Digite o seu nome completo (nome e sobrenome).');
          if (!Number.isInteger(anos) || anos < 13 || anos > 120) return setErro('Digite a sua idade em anos (de 13 a 120).');
          return rodar(async () => {
            if (senha.length < 6) throw { code: 'auth/weak-password' };
            await aoCriar(nomeLimpo, email, senha, anos);
          });
        }
        return rodar(() => aoEntrar(email, senha));
      };

      const campo = { width: '100%', backgroundColor: 'var(--bg)', border: '1px solid var(--border-strong)', borderRadius: '12px', padding: '12px 14px', color: 'var(--text)', fontSize: '16px', outline: 'none', boxSizing: 'border-box', marginTop: '6px' };
      const rotulo = { fontSize: '12px', fontWeight: 'bold', color: 'var(--text-muted)' };
      const linkBotao = { background: 'none', border: 'none', color: 'var(--accent-text)', fontWeight: '700', fontSize: '13px', cursor: 'pointer', padding: '4px' };

      return (
        <div style={{ minHeight: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '24px 16px', backgroundColor: 'var(--bg)', boxSizing: 'border-box' }}>
          <div style={{ width: '100%', maxWidth: '400px', display: 'flex', flexDirection: 'column', gap: '18px' }}>
            <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '10px', textAlign: 'center' }}>
              <img src="./logo.png" alt="Logo EddFinança" width="72" height="72" style={{ borderRadius: '20px', boxShadow: '0 10px 24px rgba(59, 41, 152, 0.3)' }} />
              <h1 style={{ margin: 0, fontSize: '26px', fontWeight: '800', color: 'var(--text-strong)' }}>EddFinança</h1>
              <p style={{ margin: 0, fontSize: '14px', color: 'var(--text-muted)' }}>
                {modo === 'criar' ? 'Crie sua conta para guardar suas finanças com segurança.' : modo === 'esqueci' ? 'Vamos te mandar um link para criar uma senha nova.' : 'Entre para ver suas finanças em qualquer aparelho.'}
              </p>
            </div>

            {estado === 'carregando' ? (
              <p style={{ textAlign: 'center', color: 'var(--text-muted)', fontSize: '14px' }}>Abrindo…</p>
            ) : (
              <div style={{ backgroundColor: 'var(--surface)', border: '1px solid var(--border)', borderRadius: '20px', padding: '22px', display: 'flex', flexDirection: 'column', gap: '14px', boxShadow: '0 20px 40px -20px rgba(0,0,0,0.35)' }}>
                {estado === 'sem-internet' && (
                  <div role="alert" style={{ backgroundColor: 'rgba(245, 158, 11, 0.12)', border: '1px solid rgba(245, 158, 11, 0.4)', color: 'var(--c-amber)', borderRadius: '10px', padding: '10px 12px', fontSize: '13px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: '10px' }}>
                    <span>Sem internet. Conecte-se para entrar pela primeira vez neste aparelho.</span>
                    <button type="button" onClick={aoTentarDeNovo} style={{ ...linkBotao, color: 'var(--c-amber)' }}>Tentar de novo</button>
                  </div>
                )}
                {(erro || avisoMostrar) && <div role="alert" style={{ backgroundColor: 'rgba(244,63,94,0.12)', color: 'var(--danger-text)', padding: '10px 12px', borderRadius: '10px', fontSize: '13px' }}>{erro || avisoMostrar}</div>}
                {aviso && <div role="status" style={{ backgroundColor: 'rgba(var(--accent-rgb), 0.12)', color: 'var(--accent-text)', padding: '10px 12px', borderRadius: '10px', fontSize: '13px' }}>{aviso}</div>}

                {modo !== 'esqueci' && (
                  <React.Fragment>
                    <button type="button" disabled={ocupado} onClick={() => { setAvisoExternoLido(true); rodar(aoGoogle); }} style={{ width: '100%', padding: '13px 14px', borderRadius: '12px', border: '1px solid var(--border-strong)', backgroundColor: 'var(--surface)', color: 'var(--text-strong)', fontWeight: '700', fontSize: '15px', cursor: ocupado ? 'wait' : 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '10px' }}>
                      <span style={{ fontWeight: '900', fontSize: '18px', color: '#4285F4' }}>G</span> {modo === 'criar' ? 'Criar conta com Google' : 'Entrar com Google'}
                    </button>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '10px', color: 'var(--text-faint)', fontSize: '12px' }}>
                      <span style={{ flex: 1, height: '1px', backgroundColor: 'var(--border)' }} /> ou com e-mail <span style={{ flex: 1, height: '1px', backgroundColor: 'var(--border)' }} />
                    </div>
                  </React.Fragment>
                )}

                <form onSubmit={enviar} noValidate style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
                  {modo === 'criar' && (
                    <React.Fragment>
                      <div>
                        <label htmlFor="login-nome" style={rotulo}>Nome completo</label>
                        <input id="login-nome" type="text" autoComplete="name" value={nome} onChange={e => setNome(e.target.value)} placeholder="Ex.: Maria da Silva" maxLength={60} style={campo} />
                      </div>
                      <div>
                        <label htmlFor="login-idade" style={rotulo}>Idade</label>
                        <input id="login-idade" type="number" inputMode="numeric" min="13" max="120" value={idade} onChange={e => setIdade(e.target.value)} placeholder="Ex.: 32" style={campo} />
                      </div>
                    </React.Fragment>
                  )}
                  <div>
                    <label htmlFor="login-email" style={rotulo}>E-mail</label>
                    <input id="login-email" type="email" inputMode="email" autoComplete="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="voce@exemplo.com" style={campo} />
                  </div>
                  {modo !== 'esqueci' && (
                    <div>
                      <label htmlFor="login-senha" style={rotulo}>{modo === 'criar' ? 'Crie uma senha (mínimo 6 caracteres)' : 'Senha'}</label>
                      <div style={{ position: 'relative' }}>
                        <input id="login-senha" type={verSenha ? 'text' : 'password'} autoComplete={modo === 'criar' ? 'new-password' : 'current-password'} value={senha} onChange={e => setSenha(e.target.value)} style={{ ...campo, paddingRight: '64px' }} />
                        <button type="button" onClick={() => setVerSenha(!verSenha)} aria-label={verSenha ? 'Esconder senha' : 'Mostrar senha'} style={{ ...linkBotao, position: 'absolute', right: '8px', top: '50%', transform: 'translateY(-40%)', fontSize: '12px', color: 'var(--text-muted)' }}>{verSenha ? 'Esconder' : 'Mostrar'}</button>
                      </div>
                    </div>
                  )}
                  <button type="submit" disabled={ocupado} style={{ width: '100%', background: 'linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%)', color: 'var(--on-accent)', padding: '13px 16px', borderRadius: '12px', fontWeight: 'bold', fontSize: '15px', border: 'none', cursor: ocupado ? 'wait' : 'pointer', opacity: ocupado ? 0.7 : 1 }}>
                    {ocupado ? 'Aguarde…' : modo === 'criar' ? 'Criar conta' : modo === 'esqueci' ? 'Enviar link' : 'Entrar'}
                  </button>
                </form>

                <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '4px', fontSize: '13px', color: 'var(--text-muted)' }}>
                  {modo === 'entrar' && <button type="button" onClick={() => trocarModo('esqueci')} style={{ ...linkBotao, color: 'var(--text-muted)', fontWeight: '600' }}>Esqueci a senha</button>}
                  {modo === 'entrar'
                    ? <span>Ainda não tem conta? <button type="button" onClick={() => trocarModo('criar')} style={linkBotao}>Criar conta</button></span>
                    : <span>{modo === 'criar' ? 'Já tem conta?' : 'Lembrou a senha?'} <button type="button" onClick={() => trocarModo('entrar')} style={linkBotao}>Entrar</button></span>}
                </div>
              </div>
            )}

            <p style={{ margin: 0, textAlign: 'center', fontSize: '11px', color: 'var(--text-faint)' }}>
              Seus dados ficam guardados na sua conta e só você tem acesso a eles. {modo === 'criar' ? 'Ao criar a conta, você concorda com a ' : ''}<a href="./privacidade.html" style={{ color: 'var(--accent-text)', fontWeight: '600' }}>Política de Privacidade</a>.
            </p>
          </div>
        </div>
      );
    }

    // Se algo der errado, mostra um aviso com botão de recarregar em vez de tela em branco.
    // Os dados continuam salvos no aparelho.
    class ProtecaoErro extends React.Component {
      constructor(props) { super(props); this.state = { erro: null }; }
      static getDerivedStateFromError(erro) { return { erro }; }
      componentDidCatch(erro) { console.error('Erro no app:', erro); }
      render() {
        if (!this.state.erro) return this.props.children;
        return (
          <div style={{ minHeight: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '24px', textAlign: 'center' }}>
            <div>
              <h2 style={{ margin: '0 0 8px 0', color: 'var(--text-strong)' }}>Ops, algo deu errado.</h2>
              <p style={{ margin: '0 0 20px 0', color: 'var(--text-muted)' }}>Seus dados continuam salvos neste aparelho.</p>
              <button onClick={() => location.reload()} style={{ padding: '12px 20px', borderRadius: '12px', border: 'none', backgroundColor: 'var(--accent)', color: 'var(--on-accent)', fontWeight: 'bold', cursor: 'pointer' }}>Recarregar o app</button>
            </div>
          </div>
        );
      }
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<ProtecaoErro><App /></ProtecaoErro>);
  </script>
</body>
</html>
