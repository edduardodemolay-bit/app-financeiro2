  <style>

      --accent-rgb: 16, 185, 129;

      --card: #ffffff;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;

      --c-indigo: #4f46e5; --c-blue: #2563eb; --c-teal: #0d9488;
    }
    /* ===== TEMA ESCURO (opcional) ===== */
    :root[data-tema="escuro"] {

      --c-indigo: #818cf8; --c-blue: #60a5fa; --c-teal: #2dd4bf;
    }
    * {
      box-sizing: border-box;
    }
    html { -webkit-text-size-adjust: 100%; }
    @supports (height: 100dvh) {
      .app-root { height: 100dvh !important; }
    }
    button { -webkit-tap-highlight-color: transparent; }
    /* Barra de rolagem do menu lateral: fina, sempre visível quando há mais itens, nas cores do tema */
    .menu-lateral { scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; scrollbar-gutter: stable; }
    .menu-lateral::-webkit-scrollbar { width: 8px; }
    .menu-lateral::-webkit-scrollbar-track { background: transparent; }
    .menu-lateral::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 999px; border: 2px solid var(--surface); }
    .menu-lateral::-webkit-scrollbar-thumb:hover { background: var(--text-faint); }
    @media (max-width: 767px) {
      /* 16px evita o zoom automático do iPhone ao tocar nos campos */

    }
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;

      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

<body>

  <script>
    // Aplica o tema antes do app carregar (evita piscar claro à noite)
    (function () {
      try {
        var pref = localStorage.getItem('@finapp_modoTema') || 'auto';
        var h = new Date().getHours();
        var modo = pref === 'auto' ? ((h >= 18 || h < 6) ? 'escuro' : 'claro') : pref;
        document.documentElement.setAttribute('data-tema', modo);
      } catch (e) {}
    })();
    if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function () {});
      });
    }
  </script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Ícones do Lucide desenhados pelo próprio React (como <svg>).
    // Antes usávamos lucide.createIcons(), que troca elementos da tela por fora do React
    // e fazia o app ficar em branco ao mudar um ícone (ex.: botão Salvar).
    const createIcon = (iconName) => ({ size = 20, color = 'currentColor', className = '', style = {} }) => {
      const nomePascal = iconName.replace(/(^|-)([a-z0-9])/g, (_, __, c) => c.toUpperCase());
      const lib = window.lucide || {};
      const desenho = (lib.icons && lib.icons[nomePascal]) || lib[nomePascal];
      const partes = Array.isArray(desenho) && desenho[0] === 'svg' ? desenho[2] : desenho;
      return React.createElement('svg', {
        xmlns: 'http://www.w3.org/2000/svg',
        width: size,
        height: size,
        viewBox: '0 0 24 24',
        fill: 'none',
        stroke: color,
        strokeWidth: 2,
        strokeLinecap: 'round',
        strokeLinejoin: 'round',
        className: className,
        style: { display: 'inline-block', verticalAlign: 'middle', flexShrink: 0, ...style }
      }, Array.isArray(partes) ? partes.map(([tag, attrs], i) => React.createElement(tag, { key: i, ...attrs })) : null);
    };

    const Wallet = createIcon('wallet');
    const LayoutDashboard = createIcon('layout-dashboard');
    const Receipt = createIcon('receipt');
    const PieChart = createIcon('pie-chart');
    const Target = createIcon('target');
    const PlusCircle = createIcon('plus-circle');
    const Trash2 = createIcon('trash-2');
    const TrendingUp = createIcon('trending-up');
    const TrendingDown = createIcon('trending-down');
    const AlertTriangle = createIcon('alert-triangle');
    const CheckCircle2 = createIcon('check-circle-2');
    const Sparkles = createIcon('sparkles');
    const Save = createIcon('save');
    const Plus = createIcon('plus');
    const Minus = createIcon('minus');
    const Sliders = createIcon('sliders');
    const ShoppingBag = createIcon('shopping-bag');
    const CalendarIcon = createIcon('calendar');
    const ChevronLeft = createIcon('chevron-left');
    const ChevronRight = createIcon('chevron-right');
    const Pencil = createIcon('pencil');
    const Repeat = createIcon('repeat');
    const History = createIcon('history');
    const Mic = createIcon('mic');
    const Zap = createIcon('zap');
    const CloudIcon = createIcon('cloud');
    const LogOut = createIcon('log-out');
    const ShieldIcon = createIcon('shield-check');
    const HandCoins = createIcon('hand-coins');
    const Check = createIcon('check');
    const MessageCircle = createIcon('message-circle');

    // Nome completo e idade preenchidos em "Criar conta", usados ao registrar o acesso da conta nova
    let cadastroPendente = null;

    // ===== CONTA GOOGLE + CÓPIA NA NUVEM (Firebase / Google Cloud) =====
    // Número do WhatsApp do app, só dígitos com 55 e DDD (ex.: '5511999999999').
    // Enquanto for null, a parte do WhatsApp não aparece no menu.
    const WHATSAPP_NUMERO = null;

    // Projeto "EddFinanca" no Firebase. Estes valores não são segredo: eles identificam o projeto.
    // Quem protege os dados são as regras do Firestore (firestore.rules): cada conta só vê os próprios dados.
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyCPcpIwAHllAwPhB05Sss5PqTUI4v_f400",
      authDomain: "eddfinanca.firebaseapp.com",
      projectId: "eddfinanca",
      storageBucket: "eddfinanca.firebasestorage.app",
      messagingSenderId: "859974679118",
      appId: "1:859974679118:web:6d736679be96935ece611f"
    };
    const FIREBASE_VERSAO = '10.12.2';
    let firebasePromessa = null;
    function carregarFirebase() {
      if (firebasePromessa) return firebasePromessa;
      const script = (nome) => new Promise((ok, erro) => {
        const s = document.createElement('script');
        s.src = 'https://www.gstatic.com/firebasejs/' + FIREBASE_VERSAO + '/' + nome + '.js';
        s.onload = ok; s.onerror = () => erro(new Error('Não carregou ' + nome));
        document.head.appendChild(s);
      });
      firebasePromessa = script('firebase-app-compat')
        .then(() => Promise.all([script('firebase-auth-compat'), script('firebase-firestore-compat')]))
        .then(() => {
          if (!window.firebase.apps.length) {
            window.firebase.initializeApp(FIREBASE_CONFIG);
            // Guarda uma cópia no aparelho: a gestão compartilhada abre e aceita lançamentos sem internet
            try { window.firebase.firestore().enablePersistence({ synchronizeTabs: true }).catch(() => {}); } catch (e) {}
          }
          return window.firebase;
        })
        // Se a internet falhar, a próxima tentativa carrega de novo em vez de repetir o erro
        .catch((e) => { firebasePromessa = null; throw e; });
      return firebasePromessa;
    }

    // Leitura e gravação direta no aparelho (sem depender do estado da tela)
    const CHAVES_LOCAIS = { transacoes: '@finapp_transacoes', limitesCategorias: '@finapp_limitesCategorias', metas: '@finapp_metas', recorrentes: '@finapp_recorrentes', categoriasExtras: '@finapp_categorias', historico: '@finapp_historico' };
    function lerLocal() {
      const d = {};
      Object.entries(CHAVES_LOCAIS).forEach(([campo, chave]) => {
        try { const v = localStorage.getItem(chave); if (v) d[campo] = JSON.parse(v); } catch (e) {}
      });
      return d;
    }
    function gravarLocal(d) {
      Object.entries(CHAVES_LOCAIS).forEach(([campo, chave]) => {
        if (d[campo] !== undefined) localStorage.setItem(chave, JSON.stringify(d[campo]));
      });
    }

    // ===== SINCRONIZAÇÃO COM A NUVEM =====
    // Cada salvamento no aparelho ganha uma "versão" nova. A nuvem guarda a versão que recebeu e
    // o aparelho lembra a última versão que combinou com a nuvem (a "base"). Comparando as três,
    // o app sabe sozinho quem mudou, sem depender do relógio de cada aparelho.
    const CHAVE_VERSAO_LOCAL = '@finapp_versaoLocal';
    const CHAVE_BASE_NUVEM = '@finapp_nuvemBase';
    const CHAVE_UID_NUVEM = '@finapp_uidNuvem';
    const lerChave = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
    const gravarChave = (k, v) => { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} };
    const novaVersao = () => Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
    const temDados = (d) => !!d && ((d.transacoes || []).length > 0 || (d.metas || []).length > 0 || (d.recorrentes || []).length > 0);

    // 'enviar' | 'baixar' | 'conflito' | 'nada'
    function decidirSync(versaoLocal, base, versaoNuvem, temLocal, temNuvem) {
      if (!temNuvem && !versaoNuvem) return temLocal ? 'enviar' : 'nada'; // conta ainda vazia
      if (!base) return temLocal ? 'conflito' : 'baixar';                  // primeira vez neste aparelho
      const localMudou = versaoLocal !== base;
      const nuvemMudou = versaoNuvem !== base;
      if (!localMudou && !nuvemMudou) return 'nada';
      if (!nuvemMudou) return 'enviar';                                    // só o aparelho mudou (inclusive se apagou tudo)
      if (!localMudou) return 'baixar';                                    // só a nuvem mudou
      return 'conflito';                                                   // os dois mudaram
    }

    // ===== GESTÃO COMPARTILHADA =====
    // Uma "gestão compartilhada" (espacos/{id}) é usada por mais de uma conta. Cada lançamento, meta,
    // conta fixa e registro do histórico é um documento separado; assim o que cada pessoa faz é
    // juntado sozinho, sem um apagar o do outro. O dono convida pelo código; quem entra pelo código
    // é "convidado": lança e vê, mas não apaga (as regras da nuvem garantem).
    const COLECOES_ESPACO = ['transacoes', 'metas', 'recorrentes', 'historico'];
    const CHAVE_ESPACO_ATIVO = '@finapp_espacoAtivo';
    const chaveCacheEspaco = (id) => '@finapp_espaco_cache:' + id;
    function gerarCodigoConvite() {
      const letras = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; // sem letras parecidas (0/O, 1/I/L)
      const n = new Uint32Array(6);
      (window.crypto || window.msCrypto).getRandomValues(n);
      return 'EDD-' + Array.from(n, x => letras[x % letras.length]).join('');
    }
    const normalizarCodigo = (texto) => {
      const s = String(texto || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
      const corpo = s.startsWith('EDD') ? s.slice(3) : s;
      return corpo.length === 6 ? 'EDD-' + corpo : '';
    };
    // O valor guardado das metas é sempre refeito a partir dos lançamentos ligados a elas
    function reconstruirAportes(metas, transacoes) {
      return metas.map(m => ({
        ...m,
        aportes: transacoes
          .filter(t => t.metaId != null && String(t.metaId) === String(m.id) && t.metaMov)
          .map(t => ({ id: t.id, valor: t.metaMov === 'retirada' ? -Number(t.amount) : Number(t.amount), data: t.date, transacaoId: t.id, tipo: t.metaMov, descricao: t.description }))
      }));
    }
    // O que mudou entre o que está na nuvem (antes) e o estado novo (depois)
    function diferencasEspaco(antes, depois) {
      const gravar = [], apagar = [];
      COLECOES_ESPACO.forEach(col => {
        const limpar = (item) => (col === 'metas' ? { ...item, aportes: [] } : item);
        const mapaAntes = new Map((antes[col] || []).map(i => [String(i.id), JSON.stringify(limpar(i))]));
        const idsDepois = new Set();
        (depois[col] || []).forEach(i => {
          const id = String(i.id);
          idsDepois.add(id);
          const texto = JSON.stringify(limpar(i));
          if (mapaAntes.get(id) !== texto) gravar.push({ col, id, dados: JSON.parse(texto) });
        });
        mapaAntes.forEach((_, id) => { if (!idsDepois.has(id)) apagar.push({ col, id }); });
      });
      const cfgAntes = JSON.stringify({ limitesCategorias: antes.limitesCategorias || {}, categoriasExtras: antes.categoriasExtras || {} });
      const cfgDepois = JSON.stringify({ limitesCategorias: depois.limitesCategorias || {}, categoriasExtras: depois.categoriasExtras || {} });
      return { gravar, apagar, config: cfgAntes !== cfgDepois ? JSON.parse(cfgDepois) : null };
    }
    // Apaga da nuvem uma gestão compartilhada inteira (só o dono consegue: as regras garantem)
    async function apagarGestaoNaNuvem(db, esp) {
      const base = db.collection('espacos').doc(esp.id);
      for (const col of [...COLECOES_ESPACO, 'config']) {
        const docs = (await base.collection(col).get()).docs;
        for (let i = 0; i < docs.length; i += 400) { const lote = db.batch(); docs.slice(i, i + 400).forEach(d => lote.delete(d.ref)); await lote.commit(); }
      }
      if (esp.codigo) await db.collection('convites').doc(esp.codigo).delete().catch(() => {});
      await base.delete();
    }

    // Baixa um arquivo de backup (usado antes de descartar um dos lados num conflito)
    function baixarBackup(dados, nome) {
      try {
        const blob = new Blob([JSON.stringify({ versao: 4, exportadoEm: new Date().toISOString(), ...dados }, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = nome;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (e) {}
    }

    // ===== LANÇAMENTO RÁPIDO: entende frases como "gastei 46 na padaria" ou "recebi 3500 de salário" =====
    const semAcento = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    const PALAVRAS_CATEGORIA = [
      ['Salário', ['salario', 'holerite', 'pagamento do mes', 'decimo terceiro', '13o', 'ferias', 'adiantamento', 'plr', 'bonus', 'comissao']],
      ['Vendas', ['venda', 'vendi', 'vendas', 'vendeu', 'vendemos', 'cliente pagou', 'encomenda', 'pedido', 'pedidos']],
      ['Moradia', ['aluguel', 'luz', 'energia', 'agua', 'condominio', 'internet', 'gas', 'botijao', 'iptu', 'conta de casa', 'reforma', 'diarista', 'faxina', 'manutencao', 'conta de celular', 'telefone', 'enel', 'cemig', 'copel', 'sabesp', 'light']],
      ['Alimentação', ['mercado', 'supermercado', 'mercadinho', 'atacadao', 'assai', 'hortifruti', 'sacolao', 'padaria', 'pao', 'lanche', 'almoco', 'jantar', 'janta', 'cafe da manha', 'restaurante', 'ifood', 'rappi', 'delivery', 'comida', 'pizza', 'acougue', 'carne', 'feira', 'cafe', 'hamburguer', 'lanchonete', 'marmita', 'marmitex', 'sorvete', 'acai', 'salgado', 'pastel', 'coxinha', 'churrasco', 'doce', 'bolo', 'mcdonalds', 'mc donalds', 'burger king', 'refeicao']],
      ['Transporte', ['uber', '99', 'indrive', 'onibus', 'gasolina', 'etanol', 'diesel', 'combustivel', 'abasteci', 'metro', 'trem', 'brt', 'bilhete unico', 'taxi', 'estacionamento', 'pedagio', 'passagem', 'posto', 'mecanico', 'oficina', 'pneu', 'borracharia', 'lava jato', 'ipva', 'licenciamento', 'multa', 'revisao', 'carro', 'moto']],
      ['Saúde', ['farmacia', 'drogaria', 'remedio', 'remedios', 'medico', 'consulta', 'dentista', 'exame', 'exames', 'laboratorio', 'academia', 'plano de saude', 'hospital', 'psicologo', 'psicologa', 'terapia', 'fisioterapia', 'vacina', 'otica', 'oculos', 'suplemento', 'whey']],
      ['Educação', ['escola', 'curso', 'faculdade', 'livro', 'livros', 'mensalidade', 'matricula', 'material escolar', 'caderno', 'uniforme', 'apostila', 'aula', 'aulas', 'ingles', 'vestibular']],
      ['Lazer', ['cinema', 'show', 'ingresso', 'teatro', 'bar', 'balada', 'festa', 'viagem', 'hotel', 'pousada', 'praia', 'parque', 'netflix', 'spotify', 'prime video', 'globoplay', 'disney', 'hbo', 'youtube premium', 'jogo', 'game', 'playstation', 'xbox', 'steam', 'passeio', 'cerveja', 'streaming']]
    ];
    const PALAVRAS_RECEITA = ['recebi', 'recebemos', 'ganhei', 'entrou', 'caiu', 'vendi', 'venda', 'vendeu', 'salario', 'pix recebido', 'me pagou', 'me pagaram', 'pagaram', 'me mandou', 'me mandaram', 'me passou', 'me transferiu', 'me deu', 'me deram', 'depositaram', 'depositou', 'reembolso', 'rendimento', 'rendeu', 'renda', 'lucro', 'comissao', 'freela', 'bico', 'gorjeta', 'cashback', 'adiantamento'];
    const PALAVRAS_DESPESA = ['conta de', 'aluguel', 'luz', 'agua', 'internet', 'condominio', 'mensalidade', 'boleto', 'fatura', 'iptu', 'ipva', 'parcela', 'prestacao', 'financiamento', 'seguro', 'assinatura', 'plano de'];
    const contemPalavra = (texto, palavra) => new RegExp('(^|[^a-z0-9])' + palavra.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '($|[^a-z0-9])').test(texto);

    // Números falados por extenso viram algarismos: "trinta e cinco reais" -> "35 reais",
    // "dois mil e quinhentos" -> "2500", "trinta reais e cinquenta centavos" -> "30,50 reais".
    // (O ditado do celular às vezes escreve os números por extenso.)
    const NUMEROS_FALADOS = { zero: 0, um: 1, uma: 1, dois: 2, duas: 2, tres: 3, quatro: 4, cinco: 5, seis: 6, sete: 7, oito: 8, nove: 9, dez: 10, onze: 11, doze: 12, treze: 13, quatorze: 14, catorze: 14, quinze: 15, dezesseis: 16, dezessete: 17, dezoito: 18, dezenove: 19, vinte: 20, trinta: 30, quarenta: 40, cinquenta: 50, sessenta: 60, setenta: 70, oitenta: 80, noventa: 90, cem: 100, cento: 100, duzentos: 200, duzentas: 200, trezentos: 300, trezentas: 300, quatrocentos: 400, quatrocentas: 400, quinhentos: 500, quinhentas: 500, seiscentos: 600, seiscentas: 600, setecentos: 700, setecentas: 700, oitocentos: 800, oitocentas: 800, novecentos: 900, novecentas: 900 };
    // Junta os pedaços que o reconhecimento de voz devolve. No Android, cada pedaço costuma
    // repetir a frase inteira até ali ("gastei", "gastei 30", "gastei 30 no mercado"); somar tudo
    // gerava "gastei gastei 30 gastei 30 no mercado". Aqui o pedaço que repete o anterior o substitui.
    function juntarTranscricao(resultados) {
      let texto = '';
      for (const r of Array.from(resultados || [])) {
        const p = String((r && r[0] && r[0].transcript) || '').replace(/\s+/g, ' ').trim();
        if (!p) continue;
        const a = semAcento(texto), b = semAcento(p);
        if (!a || b.startsWith(a)) texto = p;     // o pedaço novo já contém o anterior
        else if (a.endsWith(b)) continue;          // pedaço repetido
        else texto = texto + ' ' + p;
      }
      return texto;
    }
    const PALAVRAS_DE_VALOR = ['reais', 'real', 'mil', 'conto', 'contos', 'pila', 'paus', 'centavo', 'centavos'];
    function numerosPorExtenso(texto) {
      const partes = String(texto || '').normalize('NFC').split(/(\s+)/);
      const chave = (p) => semAcento(p).replace(/[^a-z0-9]/g, '');
      const ehNumero = (k) => k in NUMEROS_FALADOS || k === 'mil';
      const saida = [];
      let i = 0;
      while (i < partes.length) {
        const k = chave(partes[i]);
        const anterior = saida.length >= 2 ? chave(saida[saida.length - 2]) : '';
        // "2 mil" fica como está (o "mil" depois de algarismo é lido mais adiante)
        if (!ehNumero(k) || (k === 'mil' && /^\d/.test(anterior))) { saida.push(partes[i]); i++; continue; }
        let total = 0, atual = 0, palavras = 0, ultimo = i;
        for (let j = i; j < partes.length; j++) {
          const kj = chave(partes[j]);
          if (kj === 'mil') { total += (atual || 1) * 1000; atual = 0; }
          else if (kj in NUMEROS_FALADOS) atual += NUMEROS_FALADOS[kj];
          else if ((kj === 'e' && j > i) || partes[j].trim() === '') continue;
          else break;
          palavras++; ultimo = j;
        }
        // "um"/"uma" sozinho é artigo ("comprei um lanche"), a não ser que venha "real", "mil"...
        const proxima = chave((partes.slice(ultimo + 1).find(p => p.trim() !== '')) || '');
        if (palavras === 1 && (k === 'um' || k === 'uma') && !PALAVRAS_DE_VALOR.includes(proxima)) { saida.push(partes[i]); i++; continue; }
        saida.push(String(total + atual));
        i = ultimo + 1;
      }
      return saida.join('')
        // centavos: "30 reais e 50 centavos", "30 e 50 centavos", "30 com 50 centavos"
        .replace(/(\d+)\s*(?:reais|real)?\s*(?:e|com)\s*(\d{1,2})\s*centavos?\b/gi, (m, a, b) => a + ',' + b.padStart(2, '0') + ' reais')
        // "30 reais e 50" (sem falar "centavos")
        .replace(/(\d+)\s*(?:reais|real)\s+e\s+(\d{1,2})\b(?!\s*(?:mil|reais|real|,|\d))/gi, (m, a, b) => a + ',' + b.padStart(2, '0') + ' reais')
        // só centavos: "50 centavos"
        .replace(/(^|[^\d,])(\d{1,2})\s*centavos?\b/gi, (m, antes, b) => antes + '0,' + b.padStart(2, '0') + ' reais');
    }

    function interpretarTexto(texto, catEntrada, catSaida, hoje) {
      // d = a frase com os números em algarismos; t = a mesma frase sem acento e minúscula.
      // As duas têm o mesmo tamanho, então o que for achado em t pode ser tirado de d na mesma posição.
      let d = numerosPorExtenso(String(texto || '').trim());
      let t = semAcento(d);
      if (!t.trim()) return null;
      if (t.length !== d.length) d = t; // segurança: se o tamanho mudou, a descrição sai sem acento
      const apagar = (ini, fim) => {
        const vazio = ' '.repeat(fim - ini);
        t = t.slice(0, ini) + vazio + t.slice(fim);
        d = d.slice(0, ini) + vazio + d.slice(fim);
      };

      // Valor: "R$ 46,50", "46 reais", "1.200", "2 mil", "2 mil e 500"
      let valor = NaN, achado = null;
      const mMil = /(\d+(?:[.,]\d+)?)\s*mil\b(?:\s+e\s+(\d{1,3})\b)?/.exec(t);
      const mDinheiro = /r\$\s*(\d[\d.]*(?:,\d{1,2})?)|(\d[\d.]*(?:,\d{1,2})?)\s*(?:reais|real|conto|contos|pila|paus)\b/.exec(t);
      if (mMil) { valor = Number(mMil[1].replace(',', '.')) * 1000 + Number(mMil[2] || 0); achado = mMil; }
      else if (mDinheiro) { valor = lerValor(mDinheiro[1] || mDinheiro[2]); achado = mDinheiro; }
      else {
        // Sem "reais": fica com o maior número da frase ("2 pizzas por 80" = 80),
        // fora o "dia 5" e o "99" do aplicativo de corrida
        const semDia = t.replace(/\bdia\s+\d{1,2}\b/g, (x) => ' '.repeat(x.length));
        let numeros = [...semDia.matchAll(/\d[\d.]*(?:,\d{1,2})?/g)];
        if (numeros.length > 1) numeros = numeros.filter(m => m[0] !== '99');
        numeros.forEach(m => { const v = lerValor(m[0].replace(/\.$/, '')); if (!(v <= valor)) { valor = v; achado = m; } });
      }
      if (!achado || isNaN(valor) || valor <= 0) return null;
      apagar(achado.index, achado.index + achado[0].length);

      // Tipo
      let type = 'gasto';
      if (PALAVRAS_RECEITA.some(p => contemPalavra(t, p))) type = 'receita';
      else if (PALAVRAS_DESPESA.some(p => contemPalavra(t, p))) type = 'despesa';

      // Data: "ontem", "anteontem", "semana passada", "na sexta", "dia 5", "dia 5 de setembro"
      const base = new Date(hoje + 'T12:00:00');
      const DIAS_SEMANA = ['domingo', 'segunda', 'terca', 'quarta', 'quinta', 'sexta', 'sabado'];
      const MESES = ['janeiro', 'fevereiro', 'marco', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
      const mDia = /\bdia\s+(\d{1,2})\b(?:\s+de\s+(janeiro|fevereiro|marco|abril|maio|junho|julho|agosto|setembro|outubro|novembro|dezembro)\b)?/.exec(t);
      const mSemana = /\b(?:na|no|nessa|nesta|nesse|neste|essa|esta|ultima|ultimo)\s+(domingo|segunda|terca|quarta|quinta|sexta|sabado)(?:[\s-]feira)?(\s+passad[oa])?\b/.exec(t);
      const mPassada = /\b(?:semana|domingo|segunda|terca|quarta|quinta|sexta|sabado)\s+passad[oa]\b/.exec(t);
      if (contemPalavra(t, 'anteontem')) base.setDate(base.getDate() - 2);
      else if (contemPalavra(t, 'ontem')) base.setDate(base.getDate() - 1);
      else if (mDia && Number(mDia[1]) >= 1 && Number(mDia[1]) <= 31) {
        if (mDia[2]) {
          base.setDate(1);
          base.setMonth(MESES.indexOf(mDia[2]));
          if (base > new Date(hoje + 'T12:00:00')) base.setFullYear(base.getFullYear() - 1); // "dia 20 de dezembro" falado em janeiro
        }
        base.setDate(Math.min(Number(mDia[1]), new Date(base.getFullYear(), base.getMonth() + 1, 0).getDate()));
        apagar(mDia.index, mDia.index + mDia[0].length);
      } else if (mSemana) {
        let volta = (base.getDay() - DIAS_SEMANA.indexOf(mSemana[1]) + 7) % 7;
        if (mSemana[2] && volta === 0) volta = 7;
        base.setDate(base.getDate() - volta);
        apagar(mSemana.index, mSemana.index + mSemana[0].length);
      } else if (mPassada) {
        const dia = DIAS_SEMANA.indexOf(mPassada[0].split(/\s/)[0]);
        base.setDate(base.getDate() - (dia < 0 ? 7 : ((base.getDay() - dia + 7) % 7 || 7)));
        apagar(mPassada.index, mPassada.index + mPassada[0].length);
      }
      const date = base.getFullYear() + '-' + String(base.getMonth() + 1).padStart(2, '0') + '-' + String(base.getDate()).padStart(2, '0');
      const resto = t;

      // Categoria: primeiro as criadas pela pessoa (pelo nome), depois as palavras conhecidas
      const lista = type === 'receita' ? catEntrada : catSaida;
      // (aceita o plural: "pizzas", "remédios", "pets" / "pet")
      const temPalavra = (p) => contemPalavra(resto, p) || contemPalavra(resto, p + 's') || (p.endsWith('s') && contemPalavra(resto, p.slice(0, -1)));
      let category = lista.find(c => c !== 'Outros' && temPalavra(semAcento(c)));
      if (!category) {
        const achada = PALAVRAS_CATEGORIA.find(([cat, palavras]) => lista.includes(cat) && palavras.some(temPalavra));
        category = achada ? achada[0] : 'Outros';
      }

      // Descrição: a frase sem o valor e sem as palavras de comando
      const tirar = ['eu', 'gastei', 'gastamos', 'torrei', 'paguei', 'pagamos', 'comprei', 'compramos', 'custou', 'saiu', 'foi', 'deu', 'recebi', 'recebemos', 'ganhei', 'vendi', 'entrou', 'caiu', 'hoje', 'agora', 'ontem', 'anteontem', 'reais', 'real', 'r\\$', 'conto', 'contos', 'pila', 'paus', 'por', 'com', 'no', 'na', 'nos', 'nas', 'em', 'de', 'do', 'da', 'dos', 'das', 'um', 'uma', 'pra', 'para', 'pro', 'o', 'a', 'os', 'as', 'ao'];
      let desc = d.replace(/[.,!?;:]+(\s|$)/g, ' ');
      for (let i = 0; i < 2; i++) tirar.forEach(p => { desc = desc.replace(new RegExp('(^|\\s)' + p + '(?=\\s|$)', 'gi'), ' '); });
      desc = desc.replace(/\s+/g, ' ').trim().replace(/^e\s+|\s+e$/i, '');
      if (!desc) desc = category === 'Outros' ? (type === 'receita' ? 'Receita' : 'Gasto') : category;
      desc = desc.charAt(0).toUpperCase() + desc.slice(1);

      return { description: desc.slice(0, 60), amount: Math.round(valor * 100) / 100, type, category, date };
    }

    const CATEGORIAS = ['Salário', 'Vendas', 'Alimentação', 'Transporte', 'Moradia', 'Lazer', 'Saúde', 'Educação', 'Outros'];
    // Categorias oferecidas no formulário conforme o tipo escolhido
    const CATEGORIAS_ENTRADA = ['Salário', 'Vendas', 'Outros'];
    const CATEGORIAS_SAIDA = ['Alimentação', 'Transporte', 'Moradia', 'Lazer', 'Saúde', 'Educação', 'Outros'];
    const CATEGORIA_PADRAO = { receita: 'Salário', despesa: 'Moradia', gasto: 'Alimentação' };
    // Categorias que a pessoa cria no Planejamento entram antes de "Outros"
    const montarCategorias = (padrao, extras) => [...padrao.filter(c => c !== 'Outros'), ...(extras || []), 'Outros'];
    // O valor planejado de ganhos fica numa chave própria, porque "Outros" existe nos dois grupos
    const chaveLimite = (grupo, cat) => (grupo === 'entrada' ? 'prev:' + cat : cat);
    // Categorias criadas: { entrada: [nomes], saida: [nomes], info: { 'saida:Pets': { criadaEm: 'AAAA-MM', confirmada, ate } } }
    //  confirmada = a pessoa disse que a categoria continua nos próximos meses
    //  ate        = a pessoa disse que era só até aquele mês (some do planejamento depois dele)
    const normalizarExtras = (c) => ({ entrada: (c && c.entrada) || [], saida: (c && c.saida) || [], info: (c && c.info) || {} });
    const chaveInfo = (grupo, cat) => grupo + ':' + cat;
    // A categoria aparece no mês? Some só nos meses depois do "ate".
    const categoriaValeNoMes = (extras, grupo, cat, mes) => {
      const i = extras.info[chaveInfo(grupo, cat)];
      return !(i && i.ate && mes > i.ate);
    };
    const CORES_EXTRAS = [
      { bg: 'rgba(236, 72, 153, 0.15)', color: '#db2777', border: 'rgba(236, 72, 153, 0.3)' },
      { bg: 'rgba(132, 204, 22, 0.15)', color: '#65a30d', border: 'rgba(132, 204, 22, 0.3)' },
      { bg: 'rgba(249, 115, 22, 0.15)', color: '#ea580c', border: 'rgba(249, 115, 22, 0.3)' },
      { bg: 'rgba(6, 182, 212, 0.15)', color: '#0891b2', border: 'rgba(6, 182, 212, 0.3)' },
      { bg: 'rgba(139, 92, 246, 0.15)', color: '#7c3aed', border: 'rgba(139, 92, 246, 0.3)' }
    ];
    const corDaCategoria = (cat) => {
      if (CATEGORIA_CORES[cat]) return CATEGORIA_CORES[cat];
      let h = 0;
      for (const ch of String(cat || '')) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
      return CORES_EXTRAS[h % CORES_EXTRAS.length];
    };
    const EXPLICACAO_TIPO = {
      receita: 'Dinheiro que entra: salário, vendas, pix recebido. Escolha abaixo se ele fica na conta ou vai direto para uma meta.',
      despesa: 'Contas fixas e essenciais, que vêm todo mês: aluguel, luz, água, internet, escola.',
      gasto: 'Gastos do dia a dia, que mudam de valor: mercado, lanche, Uber, lazer, compras.'
    };

    // Metas: o valor desejado fica fixo e o guardado é o valor inicial + cada movimentação.
    // Cada movimentação fica registrada e pode ser excluída depois.
    const guardadoDaMeta = (m) => Number(m.inicial || 0) + (m.aportes || []).reduce((a, x) => a + Number(x.valor), 0);
    const normalizarMeta = (m) => (Array.isArray(m.aportes) ? m : { ...m, inicial: Number(m.economizado || 0), aportes: [] });

    // Lançamentos ligados a uma meta (metaId + metaMov):
    //  'aporte'   = gasto que sai da conta e vai para a meta
    //  'retirada' = receita que sai da meta e volta para a conta
    //  'entrada'  = receita que entra direto na meta (não passa pela conta)
    // Mantém a lista de movimentações da meta igual aos lançamentos.
    function sincronizarMeta(listaMetas, t, apenasRemover) {
      let novas = listaMetas.map(m => ((m.aportes || []).some(a => a.transacaoId === t.id) ? { ...m, aportes: m.aportes.filter(a => a.transacaoId !== t.id) } : m));
      if (apenasRemover || !t.metaId || !t.metaMov) return novas;
      const valor = t.metaMov === 'retirada' ? -Number(t.amount) : Number(t.amount);
      return novas.map(m => (m.id === t.metaId ? { ...m, aportes: [...(m.aportes || []), { id: t.id, valor, data: t.date, transacaoId: t.id, tipo: t.metaMov, descricao: t.description }] } : m));
    }
    const entraNaConta = (t) => t.metaMov !== 'entrada';

    // Lançamento "a confirmar" (aConfirmar: true): criado com data futura, conta fixa do mês ou
    // dívida de alguém. Só entra no saldo quando a pessoa toca em "Recebi" / "Paguei"
    // (aí vira aConfirmar: false). Os ligados a metas ficam de fora, para não bagunçar o valor guardado.
    const marcarAConfirmar = (t, hoje) => (!t.metaMov && t.date > hoje ? { ...t, aConfirmar: true } : t);

    // Datas de um lançamento que se repete a cada N dias, X vezes no total
    function datasRepeticao(inicio, cadaDias, vezes) {
      const base = new Date(inicio + 'T12:00:00');
      return Array.from({ length: vezes }, (_, i) => {
        const d = new Date(base);
        d.setDate(base.getDate() + i * cadaDias);
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      });
    }

    // Aceita "12,50", "1.234,56", "2.000" (dois mil) ou "12.5"
    const lerValor = (texto) => {
      let s = String(texto == null ? '' : texto).trim().replace(/\s|R\$/g, '');
      if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
      else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
      return s === '' ? NaN : Number(s);
    };
    // '5511988887777' -> '(11) 98888-7777'
    const formatarTelefone = (tel) => {
      const d = String(tel || '').replace(/\D/g, '').replace(/^55/, '');
      if (d.length < 10) return d;
      return '(' + d.slice(0, 2) + ') ' + d.slice(2, d.length - 4) + '-' + d.slice(-4);
    };
    const valorParaCampo = (n) => (n === '' || n == null ? '' : String(n).replace('.', ','));

    const CATEGORIA_CORES = {
      'Salário': { bg: 'rgba(var(--accent-rgb), 0.15)', color: 'var(--accent-text)', border: 'rgba(var(--accent-rgb), 0.3)' },
      'Vendas': { bg: 'rgba(20, 184, 166, 0.15)', color: 'var(--c-teal)', border: 'rgba(20, 184, 166, 0.3)' },
      'Alimentação': { bg: 'rgba(245, 158, 11, 0.15)', color: 'var(--c-amber)', border: 'rgba(245, 158, 11, 0.3)' },
      'Transporte': { bg: 'rgba(14, 165, 233, 0.15)', color: 'var(--c-sky)', border: 'rgba(14, 165, 233, 0.3)' },
      'Moradia': { bg: 'rgba(99, 102, 241, 0.15)', color: 'var(--c-indigo)', border: 'rgba(99, 102, 241, 0.3)' },
      'Lazer': { bg: 'rgba(168, 85, 247, 0.15)', color: 'var(--c-purple)', border: 'rgba(168, 85, 247, 0.3)' },
      'Saúde': { bg: 'rgba(244, 63, 94, 0.15)', color: 'var(--danger-text)', border: 'rgba(244, 63, 94, 0.3)' },
      'Educação': { bg: 'rgba(59, 130, 246, 0.15)', color: 'var(--c-blue)', border: 'rgba(59, 130, 246, 0.3)' },
      'Outros': { bg: 'rgba(148, 163, 184, 0.15)', color: 'var(--text-muted)', border: 'rgba(148, 163, 184, 0.3)' },
      'Metas': { bg: 'rgba(168, 85, 247, 0.15)', color: 'var(--c-purple)', border: 'rgba(168, 85, 247, 0.3)' }
    };

    // Data de hoje no fuso do aparelho (toISOString usa UTC e, no Brasil, virava o dia seguinte após as 21h)
    const hojeISO = () => {
      const d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    };

    const NOMES_MESES = [
      'Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho',
      'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'
    ];

    // Meses no formato "AAAA-MM"
    const mesDe = (dataISO) => String(dataISO || '').slice(0, 7);
    const somarMeses = (mes, n) => {
      const [a, m] = mes.split('-').map(Number);
      const d = new Date(a, m - 1 + n, 1);
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    };
    const nomeDoMes = (mes) => {
      const [a, m] = mes.split('-').map(Number);
      return NOMES_MESES[m - 1] + ' de ' + a;
    };
    const ultimoDia = (mes) => {
      const [a, m] = mes.split('-').map(Number);
      return new Date(a, m, 0).getDate();
    };

    // Cria os lançamentos das contas fixas que ainda faltam, do mês de início até o mês atual.
    // Cada conta fixa guarda os meses já gerados, então apagar um lançamento gerado não o recria.
    function gerarLancamentosFixos(recorrentes, transacoes, mesAtual) {
      const novas = [];
      // O código de cada lançamento gerado é fixo (conta + mês). Assim, se dois aparelhos da mesma
      // gestão compartilhada gerarem o mesmo mês, é o mesmo lançamento e não aparece duplicado.
      const existentes = new Set(transacoes.map(t => String(t.id)));
      const atualizadas = recorrentes.map(r => {
        if (!r.ativo) return r;
        const gerados = new Set(r.gerados || []);
        let mes = r.inicio;
        let guarda = 0;
        while (mes <= mesAtual && guarda < 240) {
          if (!gerados.has(mes)) {
            const dia = String(Math.min(r.dia, ultimoDia(mes))).padStart(2, '0');
            const id = r.id + '_' + mes;
            if (!existentes.has(id)) {
              const nova = { id, description: r.description, amount: r.amount, category: r.category, type: r.type, date: mes + '-' + dia, recorrenteId: r.id };
              if (r.metaId && r.metaMov) { nova.metaId = r.metaId; nova.metaMov = r.metaMov; }
              // A do mês atual (salário, aluguel…) espera a pessoa tocar em "Recebi" / "Paguei".
              // Meses antigos gerados de uma vez já contam como feitos.
              else if (mes === mesAtual) nova.aConfirmar = true;
              novas.push(nova);
              existentes.add(id);
            }
            gerados.add(mes);
          }
          mes = somarMeses(mes, 1);
          guarda++;
        }
        return gerados.size === (r.gerados || []).length ? r : { ...r, gerados: [...gerados].sort() };
      });
      const mudouRecorrente = atualizadas.some((r, i) => r !== recorrentes[i]);
      if (!novas.length && !mudouRecorrente) return null;
      return {
        novas,
        recorrentes: atualizadas,
        transacoes: [...novas, ...transacoes].sort((a, b) => new Date(b.date) - new Date(a.date))
      };
    }

    // Confere cada lançamento: conserta campos faltando e separa os que não têm data ou valor válidos
    function limparTransacoes(lista) {
      const validas = [], descartadas = [];
      (Array.isArray(lista) ? lista : []).forEach(t => {
        if (!t || typeof t !== 'object' || !/^\d{4}-\d{2}-\d{2}$/.test(String(t.date)) || !isFinite(Number(t.amount)) || t.amount === '' || t.amount == null) { descartadas.push(t); return; }
        validas.push({ ...t, description: String(t.description == null ? '' : t.description), amount: Number(t.amount), category: String(t.category || 'Outros'), type: ['receita', 'despesa', 'gasto'].includes(t.type) ? t.type : 'gasto' });
      });
      return { validas, descartadas };
    }

    const LIMITES_PADRAO = {
      'Salário': 0,
      'Vendas': 0,
      'Alimentação': 800,
      'Transporte': 300,
      'Moradia': 1200,
      'Lazer': 400,
      'Saúde': 200,
      'Educação': 300,
      'Outros': 200
    };

    function App() {
      const [transacoes, setTransacoes] = useState([]);
      
      const [limitesCategorias, setLimitesCategorias] = useState(LIMITES_PADRAO);

      const [metas, setMetas] = useState([]);
      const [recorrentes, setRecorrentes] = useState([]);
      const [mesSelecionado, setMesSelecionado] = useState(mesDe(hojeISO()));

      const [valoresAporte, setValoresAporte] = useState({});

      const [abaAtiva, setAbaAtiva] = useState('dashboard');

      // ===== TEMA / COR DE DESTAQUE =====
      const TEMAS = {
        verde:   { hex: '#10b981', light: '#34d399', dark: '#059669', rgb: '16, 185, 129' },
        azul:    { hex: '#3b82f6', light: 'var(--c-blue)', dark: '#1d4ed8', rgb: '59, 130, 246' },
        roxo:    { hex: '#8b5cf6', light: '#a78bfa', dark: '#6d28d9', rgb: '139, 92, 246' },
        rosa:    { hex: '#ec4899', light: '#f472b6', dark: '#be185d', rgb: '236, 72, 153' },
        laranja: { hex: '#f97316', light: '#fb923c', dark: '#c2410c', rgb: '249, 115, 22' }
      };
      const [corTema, setCorTema] = useState(() => {
        try { return localStorage.getItem('@finapp_cor') || 'verde'; } catch (e) { return 'verde'; }
      });
      // Tema: 'auto' (escuro das 18h às 6h), 'claro' ou 'escuro' (escolha fixa da pessoa).
      // Chave nova para que todos comecem no automático, mesmo quem já tinha escolhido antes.
      const [preferenciaTema, setPreferenciaTema] = useState(() => {
        try { return localStorage.getItem('@finapp_modoTema') || 'auto'; } catch (e) { return 'auto'; }
      });
      const ehNoite = () => { const h = new Date().getHours(); return h >= 18 || h < 6; };
      const [noite, setNoite] = useState(ehNoite);
      // Confere a hora a cada minuto e ao voltar para o app, para trocar sozinho às 18h e às 6h

      useEffect(() => {

          // Lê cada item separado: se um estiver estragado, os outros abrem normalmente
          // e o conteúdo estragado é guardado à parte (nada é apagado sem cópia).
          const problemas = [];
          const lerItem = (chave, padrao, validar) => {
            let bruto = null;
            try { bruto = localStorage.getItem(chave); } catch (e) { return padrao; }

            try {
              const valor = JSON.parse(bruto);

            } catch (e) {

              problemas.push(chave);
              return padrao;
            }
          };
          const ehLista = (v) => Array.isArray(v);
          const ehObjeto = (v) => v && typeof v === 'object' && !Array.isArray(v);

          // Lançamentos com algum campo faltando são consertados; os sem valor ou data válidos ficam de fora (com cópia)
          const { validas: listaTransacoes, descartadas } = limparTransacoes(lerItem('@finapp_transacoes', [], ehLista));
          if (descartadas.length) {

          }
          setTransacoes(listaTransacoes);

          const limites = lerItem('@finapp_limitesCategorias', null, ehObjeto);

          const extras = lerItem('@finapp_categorias', null, ehObjeto);
          if (extras) setCategoriasExtras(normalizarExtras(extras));
          setHistorico(lerItem('@finapp_historico', [], ehLista).filter(h => h && typeof h.quando === 'string'));
          const listaMetas = lerItem('@finapp_metas', [], ehLista).filter(m => m && typeof m === 'object').map(normalizarMeta);
          setMetas(listaMetas);
          const listaRecorrentes = lerItem('@finapp_recorrentes', [], ehLista).filter(r => r && typeof r === 'object' && /^\d{4}-\d{2}$/.test(String(r.inicio)));
          setRecorrentes(listaRecorrentes);

          if (problemas.length) {
            setTimeout(() => exibirNotificacao('⚠️ Alguns dados salvos estavam estragados e foram guardados à parte. O resto abriu normalmente.'), 500);
          }

          try {

            // Lança as contas fixas dos meses que passaram desde a última abertura
            const gerado = gerarLancamentosFixos(listaRecorrentes, listaTransacoes, mesDe(hojeISO()));
            if (gerado) {
              const metasAtualizadas = gerado.novas.reduce((acc, t) => sincronizarMeta(acc, t), listaMetas);
              setTransacoes(gerado.transacoes);
              setRecorrentes(gerado.recorrentes);
              setMetas(metasAtualizadas);
              localStorage.setItem('@finapp_transacoes', JSON.stringify(gerado.transacoes));
              localStorage.setItem('@finapp_recorrentes', JSON.stringify(gerado.recorrentes));
              localStorage.setItem('@finapp_metas', JSON.stringify(metasAtualizadas));
            }
          } catch (e) {}

          // Se a última gestão aberta foi uma compartilhada, mostra a cópia dela enquanto o login carrega
          if (espacoAtivoRef.current) {

      const timerNotificacao = useRef(null);
      const exibirNotificacao = (texto) => {
        setMensagemNotificacao(texto);
        clearTimeout(timerNotificacao.current);
        timerNotificacao.current = setTimeout(() => {
          setMensagemNotificacao(null);
        }, 3000);
      };

      // ===== GESTÃO ATIVA: pessoal (null) ou compartilhada ({ id, nome, papel: 'dono' | 'convidado' }) =====
      const espacoAtivoRef = useRef((() => { try { return JSON.parse(localStorage.getItem(CHAVE_ESPACO_ATIVO) || 'null'); } catch (e) { return null; } })());
      const [espacoAtivo, setEspacoAtivoEstado] = useState(espacoAtivoRef.current);
      const [espacos, setEspacos] = useState([]);               // gestões compartilhadas desta conta

      const meuUid = usuarioNuvem ? usuarioNuvem.uid : null;
      const avisoSoDono = () => exibirNotificacao('Nesta gestão compartilhada, só o dono pode apagar ou mudar isso.');

      // Envia para a gestão compartilhada só o que mudou (cada item é um documento)
      const gravarNoEspaco = async (payload) => {
        const esp = espacoAtivoRef.current;
        const sessao = nuvemRef.current;
        const servidor = espacoServidorRef.current;
        if (!esp) return;
        if (!sessao || !servidor) {
          // Ainda sem conexão com a gestão: não arrisca gravar por cima do que a outra pessoa fez
          exibirNotificacao('A gestão compartilhada ainda está carregando. Esta alteração não foi salva; tente de novo em instantes.');
          if (servidor) aplicarDados(servidor);

        const dif = diferencasEspaco(servidor, payload);

          ...dif.gravar.map(g => ({ tipo: 'gravar', ...g })),
          ...(esp.papel === 'dono' ? dif.apagar.map(a => ({ tipo: 'apagar', ...a })) : []),
          ...(dif.config && esp.papel === 'dono' ? [{ tipo: 'config', dados: dif.config }] : [])
        ];
        if (!ops.length) return;
        setStatusNuvem('salvando');
        const db = sessao.fb.firestore();
        const base = db.collection('espacos').doc(esp.id);
        try {
          for (let i = 0; i < ops.length; i += 400) {
            const lote = db.batch();
            ops.slice(i, i + 400).forEach(o => {
              if (o.tipo === 'gravar') lote.set(base.collection(o.col).doc(o.id), o.dados);
              else if (o.tipo === 'apagar') lote.delete(base.collection(o.col).doc(o.id));
              else lote.set(base.collection('config').doc('geral'), o.dados);

          }
          setStatusNuvem('sincronizado');

          console.error('Gestão compartilhada:', e);
          setStatusNuvem('erro');
          exibirNotificacao(e && e.code === 'permission-denied' ? 'Você não tem permissão para essa alteração nesta gestão.' : 'Não foi possível enviar para a gestão compartilhada. O app tenta de novo quando a internet voltar.');
          if (espacoServidorRef.current) aplicarDados(espacoServidorRef.current);
        }
      };

      // Tudo é salvo no aparelho a cada ação; não existe mais botão de salvar.

        }
        enviarParaNuvem();

        const novosRecorrentes = Array.isArray(d.recorrentes) ? d.recorrentes : [];

      };

      // Compara aparelho e nuvem e faz o que for preciso: enviar, baixar ou (só se os dois mudaram) perguntar.

      const sincronizandoRef = useRef(false);
      const repetirSyncRef = useRef(false);
      const sincronizar = async () => {
        const sessao = nuvemRef.current;
        if (!sessao) return 'sem-conta';
        if (sincronizandoRef.current) { repetirSyncRef.current = true; return 'ocupado'; }
        sincronizandoRef.current = true;
        setStatusNuvem('salvando');

        try {
          for (let tentativa = 0; tentativa < 3; tentativa++) {

            const local = lerLocal();

                + 'Cancelar = ficar com os dados deste aparelho (' + ((local.transacoes || []).length) + ' lançamentos)\n\n'
                + 'O lado que não for escolhido é salvo num arquivo de backup antes, para nada se perder.');
              if (ficarNuvem) { baixarBackup(local, 'backup-deste-aparelho-' + hojeISO() + '.json'); acao = 'baixar'; }
              else { baixarBackup(dadosNuvem || {}, 'backup-da-conta-' + hojeISO() + '.json'); acao = 'enviar'; }
            }

            if (acao === 'baixar') {
              // Se a pessoa está vendo uma gestão compartilhada, só atualiza a pessoal no aparelho (sem trocar a tela)
              if (espacoAtivoRef.current) {
                const d = dadosNuvem || {};

              } else {
                gravarLocal(aplicarDados(dadosNuvem || {}));

              gravarChave(CHAVE_VERSAO_LOCAL, versaoNuvem);

              if (!espacoAtivoRef.current) exibirNotificacao('Dados atualizados com a sua conta');
              resultado = 'baixou';
              break;
            }
            if (acao === 'enviar') {
              if (!versaoLocal) { versaoLocal = novaVersao(); gravarChave(CHAVE_VERSAO_LOCAL, versaoLocal); }
              // Só grava se a nuvem ainda estiver na versão que acabamos de ler; se outro aparelho
              // enviou nesse meio-tempo, a gravação é recusada e o app compara de novo.
              const doc = sessao.doc;
              // O documento da nuvem aceita até 1 MB. Se estiver perto disso, a cópia leva só o histórico recente.
              let textoDados = JSON.stringify(local);
              if (textoDados.length > 900000) textoDados = JSON.stringify({ ...local, historico: (local.historico || []).slice(0, 50) });
              if (textoDados.length > 1000000) {
                setStatusNuvem('cheio');
                exibirNotificacao('⚠️ Seus dados ficaram grandes demais para a cópia na nuvem. Exporte um backup no menu.');
                resultado = 'cheio';
                break;
              }
              const mudouNoMeio = await sessao.fb.firestore().runTransaction(async (tx) => {
                const atual = await tx.get(doc);
                const versaoAgora = atual.exists ? (atual.data().versao || null) : null;
                if (versaoAgora !== versaoNuvem) return true;
                tx.set(doc, { nome: sessao.nome, email: sessao.email, atualizadoEm: new Date().toISOString(), versao: versaoLocal, dados: textoDados }, { merge: true });
                return false;
              });
              if (mudouNoMeio) continue;
              gravarChave(CHAVE_BASE_NUVEM, versaoLocal);
              resultado = 'enviou';
              break;
            }
            // nada a fazer: os dois lados já estão iguais
            if (versaoLocal === versaoNuvem) gravarChave(CHAVE_BASE_NUVEM, versaoNuvem);
            resultado = 'em-dia';
            break;
          }
          setStatusNuvem(resultado === 'erro' ? 'erro' : resultado === 'cheio' ? 'cheio' : 'sincronizado');
        } catch (e) {
          console.error('Erro ao sincronizar:', e);
          setStatusNuvem('erro');
        } finally {
          sincronizandoRef.current = false;
          if (repetirSyncRef.current) { repetirSyncRef.current = false; setTimeout(sincronizar, 300); }
        }
        return resultado;
      };

      // Apaga deste aparelho os dados da conta (ao sair ou ao trocar de conta)
      const limparAparelho = () => {
        fecharEscutasEspaco();
        fecharEscutasConta(); setWhatsappLigado(null); setCodigoWhatsapp(null);
        espacoAtivoRef.current = null; setEspacoAtivoEstado(null); espacoServidorRef.current = null; setEspacos([]);
        try { Object.keys(localStorage).filter(k => k.startsWith('@finapp_espaco_cache:')).forEach(k => localStorage.removeItem(k)); } catch (e) {}
        Object.values(CHAVES_LOCAIS).forEach(k => gravarChave(k, null));
        [CHAVE_VERSAO_LOCAL, CHAVE_BASE_NUVEM, CHAVE_UID_NUVEM, CHAVE_ESPACO_ATIVO].forEach(k => gravarChave(k, null));
        aplicarDados({});
      };

      // ===== GESTÃO COMPARTILHADA: abrir, criar, entrar com código, sair =====
      const fecharEscutasEspaco = () => {
        escutasEspacoRef.current.forEach(parar => { try { parar(); } catch (e) {} });
        escutasEspacoRef.current = [];
      };

      // Troca a gestão que aparece na tela. null = a pessoal.
      const abrirEspaco = (esp) => {
        fecharEscutasEspaco();
        espacoServidorRef.current = null;
        espacoAtivoRef.current = esp || null;
        setEspacoAtivoEstado(esp || null);
        gravarChave(CHAVE_ESPACO_ATIVO, esp ? JSON.stringify(esp) : null);
        if (!esp) { aplicarDados(lerLocal()); return; }

        // Mostra a cópia do aparelho enquanto a nuvem responde
        let copia = null;
        try { copia = JSON.parse(localStorage.getItem(chaveCacheEspaco(esp.id)) || 'null'); } catch (e) {}
        aplicarDados(copia || {});
        const sessao = nuvemRef.current;
        if (!sessao) return;
        const base = sessao.fb.firestore().collection('espacos').doc(esp.id);
        const estado = { transacoes: null, metas: null, recorrentes: null, historico: null, config: null };
        let contasFixasConferidas = false;
        const atualizar = () => {
          if ((espacoAtivoRef.current || {}).id !== esp.id) return;        // trocou de gestão no meio do caminho
          if (Object.values(estado).some(v => v === null)) return;        // espera tudo chegar da primeira vez
          const trans = limparTransacoes(estado.transacoes).validas.sort((a, b) => String(b.date).localeCompare(String(a.date)) || String(b.id).localeCompare(String(a.id)));
          const dados = {
            transacoes: trans,
            metas: reconstruirAportes(estado.metas.map(normalizarMeta), trans),
            recorrentes: estado.recorrentes,
            historico: [...estado.historico].sort((a, b) => String(b.quando).localeCompare(String(a.quando))),
            limitesCategorias: estado.config.limitesCategorias || {},
            categoriasExtras: estado.config.categoriasExtras || {}
          };
          espacoServidorRef.current = dados;
          aplicarDados(dados);
          try { localStorage.setItem(chaveCacheEspaco(esp.id), JSON.stringify(dados)); } catch (e) {}
          // Contas fixas dos meses que passaram (o código fixo evita duplicar se os dois aparelhos fizerem juntos)
          if (!contasFixasConferidas) {
            contasFixasConferidas = true;
            const gerado = gerarLancamentosFixos(dados.recorrentes, dados.transacoes, mesDe(hojeISO()));
            if (gerado) {
              const novo = { ...dados, transacoes: gerado.transacoes, recorrentes: gerado.recorrentes, metas: reconstruirAportes(dados.metas, gerado.transacoes) };
              aplicarDados(novo);
              gravarNoEspaco(novo);
            }
          }
        };
        const aoFalhar = (e) => {
          console.error('Gestão compartilhada:', e);
          if ((espacoAtivoRef.current || {}).id !== esp.id) return;
          if (e && e.code === 'permission-denied') {
            exibirNotificacao('Você não faz mais parte da gestão "' + esp.nome + '". Voltando para a sua gestão pessoal.');
            abrirEspaco(null);
            carregarEspacos();
          } else {
            setStatusNuvem('erro');
          }
        };
        COLECOES_ESPACO.forEach(col => {
          escutasEspacoRef.current.push(base.collection(col).onSnapshot(s => { estado[col] = s.docs.map(d => d.data()); atualizar(); }, aoFalhar));
        });
        escutasEspacoRef.current.push(base.collection('config').doc('geral').onSnapshot(s => { estado.config = s.exists ? s.data() : {}; atualizar(); }, aoFalhar));
      };
      useEffect(() => () => fecharEscutasEspaco(), []);

      // Busca as gestões compartilhadas desta conta
      const carregarEspacos = async () => {
        const sessao = nuvemRef.current;
        if (!sessao) return [];
        const db = sessao.fb.firestore();
        const uid = sessao.fb.auth().currentUser && sessao.fb.auth().currentUser.uid;
        if (!uid) return [];
        try {
          const perfil = await db.collection('perfis').doc(uid).get();
          const ids = (perfil.exists && perfil.data().espacos) || [];
          const lista = [];
          const sumiram = [];
          for (const id of ids) {
            try {
              const s = await db.collection('espacos').doc(id).get();
              const d = s.exists ? s.data() : null;
              if (d && d.membros && d.membros[uid]) lista.push({ id, nome: d.nome, papel: d.membros[uid], codigo: d.membros[uid] === 'dono' ? d.codigo : null, membros: d.membros, nomes: d.nomes || {}, dono: d.dono });
              else sumiram.push(id);
            } catch (e) { sumiram.push(id); }
          }
          if (sumiram.length) db.collection('perfis').doc(uid).set({ espacos: ids.filter(i => !sumiram.includes(i)) }, { merge: true }).catch(() => {});
          setEspacos(lista);
          // A gestão aberta saiu da lista (foi removido ou ela foi excluída): volta para a pessoal
          const ativo = espacoAtivoRef.current;
          if (ativo && !lista.some(e => e.id === ativo.id)) abrirEspaco(null);
          else if (ativo) {
            const atual = lista.find(e => e.id === ativo.id);
            if (atual && (atual.papel !== ativo.papel || atual.nome !== ativo.nome)) { const novo = { id: atual.id, nome: atual.nome, papel: atual.papel }; espacoAtivoRef.current = novo; setEspacoAtivoEstado(novo); gravarChave(CHAVE_ESPACO_ATIVO, JSON.stringify(novo)); }
          }
          return lista;
        } catch (e) {
          console.error('Gestões:', e);
          return [];
        }
      };

      const [formEspaco, setFormEspaco] = useState(null); // null | 'criar' | 'entrar'
      const [textoEspaco, setTextoEspaco] = useState('');
      const [ocupadoEspaco, setOcupadoEspaco] = useState(false);

      const criarEspaco = async () => {
        const nome = textoEspaco.trim().replace(/\s+/g, ' ');
        if (!nome) { exibirNotificacao('Dê um nome para a gestão, por exemplo "Casa".'); return; }
        const sessao = nuvemRef.current;
        if (!sessao) { exibirNotificacao('Sem conexão com a conta. Tente de novo.'); return; }
        setOcupadoEspaco(true);
        try {
          const db = sessao.fb.firestore();
          const uid = sessao.fb.auth().currentUser.uid;
          const ref = db.collection('espacos').doc();
          const codigo = gerarCodigoConvite();
          const agora = new Date().toISOString();
          await ref.set({ nome: nome.slice(0, 40), dono: uid, membros: { [uid]: 'dono' }, nomes: { [uid]: nomeAutor }, codigo, criadoEm: agora });
          await db.collection('convites').doc(codigo).set({ espaco: ref.id, nomeEspaco: nome.slice(0, 40), nomeDono: nomeAutor, criadoPor: uid, ativo: true, criadoEm: agora });
          await db.collection('perfis').doc(uid).set({ espacos: sessao.fb.firestore.FieldValue.arrayUnion(ref.id) }, { merge: true });
          setFormEspaco(null); setTextoEspaco('');
          await carregarEspacos();
          abrirEspaco({ id: ref.id, nome: nome.slice(0, 40), papel: 'dono' });
          exibirNotificacao('Gestão "' + nome + '" criada. Código de convite: ' + codigo);
        } catch (e) {
          console.error(e);
          exibirNotificacao('Não foi possível criar a gestão. Confira a internet e tente de novo.');
        }
        setOcupadoEspaco(false);
      };

      const entrarComCodigo = async () => {
        const codigo = normalizarCodigo(textoEspaco);
        if (!codigo) { exibirNotificacao('Digite o código completo, por exemplo EDD-7KQ4MZ.'); return; }
        const sessao = nuvemRef.current;
        if (!sessao) { exibirNotificacao('Sem conexão com a conta. Tente de novo.'); return; }
        setOcupadoEspaco(true);
        try {
          const db = sessao.fb.firestore();
          const uid = sessao.fb.auth().currentUser.uid;
          const conv = await db.collection('convites').doc(codigo).get();
          if (!conv.exists || !conv.data().ativo) { exibirNotificacao('Código não encontrado ou desativado. Peça um código novo ao dono da gestão.'); setOcupadoEspaco(false); return; }
          const c = conv.data();
          if (espacos.some(e => e.id === c.espaco)) { exibirNotificacao('Você já participa da gestão "' + c.nomeEspaco + '".'); setOcupadoEspaco(false); return; }
          if (!window.confirm('Entrar na gestão "' + c.nomeEspaco + '" de ' + c.nomeDono + '?\n\nVocê vai poder ver tudo e fazer lançamentos. Só o dono pode apagar. A sua gestão pessoal continua separada.')) { setOcupadoEspaco(false); return; }
          await db.collection('espacos').doc(c.espaco).update({ ['membros.' + uid]: 'convidado', ['nomes.' + uid]: nomeAutor, codigoUsado: codigo });
          await db.collection('perfis').doc(uid).set({ espacos: sessao.fb.firestore.FieldValue.arrayUnion(c.espaco) }, { merge: true });
          setFormEspaco(null); setTextoEspaco('');
          await carregarEspacos();
          abrirEspaco({ id: c.espaco, nome: c.nomeEspaco, papel: 'convidado' });
          exibirNotificacao('Você entrou na gestão "' + c.nomeEspaco + '"');
        } catch (e) {
          console.error(e);
          exibirNotificacao('Não foi possível entrar com esse código. Confira o código e a internet.');
        }
        setOcupadoEspaco(false);
      };

      // Convidado sai; ou o dono tira alguém
      const tirarDaGestao = async (esp, uidAlvo, nomeAlvo) => {
        const sessao = nuvemRef.current;
        if (!sessao) return;
        const uid = sessao.fb.auth().currentUser.uid;
        const souEu = uidAlvo === uid;
        if (!window.confirm(souEu ? 'Sair da gestão "' + esp.nome + '"?\n\nVocê deixa de ver os lançamentos dela. Para voltar, vai precisar de um código novo.' : 'Tirar ' + (nomeAlvo || 'esta pessoa') + ' da gestão "' + esp.nome + '"?')) return;
        try {
          const db = sessao.fb.firestore();
          const apagarCampo = sessao.fb.firestore.FieldValue.delete();
          await db.collection('espacos').doc(esp.id).update({ ['membros.' + uidAlvo]: apagarCampo, ['nomes.' + uidAlvo]: apagarCampo });
          if (souEu) {
            await db.collection('perfis').doc(uid).set({ espacos: sessao.fb.firestore.FieldValue.arrayRemove(esp.id) }, { merge: true });
            try { localStorage.removeItem(chaveCacheEspaco(esp.id)); } catch (e) {}
            if (espacoAtivoRef.current && espacoAtivoRef.current.id === esp.id) abrirEspaco(null);
          }
          await carregarEspacos();
          exibirNotificacao(souEu ? 'Você saiu da gestão' : (nomeAlvo || 'A pessoa') + ' saiu da gestão');
        } catch (e) {
          console.error(e);
          exibirNotificacao('Não foi possível concluir. Tente de novo.');
        }
      };

      // Dono troca o código (o antigo deixa de funcionar)
      const novoCodigoEspaco = async (esp) => {
        const sessao = nuvemRef.current;
        if (!sessao || !window.confirm('Gerar um código novo? O código antigo deixa de funcionar (quem já entrou continua).')) return;
        try {
          const db = sessao.fb.firestore();
          const uid = sessao.fb.auth().currentUser.uid;
          const codigo = gerarCodigoConvite();
          const agora = new Date().toISOString();
          await db.collection('convites').doc(codigo).set({ espaco: esp.id, nomeEspaco: esp.nome, nomeDono: nomeAutor, criadoPor: uid, ativo: true, criadoEm: agora });
          if (esp.codigo) await db.collection('convites').doc(esp.codigo).delete().catch(() => {});
          await db.collection('espacos').doc(esp.id).update({ codigo });
          await carregarEspacos();
          exibirNotificacao('Código novo: ' + codigo);
        } catch (e) {
          console.error(e);
          exibirNotificacao('Não foi possível gerar o código. Tente de novo.');
        }
      };

      // Dono exclui a gestão compartilhada inteira
      const excluirEspaco = async (esp) => {
        const sessao = nuvemRef.current;
        if (!sessao) return;
        if (!window.confirm('Excluir a gestão "' + esp.nome + '" para todos?\n\nOs lançamentos, metas e contas fixas dela são apagados e ninguém mais vê. As gestões pessoais não mudam. Não dá para desfazer.')) return;
        if (!window.confirm('Última confirmação: excluir "' + esp.nome + '"?')) return;
        try {
          const db = sessao.fb.firestore();
          const uid = sessao.fb.auth().currentUser.uid;
          if (espacoAtivoRef.current && espacoAtivoRef.current.id === esp.id) abrirEspaco(null);
          await apagarGestaoNaNuvem(db, esp);
          await db.collection('perfis').doc(uid).set({ espacos: sessao.fb.firestore.FieldValue.arrayRemove(esp.id) }, { merge: true });
          try { localStorage.removeItem(chaveCacheEspaco(esp.id)); } catch (e) {}
          await carregarEspacos();
          exibirNotificacao('Gestão "' + esp.nome + '" excluída');
        } catch (e) {
          console.error(e);
          exibirNotificacao('Não foi possível excluir a gestão. Tente de novo.');
        }
      };

      const copiarCodigo = async (codigo) => {
        try { await navigator.clipboard.writeText(codigo); exibirNotificacao('Código copiado: ' + codigo); }
        catch (e) { window.prompt('Copie o código:', codigo); }
      };

      // Ao voltar para o app (trocou de aba ou desbloqueou o celular), busca o que mudou na nuvem
      useEffect(() => {
        const aoVoltar = () => { if (document.visibilityState === 'visible' && nuvemRef.current && !timerNuvem.current) sincronizar(); };
        // Também tenta quando a internet volta e, com o app aberto na tela, a cada 2 minutos
        const aoReconectar = () => { if (nuvemRef.current && !timerNuvem.current) sincronizar(); };
        const periodico = setInterval(() => { if (document.visibilityState === 'visible' && navigator.onLine !== false) aoReconectar(); }, 120000);
        document.addEventListener('visibilitychange', aoVoltar);
        window.addEventListener('online', aoReconectar);
        return () => { document.removeEventListener('visibilitychange', aoVoltar); window.removeEventListener('online', aoReconectar); clearInterval(periodico); };
      }, []);

      // Liga o login quando o Firebase estiver configurado (com ele ligado, o app só abre depois de entrar)
      useEffect(() => {
        if (!FIREBASE_CONFIG) return;
        let cancelado = false;
        carregarFirebase().then(fb => {
          if (cancelado) return;
          fb.auth().languageCode = 'pt-BR';
          fb.auth().getRedirectResult().catch(() => {});
          fb.auth().onAuthStateChanged(async (user) => {
            if (!user) { fecharEscutasConta(); setWhatsappLigado(null); setCodigoWhatsapp(null); nuvemRef.current = null; setUsuarioNuvem(null); setStatusNuvem('saiu'); setEhAdmin(false); setAcessos(null); setEstadoLogin('fora'); return; }
            const db = fb.firestore();
            const perfil = { uid: user.uid, nome: user.displayName || user.email, email: user.email, foto: user.photoURL };
            setStatusNuvem('conectando');

            // Registro de acesso (o que o administrador vê: cadastro e datas, nunca dados financeiros).
            // Se o administrador bloqueou a conta, ela não abre.
            try {
              const acessoDoc = db.collection('acessos').doc(user.uid);
              const acessoSnap = await acessoDoc.get();
              const acesso = acessoSnap.exists ? acessoSnap.data() : null;
              if (acesso && acesso.bloqueado) {
                cadastroPendente = null;
                setAvisoLogin('O acesso desta conta foi bloqueado pelo administrador. Fale com o responsável pelo app.');
                nuvemRef.current = null;
                await fb.auth().signOut();
                return;
              }
              const novo = cadastroPendente && cadastroPendente.email === String(user.email || '').toLowerCase() ? cadastroPendente : null;
              cadastroPendente = null;
              perfil.nome = (acesso && acesso.nomeCompleto) || (novo && novo.nome) || perfil.nome;
              const agoraAcesso = new Date().toISOString();
              await acessoDoc.set(acesso
                ? { ultimoAcesso: agoraAcesso, totalAcessos: (Number(acesso.totalAcessos) || 0) + 1 }
                : { nomeCompleto: perfil.nome, email: user.email, ...(novo && novo.idade ? { idade: novo.idade } : {}), criadoEm: agoraAcesso, ultimoAcesso: agoraAcesso, totalAcessos: 1, bloqueado: false }, { merge: true });
              const adminSnap = await db.collection('admins').doc(user.uid).get().catch(() => null);
              setEhAdmin(!!(adminSnap && adminSnap.exists));
            } catch (e) {
              // Sem internet: segue com os dados do aparelho; o registro de acesso fica para a próxima vez
              console.error('Registro de acesso:', e);
            }
            setAvisoLogin('');
            setUsuarioNuvem(perfil);
            const doc = db.collection('usuarios').doc(user.uid);
            // Os dados deste aparelho são de outra conta? Não mistura: apaga daqui e usa os desta conta.
            const uidAnterior = lerChave(CHAVE_UID_NUVEM);
            if (uidAnterior && uidAnterior !== user.uid && temDados(lerLocal())) {
              // A outra conta mexeu no aparelho e ainda não mandou para a nuvem (ex.: sem internet)?
              // Então esses dados só existem aqui: guarda um backup antes de apagar.
              const versaoLocalAnterior = lerChave(CHAVE_VERSAO_LOCAL);
              const pendente = !!versaoLocalAnterior && versaoLocalAnterior !== lerChave(CHAVE_BASE_NUVEM);
              const trocar = window.confirm(pendente
                ? 'Este aparelho tem dados de outra conta, e parte deles AINDA NÃO FOI para a nuvem (talvez por falta de internet).\n\nOK = salvar um arquivo de backup com esses dados, apagar daqui e carregar os da conta ' + (user.email || '') + '\nCancelar = não entrar agora (a outra pessoa pode entrar de novo, com internet, para enviar)'
                : 'Este aparelho tem dados de outra conta.\n\nOK = apagar esses dados daqui (eles continuam na outra conta) e carregar os da conta ' + (user.email || '') + '\nCancelar = não entrar agora');
              if (!trocar) { nuvemRef.current = null; await fb.auth().signOut(); return; }
              if (pendente) baixarBackup(lerLocal(), 'backup-conta-anterior-' + hojeISO() + '.json');
              limparAparelho();
            }
            gravarChave(CHAVE_UID_NUVEM, user.uid);
            nuvemRef.current = { fb, doc, nome: perfil.nome, email: perfil.email };
            setEstadoLogin('dentro');
            await sincronizar();
            // Lançamentos que chegaram pelo WhatsApp (depois da primeira sincronização, para não gerar conflito)
            ligarEscutasConta(fb, user.uid);
            // Gestões compartilhadas: reabre a que estava aberta (se a pessoa ainda participa)
            const lista = await carregarEspacos();
            const salvo = espacoAtivoRef.current;
            const atual = salvo && lista.find(e => e.id === salvo.id);
            if (atual) abrirEspaco({ id: atual.id, nome: atual.nome, papel: atual.papel });
          });
        }).catch(() => {
          // Sem internet para carregar o login: quem já entrou neste aparelho usa os dados daqui
          setStatusNuvem('erro');
          setEstadoLogin(lerChave(CHAVE_UID_NUVEM) ? 'offline' : 'sem-internet');
        });
        return () => { cancelado = true; };
      }, []);

      // Mensagens de erro do login em português
      const traduzirErroLogin = (e) => ({
        'auth/invalid-email': 'Esse e-mail não parece certo. Confira se digitou tudo.',
        'auth/missing-email': 'Digite o seu e-mail.',
        'auth/missing-password': 'Digite a sua senha.',
        'auth/user-not-found': 'Não achamos conta com esse e-mail. Toque em "Criar conta".',
        'auth/wrong-password': 'Senha errada. Tente de novo ou toque em "Esqueci a senha".',
        'auth/invalid-credential': 'E-mail ou senha errados. Tente de novo ou toque em "Esqueci a senha".',
        'auth/invalid-login-credentials': 'E-mail ou senha errados. Tente de novo ou toque em "Esqueci a senha".',
        'auth/email-already-in-use': 'Já existe conta com esse e-mail. Toque em "Entrar".',
        'auth/weak-password': 'A senha precisa ter pelo menos 6 caracteres.',
        'auth/too-many-requests': 'Muitas tentativas seguidas. Espere alguns minutos e tente de novo.',
        'auth/network-request-failed': 'Sem internet. Conecte-se e tente de novo.',
        'auth/popup-closed-by-user': 'A janela do Google foi fechada antes de terminar.',
        'auth/cancelled-popup-request': 'A janela do Google foi fechada antes de terminar.',
        'auth/account-exists-with-different-credential': 'Esse e-mail já entra de outro jeito (Google ou senha). Use a forma que você usou da primeira vez.',
        'auth/operation-not-allowed': 'Essa forma de entrar ainda não foi ligada no Firebase.'
      }[e && e.code] || 'Não foi possível entrar. Tente de novo.');

      const entrarComGoogle = async () => {
        const fb = await carregarFirebase();
        const provedor = new fb.auth.GoogleAuthProvider();
        provedor.setCustomParameters({ prompt: 'select_account' });
        const instalado = window.matchMedia && window.matchMedia('(display-mode: standalone)').matches;
        if (instalado) { await fb.auth().signInWithRedirect(provedor); return; }
        try { await fb.auth().signInWithPopup(provedor); }
        catch (e) { if (e && (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment')) await fb.auth().signInWithRedirect(provedor); else throw e; }
      };

      const entrarComEmail = async (email, senha) => {
        const fb = await carregarFirebase();
        await fb.auth().signInWithEmailAndPassword(email.trim(), senha);
      };

      const criarContaEmail = async (nome, email, senha, idade) => {
        const fb = await carregarFirebase();
        const nomeLimpo = nome.trim();
        // Guarda o cadastro antes de criar a conta: o registro de acesso é feito logo que ela entra
        cadastroPendente = { email: email.trim().toLowerCase(), nome: nomeLimpo, idade };
        let cred;
        try { cred = await fb.auth().createUserWithEmailAndPassword(email.trim(), senha); }
        catch (e) { cadastroPendente = null; throw e; }
        if (nomeLimpo && cred.user) {
          await cred.user.updateProfile({ displayName: nomeLimpo });
          setUsuarioNuvem(u => (u ? { ...u, nome: nomeLimpo } : u));
          if (nuvemRef.current) nuvemRef.current.nome = nomeLimpo;
        }
      };

      const esqueciSenha = async (email) => {
        const fb = await carregarFirebase();
        fb.auth().languageCode = 'pt-BR';
        await fb.auth().sendPasswordResetEmail(email.trim());
      };

      // Sair: primeiro garante que tudo foi para a nuvem, depois apaga os dados deste aparelho
      // (assim quem usar o aparelho depois não vê nem leva os seus dados)
      const sairDaConta = async () => {
        if (!window.confirm('Sair da conta?\n\nSeus dados ficam guardados na sua conta e são apagados deste aparelho. Para vê-los de novo, é só entrar outra vez.')) return;
        clearTimeout(timerNuvem.current); timerNuvem.current = null;
        let r = await sincronizar();
        if (r === 'ocupado') { await new Promise(ok => setTimeout(ok, 1500)); r = await sincronizar(); }
        if (r === 'erro' || r === 'ocupado') {
          if (!window.confirm('Não foi possível enviar as últimas mudanças para a sua conta (sem internet?).\n\nSe sair agora, o app salva um arquivo de backup com elas antes de apagar deste aparelho. Sair mesmo assim?')) return;
          baixarBackup(lerLocal(), 'backup-antes-de-sair-' + hojeISO() + '.json');
        }
        nuvemRef.current = null;
        try { const fb = await carregarFirebase(); await fb.auth().signOut(); } catch (e) {}
