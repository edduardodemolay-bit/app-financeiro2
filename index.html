          const hist2 = anotar('Voltou a usar categoria', parada + ' · ' + formatarMoeda(val));
          salvarTudoNoDisco({ categoriasExtras: novasExtras2, limitesCategorias: novosLimites2, historico: hist2 });
          exibirNotificacao('"' + parada + '" voltou a valer a partir de agora');
          return;
        }
        const todas = [...catEntrada, ...catSaida, 'Metas'].filter(c => c !== categoriaEditando);
        if (nome !== categoriaEditando && todas.some(c => c.toLowerCase() === nome.toLowerCase())) { setErroCategoria('Já existe uma categoria chamada "' + nome + '".'); return; }

        let novosLimites = { ...limitesCategorias };
        let novasExtras = categoriasExtras;
        let novos = { transacoes, recorrentes };
        if (criandoCategoria) {
          // Guarda o mês em que nasceu: no mês seguinte o app pergunta se ela continua
          novasExtras = { ...categoriasExtras, [grupo]: [...(categoriasExtras[grupo] || []), nome], info: { ...categoriasExtras.info, [chaveInfo(grupo, nome)]: { criadaEm: mesSelecionado, confirmada: false } } };
        } else if (nome !== categoriaEditando) {
          const info = { ...categoriasExtras.info };
          if (info[chaveInfo(grupo, categoriaEditando)]) { info[chaveInfo(grupo, nome)] = info[chaveInfo(grupo, categoriaEditando)]; delete info[chaveInfo(grupo, categoriaEditando)]; }
          novasExtras = { ...categoriasExtras, [grupo]: categoriasExtras[grupo].map(c => (c === categoriaEditando ? nome : c)), info };
          delete novosLimites[chaveLimite(grupo, categoriaEditando)];
          novos = trocarCategoriaNosLancamentos(grupo, categoriaEditando, nome);
        }
        novosLimites[chaveLimite(grupo, nome)] = val;

        setLimitesCategorias(novosLimites);
        setCategoriasExtras(novasExtras);
        setTransacoes(novos.transacoes);
        setRecorrentes(novos.recorrentes);
        fecharCategoria();
        const hist = anotar(criandoCategoria ? 'Criou categoria' : nome !== categoriaEditando ? 'Renomeou categoria' : 'Ajustou planejamento', (nome !== categoriaEditando && !criandoCategoria ? categoriaEditando + ' → ' : '') + nome + ' · ' + formatarMoeda(val));
        salvarTudoNoDisco({ limitesCategorias: novosLimites, categoriasExtras: novasExtras, transacoes: novos.transacoes, recorrentes: novos.recorrentes, historico: hist });
        exibirNotificacao(criandoCategoria ? 'Categoria "' + nome + '" criada' : 'Categoria atualizada');
      }

      // Resposta à pergunta "a categoria continua nos próximos meses?"
      function responderCategoria(grupo, cat, continua) {
        const chave = chaveInfo(grupo, cat);
        const atual = categoriasExtras.info[chave] || {};
        const novoInfo = continua ? { ...atual, confirmada: true, ate: null } : { ...atual, confirmada: false, ate: atual.criadaEm };
        const novasExtras = { ...categoriasExtras, info: { ...categoriasExtras.info, [chave]: novoInfo } };
        setCategoriasExtras(novasExtras);
        const hist = anotar(continua ? 'Manteve categoria nos próximos meses' : 'Deixou categoria só no mês em que criou', cat + (continua ? '' : ' · ' + nomeDoMes(atual.criadaEm)));
        salvarTudoNoDisco({ categoriasExtras: novasExtras, historico: hist });
        exibirNotificacao(continua ? '"' + cat + '" continua nos próximos meses' : '"' + cat + '" fica só em ' + nomeDoMes(atual.criadaEm).toLowerCase());
      }

      function excluirCategoria() {
        const grupo = grupoEditando, cat = categoriaEditando;
        if (!ehCategoriaCriada(grupo, cat)) return;
        const usados = transacoes.filter(t => t.category === cat).length;
        if (!confirm('Excluir a categoria "' + cat + '"?' + (usados ? ' Os ' + usados + ' lançamentos dela passam para "Outros".' : ''))) return;
        const infoSem = { ...categoriasExtras.info };
        delete infoSem[chaveInfo(grupo, cat)];
        const novasExtras = { ...categoriasExtras, [grupo]: categoriasExtras[grupo].filter(c => c !== cat), info: infoSem };
        const novosLimites = { ...limitesCategorias };
        delete novosLimites[chaveLimite(grupo, cat)];
        const novos = trocarCategoriaNosLancamentos(grupo, cat, 'Outros');
        setCategoriasExtras(novasExtras);
        setLimitesCategorias(novosLimites);
        setTransacoes(novos.transacoes);
        setRecorrentes(novos.recorrentes);
        fecharCategoria();
        const hist = anotar('Excluiu categoria', cat);
        salvarTudoNoDisco({ limitesCategorias: novosLimites, categoriasExtras: novasExtras, transacoes: novos.transacoes, recorrentes: novos.recorrentes, historico: hist });
        exibirNotificacao('Categoria excluída');
      }

      const abrirModalComData = (dataFormatted, peloCalendario = false) => {
        setEditandoId(null);
        setRepetirMensal(false);
        setRepetirDias(false);
        setDoCalendario(peloCalendario);
        setDestinoReceita('conta');
        setDescricao(''); setValor(''); setErroTransacao('');
        setDataTransacao(dataFormatted);
        setModalTransacaoAberto(true);
      };

      const renderIconeTipo = (t) => {
        if (t === 'receita') return <TrendingUp size={18} />;
        if (t === 'despesa') return <TrendingDown size={18} />;
        return <ShoppingBag size={18} />;
      };

      const renderCorTipo = (t) => {
        if (t === 'receita') return 'var(--accent-text)';
        if (t === 'despesa') return 'var(--danger-text)';
        return '#f59e0b';
      };

      const renderBgTipo = (t) => {
        if (t === 'receita') return 'rgba(var(--accent-rgb), 0.15)';
        if (t === 'despesa') return 'rgba(244, 63, 94, 0.15)';
        return 'rgba(245, 158, 11, 0.15)';
      };

      const gerarDiasDoMes = (ano, mesIndice) => {
        const primeiroDia = new Date(ano, mesIndice, 1).getDay();
        const totalDias = new Date(ano, mesIndice + 1, 0).getDate();
        return { primeiroDia, totalDias };
      };

      const transacoesPorDia = transacoes.reduce((acc, t) => {
        if (!acc[t.date]) acc[t.date] = [];
        acc[t.date].push(t);
        return acc;
      }, {});

      const transacoesDiaSelecionado = transacoes.filter(t => t.date === diaSelecionado);

      // Planilha para abrir no Excel ou Google Planilhas (separada por ";" para o Excel em português)
      const exportarPlanilha = () => {
        const cel = (v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
        const linhas = [['Data', 'Descrição', 'Tipo', 'Categoria', 'Valor', 'Lançado por'].map(cel).join(';')];
        [...transacoes].sort((a, b) => a.date.localeCompare(b.date)).forEach(t => {
          const tipoTexto = t.type === 'receita' ? 'Receita' : t.type === 'despesa' ? 'Despesa' : 'Gasto';
          const valorTexto = (t.type === 'receita' ? '' : '-') + Number(t.amount).toFixed(2).replace('.', ',');
          linhas.push([formatarDataBR(t.date), t.description, tipoTexto, t.category, valorTexto, t.autor || ''].map(cel).join(';'));
        });
        const blob = new Blob(['﻿' + linhas.join('\r\n')], { type: 'text/csv;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'lancamentos-' + hojeISO() + '.csv';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        exibirNotificacao('📊 Planilha exportada!');
      };

      const exportarDados = () => {
        const dados = { versao: 4, exportadoEm: new Date().toISOString(), transacoes, limitesCategorias, metas, recorrentes, categoriasExtras, historico };
        const blob = new Blob([JSON.stringify(dados, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'backup-financeiro-' + hojeISO() + '.json';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        exibirNotificacao('📤 Backup exportado!');
      };

      const importarDados = (e) => {
        const arquivo = e.target.files && e.target.files[0];
        if (!arquivo) return;
        const leitor = new FileReader();
        leitor.onload = () => {
          try {
            const d = JSON.parse(leitor.result);
            if (!d || !Array.isArray(d.transacoes)) throw new Error('formato invalido');
            if (!window.confirm('Isso vai substituir os dados atuais deste aparelho. Continuar?')) return;
            const limites = d.limitesCategorias ? { ...limitesCategorias, ...d.limitesCategorias } : limitesCategorias;
            const novasMetas = Array.isArray(d.metas) ? d.metas.map(normalizarMeta) : metas;

                    </div>
                  </div>
                  {!criandoCategoria && !ehCategoriaCriada(grupoEditando, categoriaEditando) && (
                    <p style={{ margin: 0, fontSize: '11px', color: 'var(--text-faint)' }}>Categoria padrão do app: dá para mudar o valor. Nome e exclusão só nas categorias que você criar.</p>
                  )}
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    // ===== TELA DE ENTRADA (login obrigatório quando o Firebase está ligado) =====
    function TelaLogin({ estado, aoGoogle, aoEntrar, aoCriar, aoEsqueci, traduzir, aoTentarDeNovo }) {
      const [modo, setModo] = useState('entrar'); // 'entrar' | 'criar' | 'esqueci'
      const [nome, setNome] = useState('');
      const [email, setEmail] = useState('');
      const [senha, setSenha] = useState('');
      const [verSenha, setVerSenha] = useState(false);
      const [erro, setErro] = useState('');
      const [aviso, setAviso] = useState('');
      const [ocupado, setOcupado] = useState(false);

      const rodar = async (acao) => {
        setErro(''); setAviso(''); setOcupado(true);
        try { await acao(); } catch (e) { setErro(traduzir(e)); } finally { setOcupado(false); }
      };
      const trocarModo = (m) => { setModo(m); setErro(''); setAviso(''); };

      const enviar = (e) => {
        e.preventDefault();
        if (modo === 'esqueci') return rodar(async () => {
          if (!email.trim()) throw { code: 'auth/missing-email' };
          await aoEsqueci(email);
          setModo('entrar');
          setAviso('Pronto! Enviamos um link para ' + email.trim() + '. Abra o e-mail (veja também o spam) para criar uma senha nova.');
        });
        if (!email.trim()) return setErro('Digite o seu e-mail.');
        if (!senha) return setErro('Digite a sua senha.');
        if (modo === 'criar') return rodar(async () => {
          if (senha.length < 6) throw { code: 'auth/weak-password' };
          await aoCriar(nome, email, senha);
        });
        return rodar(() => aoEntrar(email, senha));
      };

      const campo = { width: '100%', backgroundColor: 'var(--bg)', border: '1px solid var(--border-strong)', borderRadius: '12px', padding: '12px 14px', color: 'var(--text)', fontSize: '16px', outline: 'none', boxSizing: 'border-box', marginTop: '6px' };
      const rotulo = { fontSize: '12px', fontWeight: 'bold', color: 'var(--text-muted)' };
      const linkBotao = { background: 'none', border: 'none', color: 'var(--accent-text)', fontWeight: '700', fontSize: '13px', cursor: 'pointer', padding: '4px' };

      return (
        <div style={{ minHeight: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '24px 16px', backgroundColor: 'var(--bg)', boxSizing: 'border-box' }}>
          <div style={{ width: '100%', maxWidth: '400px', display: 'flex', flexDirection: 'column', gap: '18px' }}>
            <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '10px', textAlign: 'center' }}>
              <img src="./logo.png" alt="Logo EddFinança" width="72" height="72" style={{ borderRadius: '20px', boxShadow: '0 10px 24px rgba(59, 41, 152, 0.3)' }} />
              <h1 style={{ margin: 0, fontSize: '26px', fontWeight: '800', color: 'var(--text-strong)' }}>EddFinança</h1>
              <p style={{ margin: 0, fontSize: '14px', color: 'var(--text-muted)' }}>
                {modo === 'criar' ? 'Crie sua conta para guardar suas finanças com segurança.' : modo === 'esqueci' ? 'Vamos te mandar um link para criar uma senha nova.' : 'Entre para ver suas finanças em qualquer aparelho.'}
              </p>
            </div>

            {estado === 'carregando' ? (
              <p style={{ textAlign: 'center', color: 'var(--text-muted)', fontSize: '14px' }}>Abrindo…</p>
            ) : (
              <div style={{ backgroundColor: 'var(--surface)', border: '1px solid var(--border)', borderRadius: '20px', padding: '22px', display: 'flex', flexDirection: 'column', gap: '14px', boxShadow: '0 20px 40px -20px rgba(0,0,0,0.35)' }}>
                {estado === 'sem-internet' && (
                  <div role="alert" style={{ backgroundColor: 'rgba(245, 158, 11, 0.12)', border: '1px solid rgba(245, 158, 11, 0.4)', color: 'var(--c-amber)', borderRadius: '10px', padding: '10px 12px', fontSize: '13px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: '10px' }}>
                    <span>Sem internet. Conecte-se para entrar pela primeira vez neste aparelho.</span>
                    <button type="button" onClick={aoTentarDeNovo} style={{ ...linkBotao, color: 'var(--c-amber)' }}>Tentar de novo</button>
                  </div>
                )}
                {erro && <div role="alert" style={{ backgroundColor: 'rgba(244,63,94,0.12)', color: 'var(--danger-text)', padding: '10px 12px', borderRadius: '10px', fontSize: '13px' }}>{erro}</div>}
                {aviso && <div role="status" style={{ backgroundColor: 'rgba(var(--accent-rgb), 0.12)', color: 'var(--accent-text)', padding: '10px 12px', borderRadius: '10px', fontSize: '13px' }}>{aviso}</div>}

                {modo !== 'esqueci' && (
                  <React.Fragment>
                    <button type="button" disabled={ocupado} onClick={() => rodar(aoGoogle)} style={{ width: '100%', padding: '13px 14px', borderRadius: '12px', border: '1px solid var(--border-strong)', backgroundColor: 'var(--surface)', color: 'var(--text-strong)', fontWeight: '700', fontSize: '15px', cursor: ocupado ? 'wait' : 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '10px' }}>
                      <span style={{ fontWeight: '900', fontSize: '18px', color: '#4285F4' }}>G</span> {modo === 'criar' ? 'Criar conta com Google' : 'Entrar com Google'}
                    </button>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '10px', color: 'var(--text-faint)', fontSize: '12px' }}>
                      <span style={{ flex: 1, height: '1px', backgroundColor: 'var(--border)' }} /> ou com e-mail <span style={{ flex: 1, height: '1px', backgroundColor: 'var(--border)' }} />
                    </div>
                  </React.Fragment>
                )}

                <form onSubmit={enviar} style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
                  {modo === 'criar' && (
                    <div>
                      <label htmlFor="login-nome" style={rotulo}>Seu nome</label>
                      <input id="login-nome" type="text" autoComplete="name" value={nome} onChange={e => setNome(e.target.value)} placeholder="Como quer ser chamado" maxLength={40} style={campo} />
                    </div>
                  )}
                  <div>
                    <label htmlFor="login-email" style={rotulo}>E-mail</label>
                    <input id="login-email" type="email" inputMode="email" autoComplete="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="voce@exemplo.com" style={campo} />
                  </div>
                  {modo !== 'esqueci' && (
                    <div>
                      <label htmlFor="login-senha" style={rotulo}>{modo === 'criar' ? 'Crie uma senha (mínimo 6 caracteres)' : 'Senha'}</label>
                      <div style={{ position: 'relative' }}>
                        <input id="login-senha" type={verSenha ? 'text' : 'password'} autoComplete={modo === 'criar' ? 'new-password' : 'current-password'} value={senha} onChange={e => setSenha(e.target.value)} style={{ ...campo, paddingRight: '64px' }} />
                        <button type="button" onClick={() => setVerSenha(!verSenha)} aria-label={verSenha ? 'Esconder senha' : 'Mostrar senha'} style={{ ...linkBotao, position: 'absolute', right: '8px', top: '50%', transform: 'translateY(-40%)', fontSize: '12px', color: 'var(--text-muted)' }}>{verSenha ? 'Esconder' : 'Mostrar'}</button>
                      </div>
                    </div>
                  )}
                  <button type="submit" disabled={ocupado} style={{ width: '100%', background: 'linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%)', color: 'var(--on-accent)', padding: '13px 16px', borderRadius: '12px', fontWeight: 'bold', fontSize: '15px', border: 'none', cursor: ocupado ? 'wait' : 'pointer', opacity: ocupado ? 0.7 : 1 }}>
                    {ocupado ? 'Aguarde…' : modo === 'criar' ? 'Criar conta' : modo === 'esqueci' ? 'Enviar link' : 'Entrar'}
                  </button>
                </form>

                <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '4px', fontSize: '13px', color: 'var(--text-muted)' }}>
                  {modo === 'entrar' && <button type="button" onClick={() => trocarModo('esqueci')} style={{ ...linkBotao, color: 'var(--text-muted)', fontWeight: '600' }}>Esqueci a senha</button>}
                  {modo === 'entrar'
                    ? <span>Ainda não tem conta? <button type="button" onClick={() => trocarModo('criar')} style={linkBotao}>Criar conta</button></span>
                    : <span>{modo === 'criar' ? 'Já tem conta?' : 'Lembrou a senha?'} <button type="button" onClick={() => trocarModo('entrar')} style={linkBotao}>Entrar</button></span>}
                </div>
              </div>
            )}

            <p style={{ margin: 0, textAlign: 'center', fontSize: '11px', color: 'var(--text-faint)' }}>Seus dados ficam guardados na sua conta e só você tem acesso a eles.</p>
          </div>
        </div>
      );
    }

    // Se algo der errado, mostra um aviso com botão de recarregar em vez de tela em branco.
    // Os dados continuam salvos no aparelho.
    class ProtecaoErro extends React.Component {
      constructor(props) { super(props); this.state = { erro: null }; }
      static getDerivedStateFromError(erro) { return { erro }; }
      componentDidCatch(erro) { console.error('Erro no app:', erro); }
      render() {
        if (!this.state.erro) return this.props.children;
        return (
          <div style={{ minHeight: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '24px', textAlign: 'center' }}>
            <div>
              <h2 style={{ margin: '0 0 8px 0', color: 'var(--text-strong)' }}>Ops, algo deu errado.</h2>
              <p style={{ margin: '0 0 20px 0', color: 'var(--text-muted)' }}>Seus dados continuam salvos neste aparelho.</p>
              <button onClick={() => location.reload()} style={{ padding: '12px 20px', borderRadius: '12px', border: 'none', backgroundColor: 'var(--accent)', color: 'var(--on-accent)', fontWeight: 'bold', cursor: 'pointer' }}>Recarregar o app</button>
            </div>
          </div>
        );
      }
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<ProtecaoErro><App /></ProtecaoErro>);
  </script>
</body>
</html>
